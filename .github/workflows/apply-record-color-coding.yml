name: Apply record color coding

on:
  push:
    paths:
      - ".github/workflows/apply-record-color-coding.yml"
      - "scripts/apply_record_color_coding.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply record color coding
        run: python scripts/apply_record_color_coding.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build and type validation
        run: npm run build

      - name: Commit verified record color coding to main
        run: |
          rm -f .github/workflows/apply-record-color-coding.yml scripts/apply_record_color_coding.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No target changes to commit."
            exit 0
          fi
          git commit -m "Color-code record performance across sports"
          git push origin HEAD:main

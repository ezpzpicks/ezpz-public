name: Fix NFL Trend V2 model gap

on:
  push:
    paths:
      - ".github/workflows/fix-nfl-trend-v2-model-gap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply NFL Trend V2 model-gap patch
        run: python scripts/patch_nfl_trend_v2_model_gap.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit NFL Trend V2 calculation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicData.ts app/FootballBoard.tsx
          if git diff --cached --quiet; then
            echo "No application changes required."
            exit 0
          fi
          git commit -m "Use NFL V2 model gap for trend EZPZ qualification"
          git push

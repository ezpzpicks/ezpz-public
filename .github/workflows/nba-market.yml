name: NBA ScoresAndOdds checks
on:
  pull_request:
    paths: ['lib/nba*.ts', 'lib/catalog/nbaCatalog.ts', 'lib/footballSignals.ts', 'lib/footballTeamTrends.ts', 'lib/footballTrendCatalog.ts', 'lib/footballWeeklyMarket.ts', 'lib/tursoStore.ts', 'lib/scheduledMarketRefresh.ts', 'lib/scoresAndOddsBettingSplits.ts', 'app/Nba*.tsx', 'app/FootballSignalsBoard.tsx', 'app/FootballTrendMarketBoard.tsx', 'app/FootballBoardBase.tsx', 'app/globals.css', 'app/page.tsx', 'app/api/nba-*/**', 'app/api/cron/nba-market/**', 'tests/nba-*', 'tests/nfl-last-seven.test.cjs', 'tests/fixtures/nba-consensus-2026-10-22.json', '.github/workflows/nba-market.yml']
  push:
    branches: [main]
    paths: ['lib/nba*.ts', 'lib/catalog/nbaCatalog.ts', 'app/Nba*.tsx', 'tests/nba-*', '.github/workflows/nba-market.yml']
permissions:
  contents: read
jobs:
  nba-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: node tests/nba-market.cjs
      - run: node --test tests/nba-signals.test.cjs tests/nba-signals-ui.test.cjs tests/football-signals.test.cjs tests/football-signals-ui.test.cjs tests/football-signals-history.test.cjs tests/football-team-trends.test.cjs tests/football-trend-catalog.test.cjs tests/nfl-ezpz-wilson.test.cjs tests/ncaaf-public-trend-leaderboard.test.cjs tests/nfl-last-seven.test.cjs
      - run: npx tsc --noEmit

name: NBA ScoresAndOdds checks
on:
  pull_request:
    paths: ['lib/selectionTrial*.ts', 'lib/selectionFade.ts', 'app/FadeTrialPanel.tsx', 'app/data/selection-fade-*.json', 'tests/selection-fade*.cjs', 'tests/fixtures/selection-fade-*', 'lib/ncaamAnalysis.ts', 'app/SelectionTrial.tsx', 'app/api/selection-trial/**', 'app/selection-trial/**', 'app/api/cron/football-public-snapshot/**', 'app/api/public-data-v2/**', 'tests/selection-trial*.cjs', 'lib/nba*.ts', 'lib/catalog/nbaCatalog.ts', 'lib/footballSignals.ts', 'lib/signalCombinationResearch.ts', 'lib/footballTeamTrends.ts', 'lib/footballTrendCatalog.ts', 'lib/footballWeeklyMarket.ts', 'lib/tursoStore.ts', 'lib/scheduledMarketRefresh.ts', 'lib/marketRefreshPolicy.ts', 'lib/scoresAndOddsBettingSplits.ts', 'tests/ncaaf-snapshot-timing.cjs', 'tests/scores-and-odds-ncaaf-schedule.cjs', 'tests/ncaaf-schedule-kickoff-recovery.test.cjs', 'tests/football-weekly-chart-route.test.cjs', 'app/Nba*.tsx', 'app/FootballSignalsBoard.tsx', 'app/FootballTrendMarketBoard.tsx', 'app/FootballBoardBase.tsx', 'app/globals.css', 'app/page.tsx', 'app/api/nba-*/**', 'app/api/cron/nba-market/**', 'tests/nba-*', 'tests/signal-combinations.test.cjs', 'tests/market-*', 'tests/scheduled-refresh-routes.test.cjs', 'tests/nfl-last-seven.test.cjs', 'tests/fixtures/nba-consensus*', '.github/workflows/nba-market.yml']
  push:
    branches: [main]
    paths: ['lib/selectionTrial*.ts', 'lib/selectionFade.ts', 'app/FadeTrialPanel.tsx', 'app/data/selection-fade-*.json', 'tests/selection-fade*.cjs', 'tests/fixtures/selection-fade-*', 'lib/ncaamAnalysis.ts', 'app/SelectionTrial.tsx', 'app/api/selection-trial/**', 'app/selection-trial/**', 'app/api/cron/football-public-snapshot/**', 'app/api/public-data-v2/**', 'tests/selection-trial*.cjs', 'lib/nba*.ts', 'lib/catalog/nbaCatalog.ts', 'lib/signalCombinationResearch.ts', 'lib/marketRefreshPolicy.ts', 'lib/scheduledMarketRefresh.ts', 'lib/scoresAndOddsBettingSplits.ts', 'tests/ncaaf-snapshot-timing.cjs', 'tests/scores-and-odds-ncaaf-schedule.cjs', 'tests/ncaaf-schedule-kickoff-recovery.test.cjs', 'tests/football-weekly-chart-route.test.cjs', 'app/Nba*.tsx', 'tests/nba-*', 'tests/signal-combinations.test.cjs', 'tests/market-*', 'tests/scheduled-refresh-routes.test.cjs', 'tests/fixtures/nba-consensus*', '.github/workflows/nba-market.yml']
permissions:
  contents: read
jobs:
  nba-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: node tests/nba-market.cjs
      - run: node --test tests/ncaaf-snapshot-timing.cjs tests/scores-and-odds-ncaaf-schedule.cjs tests/ncaaf-schedule-kickoff-recovery.test.cjs tests/football-weekly-chart-route.test.cjs
      - run: node --test tests/market-refresh-policy.test.cjs tests/scheduled-refresh-routes.test.cjs tests/market-source-rollover.test.cjs tests/nba-collection-recovery.test.cjs
      - run: node --test tests/nba-signals.test.cjs tests/nba-signals-ui.test.cjs tests/signal-combinations.test.cjs tests/nba-signal-research-migration.test.cjs tests/football-signals.test.cjs tests/football-signals-ui.test.cjs tests/football-signals-history.test.cjs tests/football-team-trends.test.cjs tests/football-trend-catalog.test.cjs tests/nfl-ezpz-wilson.test.cjs tests/ncaaf-public-trend-leaderboard.test.cjs tests/nfl-last-seven.test.cjs
      - run: node --test tests/selection-fade.test.cjs tests/selection-trial.test.cjs tests/selection-trial-opposite.test.cjs tests/selection-trial-store.test.cjs tests/selection-trial-mlb.test.cjs tests/nba-ezpz-handoff.test.cjs
      - run: npx tsc --noEmit

name: Add EZPZ pick history calendar and results

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-ezpz-pick-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add EZPZ history calendar and result display
        shell: bash
        run: python scripts/add_ezpz_pick_history.py

      - name: Verify source changes
        shell: bash
        run: |
          grep -q 'selectedEzpzDate' app/page.tsx
          grep -q 'Pick history' app/page.tsx
          grep -q 'aiPickResultStrip' app/page.tsx
          grep -q 'EZPZ PICK HISTORY' app/globals.css
          git diff --check

      - name: Build public site
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Add EZPZ pick history calendar and results"
          git push

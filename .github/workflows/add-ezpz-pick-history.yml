name: Add EZPZ pick history calendar and results

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-ezpz-pick-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add EZPZ history calendar and result display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text()
              if new in text:
                  print(f"{label}: already applied")
                  return False
              if old not in text:
                  raise SystemExit(f"Could not find patch target: {label}")
              path.write_text(text.replace(old, new, 1))
              print(f"{label}: applied")
              return True

          page = Path("app/page.tsx")

          replace_once(
              page,
              '''  const [activeSport, setActiveSport] = useState<Sport>("MLB");
          const [active, setActive] = useState<Tab>("Today’s Best Plays");
          const activeLoadRef = useRef<Promise<void> | null>(null);
          const activeLoadControllerRef = useRef<AbortController | null>(null);

          const loadData = useCallback(async (silent = false, forceFresh = false) => {
          ''',
              '''  const [activeSport, setActiveSport] = useState<Sport>("MLB");
          const [active, setActive] = useState<Tab>("Today’s Best Plays");
          const [selectedEzpzDate, setSelectedEzpzDate] = useState("");
          const activeLoadRef = useRef<Promise<void> | null>(null);
          const activeLoadControllerRef = useRef<AbortController | null>(null);

          useEffect(() => {
            if (data?.today) setSelectedEzpzDate(data.today);
          }, [activeSport, data?.today]);

          const loadData = useCallback(async (silent = false, forceFresh = false) => {
          ''',
              "Add EZPZ selected-date state",
          )

          replace_once(
              page,
              '''    // Pending candidates remain visible until final review. A finalized
              // rejection is returned with selected=false or BLOCKED and disappears;
              // an approved candidate remains and changes from PENDING to FINAL.
              const aiPicks = (data.aiPicks || []).filter(
                (pick) => pick.selected && pick.protectionStatus === "PASSED",
              );
          ''',
              '''    // Pending candidates remain visible until final review. A finalized
              // rejection is returned with selected=false or BLOCKED and disappears;
              // an approved candidate remains and changes from PENDING to FINAL.
              const currentEzpzDate = normalizedDateKey(data.today);
              const activeEzpzDate = normalizedDateKey(selectedEzpzDate) || currentEzpzDate;
              const historicalEzpzPickMap = new Map<string, AiPick>();
              for (const pick of data.aiPickRecordRows || []) {
                if (!pick.selected || pick.protectionStatus !== "PASSED") continue;
                const dateKey = normalizedDateKey(pick.date);
                if (!dateKey) continue;
                const key = `${dateKey}|${pick.candidateId}`;
                const existing = historicalEzpzPickMap.get(key);
                const shouldReplace =
                  !existing ||
                  (pick.snapshotStatus === "FINAL_PREGAME" &&
                    existing.snapshotStatus !== "FINAL_PREGAME") ||
                  Boolean(pick.result && !existing.result);
                if (shouldReplace) historicalEzpzPickMap.set(key, pick);
              }
              const historicalEzpzPicks = [...historicalEzpzPickMap.values()];
              const availableEzpzDates = Array.from(
                new Set([
                  currentEzpzDate,
                  ...historicalEzpzPicks.map((pick) => normalizedDateKey(pick.date)),
                ]),
              )
                .filter((date): date is string => Boolean(date))
                .sort((a, b) => b.localeCompare(a));
              const aiPicks =
                activeEzpzDate === currentEzpzDate
                  ? (data.aiPicks || []).filter(
                      (pick) => pick.selected && pick.protectionStatus === "PASSED",
                    )
                  : historicalEzpzPicks.filter(
                      (pick) => normalizedDateKey(pick.date) === activeEzpzDate,
                    );
              const activeEzpzDateLabel = (() => {
                const [year, month, day] = activeEzpzDate.split("-").map(Number);
                if (!year || !month || !day) return activeEzpzDate || data.today;
                return new Intl.DateTimeFormat("en-US", {
                  month: "long",
                  day: "numeric",
                  year: "numeric",
                }).format(new Date(year, month - 1, day, 12));
              })();
          ''',
              "Build current and historical EZPZ pick slates",
          )

          old_ezpz = '''    if (active === "EZPZ Picks") {
              return (
                <section>
                  <div className="sectionHead aiSelectorHead">
                    <div>
                      <h2>EZPZ Picks</h2>
                      <p className="aiSelectorStatusText">
                        {data.aiSelectorStatus?.message ||
                          "The selector is evaluating today’s Best Plays and Trend Plays with deterministic EZPZ gates."}
                      </p>
                    </div>
                    <span className="countPill">{aiPicks.length} picks</span>
                  </div>

                  {aiPicks.length ? (
                    <div className="aiPickStack">
                      {aiPicks.map((pick) => (
                        <AiPickSelectorCard
                          key={pick.candidateId}
                          pick={pick}
                          todaySummary={
                            pick.bestPlayType
                              ? todayByType.get(normalizeType(pick.bestPlayType)) || null
                              : null
                          }
                          last7DaysSummary={
                            pick.bestPlayType
                              ? recentByType.get(normalizeType(pick.bestPlayType)) || null
                              : null
                          }
                          lastSevenBetsSummary={
                            pick.bestPlayType
                              ? lastSevenBetsByType.get(normalizeType(pick.bestPlayType)) || null
                              : null
                          }
                          overallSummary={
                            pick.bestPlayType
                              ? overallByType.get(normalizeType(pick.bestPlayType)) || null
                              : null
                          }
                          trendPlay={aiTrendPlayForPick(pick, trendPlays)}
                          trendPlays={trendPlays}
                          handpicked={Boolean(
                            favoriteRowMap.get(favoriteKeyFromAiPick(pick, data.today)),
                          )}
                        />
                      ))}
                    </div>
                  ) : (
                    <div className="empty">
                      No EZPZ Picks currently pass every selection and protection rule.
                    </div>
                  )}
                </section>
              );
            }
          '''

          new_ezpz = '''    if (active === "EZPZ Picks") {
              const viewingToday = activeEzpzDate === currentEzpzDate;
              return (
                <section>
                  <div className="sectionHead aiSelectorHead">
                    <div>
                      <h2>EZPZ Picks</h2>
                      <p className="aiSelectorStatusText">
                        {viewingToday
                          ? data.aiSelectorStatus?.message ||
                            "The selector is evaluating today’s Best Plays and Trend Plays with deterministic EZPZ gates."
                          : `Showing the locked EZPZ Picks saved for ${activeEzpzDateLabel}. Final grading is shown on each pick.`}
                      </p>
                    </div>
                    <span className="countPill">{aiPicks.length} picks</span>
                  </div>

                  <details className="ezpzHistoryDropdown">
                    <summary className="ezpzHistorySummary">
                      <div>
                        <strong>Pick history</strong>
                        <span>{activeEzpzDateLabel} • {aiPicks.length} saved {aiPicks.length === 1 ? "pick" : "picks"}</span>
                      </div>
                      <span className="ezpzHistoryAction">Choose date ▾</span>
                    </summary>
                    <div className="ezpzHistoryBody">
                      <label className="ezpzHistoryField">
                        <span>Calendar date</span>
                        <input
                          type="date"
                          value={activeEzpzDate}
                          max={currentEzpzDate || undefined}
                          onChange={(event) => setSelectedEzpzDate(event.target.value)}
                        />
                      </label>
                      <label className="ezpzHistoryField">
                        <span>Dates with saved picks</span>
                        <select
                          value={availableEzpzDates.includes(activeEzpzDate) ? activeEzpzDate : ""}
                          onChange={(event) => setSelectedEzpzDate(event.target.value)}
                        >
                          {!availableEzpzDates.includes(activeEzpzDate) ? (
                            <option value="" disabled>No saved picks on selected date</option>
                          ) : null}
                          {availableEzpzDates.map((date) => (
                            <option key={date} value={date}>
                              {date === currentEzpzDate ? `${date} — Today` : date}
                            </option>
                          ))}
                        </select>
                      </label>
                      {!viewingToday ? (
                        <button
                          type="button"
                          className="ezpzTodayBtn"
                          onClick={() => setSelectedEzpzDate(currentEzpzDate)}
                        >
                          Back to today
                        </button>
                      ) : null}
                    </div>
                  </details>

                  {aiPicks.length ? (
                    <div className="aiPickStack">
                      {aiPicks.map((pick) => {
                        const resultClass =
                          pick.result === "W"
                            ? "won"
                            : pick.result === "L"
                              ? "lost"
                              : pick.result === "P"
                                ? "push"
                                : "pending";
                        const resultLabel =
                          pick.result === "W"
                            ? "WON"
                            : pick.result === "L"
                              ? "LOST"
                              : pick.result === "P"
                                ? "PUSH"
                                : "PENDING";
                        return (
                          <div
                            className="aiPickHistoryItem"
                            key={`${normalizedDateKey(pick.date)}-${pick.candidateId}`}
                          >
                            <div className={`aiPickResultStrip ${resultClass}`}>
                              <span>{pick.result ? "Final result" : "Result"}</span>
                              <strong>{resultLabel}</strong>
                            </div>
                            <AiPickSelectorCard
                              pick={pick}
                              todaySummary={
                                viewingToday && pick.bestPlayType
                                  ? todayByType.get(normalizeType(pick.bestPlayType)) || null
                                  : null
                              }
                              last7DaysSummary={
                                viewingToday && pick.bestPlayType
                                  ? recentByType.get(normalizeType(pick.bestPlayType)) || null
                                  : null
                              }
                              lastSevenBetsSummary={
                                viewingToday && pick.bestPlayType
                                  ? lastSevenBetsByType.get(normalizeType(pick.bestPlayType)) || null
                                  : null
                              }
                              overallSummary={
                                viewingToday && pick.bestPlayType
                                  ? overallByType.get(normalizeType(pick.bestPlayType)) || null
                                  : null
                              }
                              trendPlay={viewingToday ? aiTrendPlayForPick(pick, trendPlays) : null}
                              trendPlays={viewingToday ? trendPlays : []}
                              handpicked={
                                viewingToday &&
                                Boolean(
                                  favoriteRowMap.get(favoriteKeyFromAiPick(pick, data.today)),
                                )
                              }
                            />
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="empty">
                      {viewingToday
                        ? "No EZPZ Picks currently pass every selection and protection rule."
                        : `No EZPZ Picks were saved for ${activeEzpzDateLabel}. Choose another date from Pick history.`}
                    </div>
                  )}
                </section>
              );
            }
          '''
          replace_once(page, old_ezpz, new_ezpz, "Add EZPZ history dropdown and result badges")

          replace_once(
              page,
              '''    activeSport,
              active,
              bestPlays,
          ''',
              '''    activeSport,
              active,
              selectedEzpzDate,
              bestPlays,
          ''',
              "Add selected EZPZ date to memo dependencies",
          )

          css = Path("app/globals.css")
          css_marker = "/* ===== EZPZ PICK HISTORY ===== */"
          if css_marker not in css.read_text():
              with css.open("a") as handle:
                  handle.write('''

          /* ===== EZPZ PICK HISTORY ===== */
          .ezpzHistoryDropdown {
            margin: 0 0 16px;
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: 18px;
            background: rgba(8, 20, 38, 0.72);
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
          }

          .ezpzHistorySummary {
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: center;
            padding: 14px 16px;
          }

          .ezpzHistorySummary::-webkit-details-marker { display: none; }
          .ezpzHistorySummary div { display: grid; gap: 3px; }
          .ezpzHistorySummary strong { font-weight: 950; color: #e0f2fe; }
          .ezpzHistorySummary span { color: var(--muted); font-size: .82rem; font-weight: 750; }
          .ezpzHistoryAction { color: #7dd3fc !important; white-space: nowrap; font-weight: 900 !important; }

          .ezpzHistoryBody {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
            gap: 12px;
            align-items: end;
            padding: 14px 16px 16px;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(15, 23, 42, 0.5);
          }

          .ezpzHistoryField { display: grid; gap: 6px; }
          .ezpzHistoryField > span {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .07em;
            text-transform: uppercase;
          }

          .ezpzHistoryField input,
          .ezpzHistoryField select {
            width: 100%;
            min-height: 42px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 12px;
            background: #0b1629;
            color: var(--text);
            padding: 9px 11px;
            font: inherit;
            font-weight: 800;
            color-scheme: dark;
          }

          .ezpzTodayBtn {
            min-height: 42px;
            cursor: pointer;
            border: 1px solid rgba(56, 189, 248, 0.34);
            border-radius: 12px;
            background: rgba(37, 99, 235, 0.18);
            color: #dbeafe;
            padding: 9px 13px;
            font-weight: 900;
          }

          .aiPickHistoryItem { display: grid; gap: 7px; }
          .aiPickResultStrip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 13px;
            background: rgba(15, 23, 42, 0.82);
            font-size: .76rem;
            font-weight: 900;
            letter-spacing: .05em;
            text-transform: uppercase;
          }

          .aiPickResultStrip span { color: var(--muted); }
          .aiPickResultStrip strong { font-size: .8rem; }
          .aiPickResultStrip.won { border-color: rgba(34, 197, 94, .45); background: rgba(34, 197, 94, .10); }
          .aiPickResultStrip.won strong { color: #86efac; }
          .aiPickResultStrip.lost { border-color: rgba(239, 68, 68, .45); background: rgba(239, 68, 68, .10); }
          .aiPickResultStrip.lost strong { color: #fca5a5; }
          .aiPickResultStrip.push { border-color: rgba(56, 189, 248, .40); background: rgba(56, 189, 248, .09); }
          .aiPickResultStrip.push strong { color: #7dd3fc; }
          .aiPickResultStrip.pending { border-color: rgba(245, 158, 11, .34); background: rgba(245, 158, 11, .08); }
          .aiPickResultStrip.pending strong { color: #fcd34d; }

          @media (max-width: 720px) {
            .ezpzHistoryBody { grid-template-columns: 1fr; }
            .ezpzHistorySummary { align-items: flex-start; }
            .ezpzHistoryAction { margin-top: 2px; }
          }
          ''')
              print("Add EZPZ pick-history styles: applied")
          else:
              print("Add EZPZ pick-history styles: already applied")
          PY

      - name: Verify source changes
        shell: bash
        run: |
          grep -q 'selectedEzpzDate' app/page.tsx
          grep -q 'Pick history' app/page.tsx
          grep -q 'aiPickResultStrip' app/page.tsx
          grep -q 'EZPZ PICK HISTORY' app/globals.css
          git diff --check

      - name: Build public site
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Add EZPZ pick history calendar and results"
          git push

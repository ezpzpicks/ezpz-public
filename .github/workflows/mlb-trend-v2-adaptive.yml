name: Wire adaptive MLB Trend V2 lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-trend-v2-adaptive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/mlb_trend_v2_adaptive_patch.mjs
      - run: npm run build
      - name: Commit validated integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data-v2/route.ts
          git commit -m "Activate adaptive MLB Trend V2 lifecycle"
          git push

# Retrigger after workflow registration.

name: MLB V16.5 Top2 Season Refit
on:
  push:
    branches: [analysis/whiff-matchup-regression]
    paths:
      - 'analysis/current_k_model_top2_season_refit_v9.py'
      - 'analysis/current_k_model_ablation_v6.py'
      - '.github/workflows/current_k_model_top2_season_refit.yml'
  workflow_dispatch:

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scipy statsmodels tabulate
      - name: Fetch public MLB pitch archive
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lancebroz/mlb-pitcher-data.git /tmp/mlb-pitcher-data
          cd /tmp/mlb-pitcher-data
          git sparse-checkout init --cone
          git sparse-checkout set data/raw/2023/monthly data/raw/2024/monthly data/raw/2025/monthly data/raw/2026/monthly
          git checkout main
      - name: Run season-aligned Top-2 refit
        run: python analysis/current_k_model_top2_season_refit_v9.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-5-top2-season-refit-results
          path: |
            analysis_output_current_k_top2_season_refit/
            analysis/current_k_model_top2_season_refit_results.md
          if-no-files-found: warn

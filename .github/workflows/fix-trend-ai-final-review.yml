name: Calibrate trend AI final review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-trend-ai-final-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Patch final AI reviewer rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/public-data/route.ts')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'const AI_PICK_SELECTOR_VERSION = "hybrid-web-context-v18-trend-rebalance";',
              'const AI_PICK_SELECTOR_VERSION = "hybrid-web-context-v19-trend-review-calibration";',
              'selector version',
          )

          replace_once(
              'approved=false is a final veto for materially negative evidence; it is not limited to critical conflicts.',
              'approved=false is a final veto only for materially negative evidence discovered in the matchup research; it is not a numeric-threshold veto. Never set approved=false solely because aiScoreBeforeResearch is below a downstream selector threshold.',
              'approved false guidance',
          )

          replace_once(
              'A Trend-Play-only candidate is not subject to the model bet-type form gate. It must be a Strong/Elite trend (Trend Score 69+) and clear the compressed adjusted AI score of 80+; there is no minimum historical bet count or small-sample veto. Your final approved=true/false review remains the final publication decision.',
              'A Trend-Play-only candidate is not subject to the model bet-type form gate. It must be a Strong/Elite trend (Trend Score 69+), and the selector will require the final adjusted AI score to reach 80+ after your research adjustment; there is no minimum historical bet count or small-sample veto. Do not reject a trend-only candidate because aiScoreBeforeResearch is below 80. First evaluate the actual matchup and assign the research adjustment. If the research is neutral, use adjustment=0 and approved=true unless the research itself uncovers a material negative reason to veto. The selector, not the reviewer, applies the final 80+ score gate after the adjustment. Small sample, trend strength alone is insufficient, lack of extra corroboration, or a pre-research score shortfall are not valid reasons for approved=false. For a trend-only play, approved=false must reflect a concrete researched matchup problem such as a materially unfavorable confirmed starter, lineup, bullpen, weather, or relevant split/context issue. The AI remains the final qualitative decider on matchup evidence, while the selector remains the final numeric gatekeeper.',
              'trend-only reviewer guidance',
          )

          path.write_text(text)

          required = [
              'hybrid-web-context-v19-trend-review-calibration',
              'Never set approved=false solely because aiScoreBeforeResearch is below a downstream selector threshold.',
              'Do not reject a trend-only candidate because aiScoreBeforeResearch is below 80.',
              'The selector, not the reviewer, applies the final 80+ score gate after the adjustment.',
              'Small sample, trend strength alone is insufficient, lack of extra corroboration, or a pre-research score shortfall are not valid reasons for approved=false.',
          ]
          for phrase in required:
              if phrase not in text:
                  raise SystemExit(f'missing required reviewer rule: {phrase}')

          forbidden = [
              'hybrid-web-context-v18-trend-rebalance',
              'approved=false is a final veto for materially negative evidence; it is not limited to critical conflicts.',
              'Your final approved=true/false review remains the final publication decision.',
          ]
          for phrase in forbidden:
              if phrase in text:
                  raise SystemExit(f'old reviewer rule still present: {phrase}')

          print('Trend-only AI final-review calibration applied successfully.')
          PY

      - name: Validate build
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run build

      - name: Commit source change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "EZPZ Fix Bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/fix-trend-ai-final-review.yml
          git add app/api/public-data/route.ts
          git commit -m "Calibrate trend-only AI final review"
          git push origin HEAD:main

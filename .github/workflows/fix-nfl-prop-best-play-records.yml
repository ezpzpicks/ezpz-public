name: Fix NFL prop best play records

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-nfl-prop-best-play-records.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Include graded NFL props in public Best Plays records
        run: python scripts/fix_nfl_prop_best_play_records.py

      - name: Validate public site
        run: |
          npm ci
          npm run build
          git diff --check
          grep -q 'qualifiedPropTrackerForRecords' lib/footballPublicData.ts
          grep -q 'recordSummary: nflRecordSummary' lib/footballPublicData.ts

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicData.ts
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Count graded NFL props in public Best Plays records"
          git push

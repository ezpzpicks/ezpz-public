name: Fix NFL form buckets

on:
  push:
    paths:
      - ".github/workflows/fix-nfl-form-buckets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply NFL form-bucket patch
        run: python scripts/fix_nfl_form_buckets.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build public site
        run: npm run build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicData.ts
          if git diff --cached --quiet; then
            echo "No target changes to commit."
            exit 0
          fi
          git commit -m "Split NFL form records by bet subtype"
          git push origin HEAD:main

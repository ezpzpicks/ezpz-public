name: Fix CFB EZPZ today-only rules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-cfb-ezpz-today-rules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CFB EZPZ fixes
        run: python scripts/fix_cfb_ezpz_today_rules.py

      - name: Verify CFB EZPZ policy wiring
        shell: bash
        run: |
          grep -q 'const todaySlate=slate.filter' lib/footballPublicData.ts
          grep -q 'const todayTrendPlays=displayTrendPlays.filter' lib/footballPublicData.ts
          grep -q 'buildFootballEzpzPicks(best,todayTrendPlays,tracker,todayEnriched,sport)' lib/footballPublicData.ts
          grep -q 'const aiPicks = (data.aiPicks || []).filter' app/api/ncaaf-public-data/route.ts
          grep -q 'function fbTrendPickPassesEzpzRules' app/FootballBoard.tsx
          grep -q 'trendPlays={ezpzTrendSource}' app/FootballBoard.tsx
          git diff --check

      - name: Build application
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Commit CFB EZPZ fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicData.ts app/api/ncaaf-public-data/route.ts app/FootballBoard.tsx
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Fix CFB EZPZ daily scope and stale trend eligibility"
          git pull --rebase origin main
          git push origin HEAD:main

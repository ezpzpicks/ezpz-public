name: Allow late pending EZPZ locks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/allow-late-pending-ezpz-locks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply late pending lock policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if new in text:
                  print(f"{label}: already applied")
                  return text
              if old not in text:
                  raise SystemExit(f"Missing patch target: {label}")
              print(f"{label}: applied")
              return text.replace(old, new, 1)

          route_path = Path("app/api/public-data-v2/route.ts")
          route = route_path.read_text()

          helper_anchor = 'function lastSnapshotEpoch(row:AnyRow){try{const details=JSON.parse(String(row?.["Details JSON"]||"{}"));const epoch=Number(details?.snapshotEpoch||0);if(Number.isFinite(epoch)&&epoch>0)return epoch}catch{}const parsed=Date.parse(String(row?.["Snapshot Time ET"]||""));return Number.isFinite(parsed)?parsed:0}\n'
          late_helper = """
          function latePendingSnapshotDecisions(snapshotRows:AnyRow[],slateRows:AnyRow[],today:string,nowMs:number,lockedPairs:Set<string>):DailyLockDecision[]{
            const latest=new Map<string,AnyRow>();
            for(const row of snapshotRows){
              if(isoDate(row.Date)!==today)continue;
              const gameKey=String(row["Game Key"]||"").trim().replace(/\\.0$/,"");
              const market=String(row.Market||"").trim();
              if(!gameKey||!market)continue;
              const pair=`${gameKey}|${market}`;
              if(lockedPairs.has(pair))continue;
              const minutesAtSnapshot=Number(row["Minutes To Start"]);
              if(!Number.isFinite(minutesAtSnapshot)||minutesAtSnapshot<=0)continue;
              if(!truthy(row["V2 Direction"])||!truthy(row["Daily Eligible"]))continue;
              const previous=latest.get(pair);
              if(!previous||lastSnapshotEpoch(row)>lastSnapshotEpoch(previous))latest.set(pair,row);
            }
            const recoveries:DailyLockDecision[]=[];
            for(const row of latest.values()){
              let play:V2TrendPlay|null=null;
              try{const parsed=JSON.parse(String(row["Details JSON"]||"{}"));if(parsed&&typeof parsed==="object")play=parsed as V2TrendPlay}catch{}
              if(!play)continue;
              const start=parseGameStart(play.recordDate||play.Date||row.Date,play.v2GameTime||row["Game Time"]);
              if(start==null||start>nowMs)continue;
              const thresholdInfo=slateThresholdForStart(start,slateRows);
              const gap=Number(row["V2 Market Gap"]||play.v2MarketGap);
              if(!Number.isFinite(gap)||gap<thresholdInfo.threshold)continue;
              play={...play,v2MarketGap:gap,v2Direction:true,v2DailyEligible:true,v2GameKey:String(row["Game Key"]||play.v2GameKey||"").trim().replace(/\\.0$/,"")||play.v2GameKey,v2GameTime:String(row["Game Time"]||play.v2GameTime||"")} as V2TrendPlay;
              recoveries.push({play,threshold:thresholdInfo.threshold,earlyPremium:thresholdInfo.earlyPremium,minutesToStart:(start-nowMs)/60000});
            }
            return recoveries.sort((a,b)=>b.play.v2MarketGap-a.play.v2MarketGap);
          }
          """
          if "function latePendingSnapshotDecisions(" not in route:
              if helper_anchor not in route:
                  raise SystemExit("Missing MLB late-recovery insertion anchor")
              route = route.replace(helper_anchor, helper_anchor + late_helper, 1)
              print("MLB saved-pending recovery helper: applied")

          route = must_replace(
              route,
              'const decisionWindowOpen=minutesToStart!=null&&minutesToStart>0&&minutesToStart<=MLB_TREND_V2_DECISION_WINDOW_MINUTES;',
              'const decisionWindowOpen=minutesToStart!=null&&minutesToStart<=MLB_TREND_V2_DECISION_WINDOW_MINUTES;',
              "MLB recovery window after start",
          )
          route = must_replace(
              route,
              'else if(minutesToStart<=0)decisionStatus="Game started";\n    else if(!decisionWindowOpen)decisionStatus=`Waiting for T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} min`;\n    else if(thresholdCleared)decisionStatus="OPEN • threshold cleared";\n    else decisionStatus="OPEN • below threshold";',
              'else if(!decisionWindowOpen)decisionStatus=`Waiting for T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} min`;\n    else if(thresholdCleared)decisionStatus=minutesToStart<=0?"RECOVERY OPEN • pending can still finalize":"OPEN • threshold cleared";\n    else decisionStatus=minutesToStart<=0?"RECOVERY OPEN • saved pending required":"OPEN • below threshold";',
              "MLB post-start status",
          )
          route = must_replace(
              route,
              'function dailyPickObject(decision:DailyLockDecision,today:string,nowMs:number):AnyRow{\n  const play=decision.play;',
              'function dailyPickObject(decision:DailyLockDecision,today:string,nowMs:number):AnyRow{\n  const play=decision.play;\n  const lateRecovery=decision.minutesToStart<=0;',
              "MLB late recovery audit flag",
          )
          route = must_replace(
              route,
              '`Locked ${decision.minutesToStart.toFixed(1)} minutes before scheduled start`',
              'lateRecovery?`Finalized ${Math.abs(decision.minutesToStart).toFixed(1)} minutes after scheduled start from the last saved pregame PENDING snapshot`:`Locked ${decision.minutesToStart.toFixed(1)} minutes before scheduled start`',
              "MLB late lock wording",
          )
          route = must_replace(
              route,
              'v2LockedEpoch:nowMs};',
              'v2LockedEpoch:nowMs,lateRecoveryFromPendingSnapshot:lateRecovery};',
              "MLB persist recovery provenance",
          )

          late_loop_old = '    if(newLocks.length){\n      try{await appendV2Rows("daily",newLocks.map(dailyPickRow));dailyPicks.push(...newLocks);todayLocks.push(...newLocks)}'
          late_loop_new = '    for(const decision of latePendingSnapshotDecisions(snapshotRows,slateRows,today,nowMs,lockedPairs)){\n      const pair=`${decision.play.v2GameKey}|${decision.play.market}`;\n      if(lockedPairs.has(pair))continue;\n      newLocks.push(dailyPickObject(decision,today,nowMs));\n      lockedPairs.add(pair);\n    }\n    if(newLocks.length){\n      try{await appendV2Rows("daily",newLocks.map(dailyPickRow));dailyPicks.push(...newLocks);todayLocks.push(...newLocks)}'
          route = must_replace(route, late_loop_old, late_loop_new, "MLB late saved-pending lock loop")

          route = route.replace(
              'const rule=`15% threshold cleared: V2 Market Gap ${play.v2MarketGap.toFixed(1)} >= ${decision.threshold.toFixed(0)}`;',
              'const rule=`15% threshold cleared: V2 Market Gap ${play.v2MarketGap.toFixed(1)} >= ${decision.threshold.toFixed(0)}`;',
          )
          route = route.replace(
              '`Final evaluation occurs at T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} minutes`',
              '`Target lock is T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES}; if that run is delayed, this saved pregame qualifier can still finalize after start`',
          )
          route = route.replace(
              '`PENDING until the final T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} market lock`',
              '`PENDING until the next scheduled lock run`',
          )
          route = route.replace(
              '`Final evaluation at T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES}`',
              '`Target lock at T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES}; late recovery remains allowed from this pregame state`',
          )
          route = route.replace(
              'thresholdRule:"Every otherwise-eligible MLB Trend v2 play with V2 Market Gap >= 15% locks as an EZPZ Pick",note:"V2 Ranking Probability and Market Gap are ranking diagnostics, not calibrated win probabilities."',
              'thresholdRule:"Every otherwise-eligible MLB Trend v2 play with V2 Market Gap >= 15% locks as an EZPZ Pick; a saved pregame PENDING qualifier may finalize on a later run even after scheduled start",note:"Late finalization uses the last saved pregame pending snapshot, never in-game market data. V2 Ranking Probability and Market Gap are ranking diagnostics, not calibrated win probabilities."',
          )
          route = route.replace('awaiting the T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} final lock', 'awaiting the next lock run')
          route = route.replace('appears as PENDING until the T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} final lock.', 'appears as PENDING until the next lock run; delayed runs can recover from the saved pregame snapshot.')
          route = route.replace('then becomes FINAL only at the T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} lock.', 'then becomes FINAL on the next lock run; delayed runs can recover from the saved pregame snapshot.')
          route_path.write_text(route)

          football_path = Path("lib/footballPublicDataLegacy.ts")
          football = football_path.read_text()
          football = must_replace(
              football,
              '    if(minutesToKickoff!=null&&minutesToKickoff<0)return row;\n    const play=playMap.get',
              '    const play=playMap.get',
              "football kickoff hard stop",
          )
          football = must_replace(
              football,
              'const locked=minutesToKickoff!=null&&minutesToKickoff<=15&&minutesToKickoff>=0;',
              'const locked=minutesToKickoff!=null&&minutesToKickoff<=15;',
              "football late finalization",
          )
          football = football.replace(
              '// Once a side has an authoritative FINAL_PREGAME trend, its persisted\n    // market row is immutable. After kickoff we also refuse to write a late\n    // snapshot and falsely call it a verified pregame lock.',
              '// Once a side has an authoritative FINAL_PREGAME trend, its persisted\n    // market row is immutable. We never write new market snapshots after T-15;\n    // delayed finalization uses only the saved pregame market state.',
          )
          football = football.replace(
              'appear as PENDING until the T-15 final market lock; max price -150.',
              'appear as PENDING until the next lock run; a delayed run may finalize after kickoff from the saved pregame snapshot; max price -150.',
          )
          football = football.replace(
              'Qualifying Trend Plays will appear as PENDING before the T-15 final lock.',
              'Qualifying Trend Plays appear as PENDING and can finalize on a later run even after kickoff, using only the saved pregame snapshot.',
          )
          football_path.write_text(football)

          lifecycle_path = Path("lib/footballTrendV2Lifecycle.ts")
          lifecycle = lifecycle_path.read_text()
          lifecycle = must_replace(
              lifecycle,
              'const decisionWindowOpen = minutesToStart != null && minutesToStart > 0 && minutesToStart <= FOOTBALL_DECISION_WINDOW_MINUTES;',
              'const decisionWindowOpen = minutesToStart != null && minutesToStart <= FOOTBALL_DECISION_WINDOW_MINUTES;',
              "football recovery window after kickoff",
          )
          lifecycle = must_replace(
              lifecycle,
              'else if (minutesToStart <= 0) decisionStatus = "Game started";\n      else if (!decisionWindowOpen) decisionStatus = `Waiting for T-${FOOTBALL_DECISION_WINDOW_MINUTES} min`;\n      else if (thresholdCleared) decisionStatus = "OPEN • threshold cleared";\n      else decisionStatus = "OPEN • below threshold";',
              'else if (!decisionWindowOpen) decisionStatus = `Waiting for T-${FOOTBALL_DECISION_WINDOW_MINUTES} min`;\n      else if (thresholdCleared) decisionStatus = minutesToStart <= 0 ? "RECOVERY OPEN • pending can still finalize" : "OPEN • threshold cleared";\n      else decisionStatus = minutesToStart <= 0 ? "RECOVERY OPEN • saved pending required" : "OPEN • below threshold";',
              "football post-kickoff status",
          )
          lifecycle_path.write_text(lifecycle)

          obsolete = Path(".github/workflows/fix-football-strict-lock-cutoff.yml")
          if obsolete.exists():
              obsolete.unlink()
              print("Removed obsolete strict football cutoff workflow")
          PY

      - name: Verify policy
        shell: bash
        run: |
          grep -q 'latePendingSnapshotDecisions' app/api/public-data-v2/route.ts
          grep -q 'lateRecoveryFromPendingSnapshot' app/api/public-data-v2/route.ts
          grep -q 'last saved pregame PENDING snapshot' app/api/public-data-v2/route.ts
          grep -q 'const locked=minutesToKickoff!=null&&minutesToKickoff<=15;' lib/footballPublicDataLegacy.ts
          if grep -q 'minutesToKickoff!=null&&minutesToKickoff<0)return row' lib/footballPublicDataLegacy.ts; then exit 1; fi
          grep -q 'RECOVERY OPEN • pending can still finalize' lib/footballTrendV2Lifecycle.ts
          if test -e .github/workflows/fix-football-strict-lock-cutoff.yml; then exit 1; fi

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Allow late EZPZ locks from saved pending snapshots"
          git push

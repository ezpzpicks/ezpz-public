name: EZPZ DraftKings True RLM Snapshots

on:
  push:
    paths:
      - .github/workflows/draftkings_snapshot.yml
      - scripts/ai_final_notifications.mjs
      - scripts/final_trend_lock_notifications.mjs
  schedule:
    # Check every 5 minutes, offset from the top of the hour. GitHub scheduled
    # workflows can occasionally run late or skip an individual wake-up, so the
    # tighter cadence gives each MLB game several chances to capture its first
    # official pregame lock before first pitch. The API keeps that first lock
    # immutable, so later checks cannot overwrite it.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ezpz-draftkings-true-rlm-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: .cache/final_trend_lock_notification_state.json
          key: final-trend-lock-notifications-${{ github.run_id }}
          restore-keys: |
            final-trend-lock-notifications-

      - name: Initialize MLB slate, refresh DraftKings baseline, and lock eligible pregame snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 10 \
            --max-time 75 \
            -H "Authorization: Bearer $CRON_SECRET" \
            --output /tmp/ezpz_public_data.json \
            "https://ezpzpicks.com/api/public-data?scheduled=1&tracking=15m"

      - name: Send newly finalized AI picks to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINAL_LOCK_CLICK_URL: https://ezpzpicks.com
        run: node scripts/ai_final_notifications.mjs /tmp/ezpz_public_data.json

      - name: Prepare game-lock-only notification payload
        run: jq '.aiPicks = []' /tmp/ezpz_public_data.json > /tmp/ezpz_game_lock_data.json

      - name: Send each game's final odds lock to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINAL_LOCK_CLICK_URL: https://ezpzpicks.com
        run: node scripts/final_trend_lock_notifications.mjs /tmp/ezpz_game_lock_data.json

      - name: Save notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/final_trend_lock_notification_state.json
          key: final-trend-lock-notifications-${{ github.run_id }}


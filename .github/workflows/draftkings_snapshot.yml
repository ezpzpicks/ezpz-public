name: EZPZ DraftKings True RLM Snapshots

on:
  push:
    paths:
      - .github/workflows/draftkings_snapshot.yml
  schedule:
    # Four checks per hour run all day so the new MLB slate is initialized just
    # after midnight ET, then the market baseline stays current until first pitch.
    # The API separately locks one official snapshot 7-23 minutes before first pitch.
    - cron: "2,17,32,47 0-23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ezpz-draftkings-true-rlm-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Apply one-time HOT Pending AI selector update
        shell: bash
        run: |
          python .github/scripts/hot_pending_ai_patch.py
          git diff --check
          if git diff --quiet; then
            echo "HOT Pending AI selector is already updated."
          else
            # Restore the normal scheduled workflow and remove the one-time script
            # in the same commit, leaving only the route behavior change.
            git show 4ffa3c307da9b319954b6e7542986c389f9fbd87:.github/workflows/draftkings_snapshot.yml > .github/workflows/draftkings_snapshot.yml
            git rm .github/scripts/hot_pending_ai_patch.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/public-data/route.ts .github/workflows/draftkings_snapshot.yml
            git commit -m "Let HOT Best Plays enter pending AI review"
            git push origin HEAD:main
          fi

      - name: Restore final notification state
        uses: actions/cache/restore@v4
        with:
          path: .cache/final_trend_lock_notification_state.json
          key: final-trend-lock-notifications-${{ github.run_id }}
          restore-keys: |
            final-trend-lock-notifications-

      - name: Initialize MLB slate, refresh DraftKings baseline, and lock eligible pregame snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 10 \
            --max-time 75 \
            -H "Authorization: Bearer $CRON_SECRET" \
            --output /tmp/ezpz_public_data.json \
            "https://ezpzpicks.com/api/public-data?scheduled=1&tracking=15m"

      - name: Send detailed final game locks and newly finalized AI picks to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FINAL_LOCK_CLICK_URL: https://ezpzpicks.com
        run: node scripts/final_trend_lock_notifications.mjs /tmp/ezpz_public_data.json

      - name: Save final notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/final_trend_lock_notification_state.json
          key: final-trend-lock-notifications-${{ github.run_id }}

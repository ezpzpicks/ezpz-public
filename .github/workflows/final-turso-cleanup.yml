name: Final Turso-only cleanup

on:
  push:
    branches: [turso-final-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-final-cleanup
          fetch-depth: 0

      - name: Remove obsolete Google dependencies and migration commands
        run: |
          npm uninstall @googleapis/sheets google-auth-library --ignore-scripts
          npm pkg delete 'scripts.turso:migrate' 'scripts.turso:parity'

      - name: Remove legacy Sheets source names and migration tooling
        run: |
          python - <<'PY'
          from pathlib import Path

          for old in [
              Path('scripts/migrate-sheets-to-turso.mjs'),
              Path('scripts/audit-turso-parity.mjs'),
          ]:
              old.unlink(missing_ok=True)

          legacy_store = Path('lib/googleSheets.ts')
          turso_store = Path('lib/mlbStore.ts')
          if legacy_store.exists():
              if turso_store.exists():
                  raise RuntimeError('Both lib/googleSheets.ts and lib/mlbStore.ts exist')
              legacy_store.rename(turso_store)

          roots = [Path('app'), Path('lib'), Path('components')]
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.mjs'}
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in extensions:
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  text = text.replace('./googleSheets', './mlbStore')
                  text = text.replace('../googleSheets', '../mlbStore')
                  text = text.replace('../../lib/googleSheets', '../../lib/mlbStore')
                  text = text.replace('../../../lib/googleSheets', '../../../lib/mlbStore')
                  text = text.replace('"google-sheets"', '"turso"')
                  text = text.replace("'google-sheets'", "'turso'")
                  text = text.replace('Google Sheets is no longer a production fallback.', 'No legacy storage fallback is available.')
                  text = text.replace('Google Sheets or historical row', 'stored or historical row')
                  text = text.replace('Google Sheets may send dates', 'Stored dates may use')
                  text = text.replace('Google Sheets', 'legacy spreadsheet storage')
                  if text != original:
                      path.write_text(text, encoding='utf-8')

          Path('.github/workflows/final-turso-cleanup.yml').unlink(missing_ok=True)
          PY

      - name: Verify no production Google Sheets runtime remains
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              '@googleapis/sheets',
              'google-auth-library',
              'googleapis',
              'googleSheets',
              'google-sheets',
              'Google Sheets',
              'GOOGLE_SHEET_ID',
              'GOOGLE_CREDENTIALS',
          ]
          roots = [Path('app'), Path('lib'), Path('components')]
          failures = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.js', '.jsx', '.mjs'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  for token in forbidden:
                      if token in text:
                          failures.append(f'{path}: {token}')
          package_text = Path('package.json').read_text(encoding='utf-8')
          for token in forbidden:
              if token in package_text:
                  failures.append(f'package.json: {token}')
          if Path('scripts/migrate-sheets-to-turso.mjs').exists(): failures.append('migration script remains')
          if Path('scripts/audit-turso-parity.mjs').exists(): failures.append('parity script remains')
          if Path('lib/googleSheets.ts').exists(): failures.append('legacy lib/googleSheets.ts remains')
          if not Path('lib/mlbStore.ts').exists(): failures.append('lib/mlbStore.ts is missing')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('No production Google Sheets runtime references remain.')
          PY

      - name: Build production app
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove final Google Sheets runtime remnants"
          git push origin HEAD:turso-final-cleanup

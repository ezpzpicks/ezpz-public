name: Fix MLB authoritative latest snapshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-mlb-latest-snapshot-truth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply latest-snapshot truth policy
        run: python scripts/fix_mlb_latest_snapshot_truth.py

      - name: Verify MLB lock policy
        shell: bash
        run: |
          grep -Fq 'function latestSnapshotByGameMarket(' app/api/public-data-v2/route.ts
          grep -Fq 'Authoritative DraftKings lock snapshot: finalize only after scheduled start.' app/api/public-data-v2/route.ts
          grep -Fq 'newest observed DraftKings snapshot is the truth' app/api/public-data-v2/route.ts
          grep -Fq 'No new post-start candidate is created' app/api/public-data-v2/route.ts
          ! grep -Fq 'chooseDailyTrendLock' app/api/public-data-v2/route.ts
          git diff --check

      - name: Build application
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Commit authoritative latest-snapshot policy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data-v2/route.ts
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Use latest DraftKings snapshot for MLB EZPZ locks"
          git pull --rebase origin main
          git push origin HEAD:main

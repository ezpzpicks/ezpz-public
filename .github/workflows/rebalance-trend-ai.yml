name: Rebalance trend AI grading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebalance-trend-ai.yml

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Rebalance trend tiers and AI eligibility'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply trend grading rebalance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          route_path = Path('app/api/public-data/route.ts')
          page_path = Path('app/page.tsx')
          route = route_path.read_text()
          page = page_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return updated

          route = replace_once(
              route,
              'const AI_PICK_SELECTOR_VERSION = "hybrid-web-context-v17-all-best-play-last7-gates";',
              'const AI_PICK_SELECTOR_VERSION = "hybrid-web-context-v18-trend-rebalance";',
              'selector version',
          )

          route = replace_once(
              route,
              '''function trendTier(score: number, eligible = true): TrendPlay["tier"] {
            if (!eligible || score < 60) return "Pass";
            if (score >= 88) return "Elite";
            if (score >= 75) return "Strong";
            return "Good";
          }''',
              '''function trendTier(score: number, eligible = true): TrendPlay["tier"] {
            if (!eligible || score < 60) return "Pass";
            if (score >= 85) return "Elite";
            if (score >= 69) return "Strong";
            return "Good";
          }''',
              'route trend tiers',
          )

          page = replace_once(
              page,
              '''function rankedTrendLabel(score: number, eligible = true): TrendTier {
            if (!eligible || score < 60) return "Pass";
            if (score >= 88) return "Elite";
            if (score >= 75) return "Strong";
            return "Good";
          }''',
              '''function rankedTrendLabel(score: number, eligible = true): TrendTier {
            if (!eligible || score < 60) return "Pass";
            if (score >= 85) return "Elite";
            if (score >= 69) return "Strong";
            return "Good";
          }''',
              'page trend tiers',
          )

          route = replace_once(
              route,
              '''function aiTrendOnlyBaseScore(trendScore: number) {
            // A qualifying Trend Score is evidence, not a 1:1 AI grade. Compress the
            // 60-100 trend range into 60-90 so 95+ AI scores require independent support.
            const normalized = aiClamp(trendScore, 60, 100);
            return aiClamp(60 + (normalized - 60) * 0.75, 0, 90);
          }''',
              '''function aiTrendOnlyBaseScore(trendScore: number) {
            // Strong trends should have a realistic path to the final 80+ AI gate without
            // turning Trend Score into an automatic publication score. Map 69-95 to
            // 76.5-89.5; history, market context, and final research decide whether it clears 80.
            const normalized = aiClamp(trendScore, 69, 100);
            return aiClamp(76.5 + (normalized - 69) * 0.5, 0, 92);
          }''',
              'trend-only AI base score',
          )

          route = replace_once(
              route,
              '''  const odds = play.odds || "";
            const trendHistoryAdjustment = aiTrendOnlyHistoryAdjustment(play);''',
              '''  // Good-only trends stay visible on the Trend Plays board, but only Strong/Elite
            // trends create standalone AI candidates. A Good trend can still support a Best Play.
            if (play.tier === "Good") return;
            const odds = play.odds || "";
            const trendHistoryAdjustment = aiTrendOnlyHistoryAdjustment(play);''',
              'standalone trend candidate gate',
          )

          route = replace_once(
              route,
              ''': candidate.modelScore || candidate.trendScore) + candidate.scoreAdjustment,''',
              ''': candidate.source === "Trend Play" && !candidate.bestPlayType
                  ? aiTrendOnlyBaseScore(candidate.trendScore)
                  : candidate.modelScore || candidate.trendScore) + candidate.scoreAdjustment,''',
              'research payload AI score',
          )

          route = replace_once(
              route,
              'It must be a Strong/Elite trend (Trend Score 75+) and clear the compressed adjusted AI score of 85+;',
              'It must be a Strong/Elite trend (Trend Score 69+) and clear the compressed adjusted AI score of 80+;',
              'AI reviewer trend requirements',
          )

          route = replace_once(
              route,
              'Strong/Elite trend (75+) and then earn an adjusted AI score of 85+',
              'Strong/Elite trend (69+) and then earn an adjusted AI score of 80+',
              'final selector trend comment',
          )

          route = sub_once(
              route,
              r'(const selectionThresholds = trendOnlyCandidate\s*\?\s*\{\s*score:\s*)85,',
              r'\g<1>80,',
              'trend-only AI score threshold',
          )

          route = sub_once(
              route,
              r'trendOnlyCandidate && rawTrendScore < 75\s*\? `Trend score \$\{rawTrendScore\} did not reach the 75 Strong-trend minimum`',
              'trendOnlyCandidate && rawTrendScore < 69\n        ? `Trend score ${rawTrendScore} did not reach the 69 Strong-trend minimum`',
              'trend-only minimum trend score',
          )

          route_path.write_text(route)
          page_path.write_text(page)

          forbidden = [
              'Strong/Elite trend (Trend Score 75+)',
              'compressed adjusted AI score of 85+',
              '75 Strong-trend minimum',
              'if (score >= 88) return "Elite";',
              'if (score >= 75) return "Strong";',
          ]
          for phrase in forbidden:
              if phrase in route or phrase in page:
                  raise SystemExit(f'old trend grading text still present: {phrase}')

          required = [
              'if (score >= 85) return "Elite";',
              'if (score >= 69) return "Strong";',
              'score: 80,',
              'rawTrendScore < 69',
              'aiTrendOnlyBaseScore(candidate.trendScore)',
              'if (play.tier === "Good") return;',
          ]
          for phrase in required:
              if phrase not in route and phrase not in page:
                  raise SystemExit(f'new trend grading text missing: {phrase}')

          print('Trend AI rebalance applied successfully.')
          PY

      - name: Validate build
        run: |
          npm install --package-lock=false
          npm run build

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebalance-trend-ai.yml
          git add app/api/public-data/route.ts app/page.tsx
          git commit -m "Rebalance trend tiers and AI eligibility"
          git push origin HEAD:main

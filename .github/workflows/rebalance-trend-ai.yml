name: Rebalance trend AI grading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebalance-trend-ai.yml

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Rebalance trend tiers and AI eligibility'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply trend grading rebalance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('app/api/public-data/route.ts')
          page_path = Path('app/page.tsx')
          route = route_path.read_text()
          page = page_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          route = replace_once(
              route,
              'const AI_PICK_SELECTOR_VERSION = "hybrid-web-context-v17-all-best-play-last7-gates";',
              'const AI_PICK_SELECTOR_VERSION = "hybrid-web-context-v18-trend-rebalance";',
              'selector version',
          )

          old_route_tier = '''function trendTier(score: number, eligible = true): TrendPlay["tier"] {
            if (!eligible || score < 60) return "Pass";
            if (score >= 88) return "Elite";
            if (score >= 75) return "Strong";
            return "Good";
          }'''
          new_route_tier = '''function trendTier(score: number, eligible = true): TrendPlay["tier"] {
            if (!eligible || score < 60) return "Pass";
            if (score >= 85) return "Elite";
            if (score >= 69) return "Strong";
            return "Good";
          }'''
          route = replace_once(route, old_route_tier, new_route_tier, 'route trend tiers')

          old_page_tier = '''function rankedTrendLabel(score: number, eligible = true): TrendTier {
            if (!eligible || score < 60) return "Pass";
            if (score >= 88) return "Elite";
            if (score >= 75) return "Strong";
            return "Good";
          }'''
          new_page_tier = '''function rankedTrendLabel(score: number, eligible = true): TrendTier {
            if (!eligible || score < 60) return "Pass";
            if (score >= 85) return "Elite";
            if (score >= 69) return "Strong";
            return "Good";
          }'''
          page = replace_once(page, old_page_tier, new_page_tier, 'page trend tiers')

          old_base = '''function aiTrendOnlyBaseScore(trendScore: number) {
            // A qualifying Trend Score is evidence, not a 1:1 AI grade. Compress the
            // 60-100 trend range into 60-90 so 95+ AI scores require independent support.
            const normalized = aiClamp(trendScore, 60, 100);
            return aiClamp(60 + (normalized - 60) * 0.75, 0, 90);
          }'''
          new_base = '''function aiTrendOnlyBaseScore(trendScore: number) {
            // Strong trends should have a realistic path to the final 80+ AI gate without
            // turning Trend Score into an automatic publication score. Map 69-95 to
            // 76.5-89.5; history, market context, and final research decide whether it clears 80.
            const normalized = aiClamp(trendScore, 69, 100);
            return aiClamp(76.5 + (normalized - 69) * 0.5, 0, 92);
          }'''
          route = replace_once(route, old_base, new_base, 'trend-only AI base score')

          old_merge = '''    if (!existing.odds) existing.odds = play.odds || "";
            return;
          }
          const odds = play.odds || "";'''
          new_merge = '''    if (!existing.odds) existing.odds = play.odds || "";
            return;
          }
          // Good-only trends stay visible on the Trend Plays board, but only Strong/Elite
          // trends create standalone AI candidates. A Good trend can still support a Best Play.
          if (play.tier === "Good") return;
          const odds = play.odds || "";'''
          route = replace_once(route, old_merge, new_merge, 'standalone trend candidate gate')

          old_payload = '''    aiScoreBeforeResearch: aiRound(
              (candidate.source === "Best + Trend"
                ? candidate.modelScore * aiTrendBlendWeights(candidate.trendPlay).modelWeight +
                  candidate.trendScore * aiTrendBlendWeights(candidate.trendPlay).trendWeight
                : candidate.modelScore || candidate.trendScore) + candidate.scoreAdjustment,
              1,
            ),'''
          new_payload = '''    aiScoreBeforeResearch: aiRound(
              (candidate.source === "Best + Trend"
                ? candidate.modelScore * aiTrendBlendWeights(candidate.trendPlay).modelWeight +
                  candidate.trendScore * aiTrendBlendWeights(candidate.trendPlay).trendWeight
                : candidate.source === "Trend Play" && !candidate.bestPlayType
                  ? aiTrendOnlyBaseScore(candidate.trendScore)
                  : candidate.modelScore || candidate.trendScore) + candidate.scoreAdjustment,
              1,
            ),'''
          route = replace_once(route, old_payload, new_payload, 'research payload AI score')

          route = replace_once(
              route,
              'It must be a Strong/Elite trend (Trend Score 75+) and clear the compressed adjusted AI score of 85+;',
              'It must be a Strong/Elite trend (Trend Score 69+) and clear the compressed adjusted AI score of 80+;',
              'AI reviewer trend requirements',
          )

          route = replace_once(
              route,
              '''    // Strong/Elite trend (75+) and then earn an adjusted AI score of 85+; there
              // is deliberately no minimum historical bet count.''',
              '''    // Strong/Elite trend (69+) and then earn an adjusted AI score of 80+; there
              // is deliberately no minimum historical bet count.''',
              'final selector trend comment',
          )

          route = replace_once(
              route,
              '''    const selectionThresholds = trendOnlyCandidate
              ? {
                  score: 85,''',
              '''    const selectionThresholds = trendOnlyCandidate
              ? {
                  score: 80,''',
              'trend-only AI score threshold',
          )

          route = replace_once(
              route,
              '''      trendOnlyCandidate && rawTrendScore < 75
                ? `Trend score ${rawTrendScore} did not reach the 75 Strong-trend minimum`''',
              '''      trendOnlyCandidate && rawTrendScore < 69
                ? `Trend score ${rawTrendScore} did not reach the 69 Strong-trend minimum`''',
              'trend-only minimum trend score',
          )

          route_path.write_text(route)
          page_path.write_text(page)

          # Guard against the old Trend-only publication gates surviving anywhere important.
          forbidden = [
              'Strong/Elite trend (Trend Score 75+)',
              'compressed adjusted AI score of 85+',
              '75 Strong-trend minimum',
          ]
          for phrase in forbidden:
              if phrase in route:
                  raise SystemExit(f'old trend gate still present: {phrase}')

          print('Trend AI rebalance applied successfully.')
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebalance-trend-ai.yml
          git add app/api/public-data/route.ts app/page.tsx
          git commit -m "Rebalance trend tiers and AI eligibility"
          git push origin HEAD:main

name: One-time finalize NFL Market Move and Money Momentum signals

on:
  push:
    paths:
      - ".github/workflows/add-nfl-market-money-signals-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated v3 source patch
        shell: bash
        run: |
          python - <<'RUNNER'
          from pathlib import Path

          workflow = Path('.github/workflows/add-nfl-market-money-signals-v3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code_lines = []
          for line in workflow[start:end]:
              code_lines.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(code_lines), 'validated-v3-patch.py', 'exec'))

          v4 = Path('.github/workflows/add-nfl-market-money-signals-v4.yml')
          if v4.exists():
              v4.unlink()
          RUNNER

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify wiring
        shell: bash
        run: |
          grep -q 'NFL_MARKET_MOVE_MIN_POINTS = 1' lib/footballPublicDataCore.ts
          grep -q 'NFL_MONEY_MOMENTUM_MIN_MONEY_MOVE_PCT = 10' lib/footballPublicDataCore.ts
          grep -q 'labels.push("Market Move")' lib/footballPublicDataCore.ts
          grep -q 'labels.push("Money Momentum")' lib/footballPublicDataCore.ts
          grep -q 'Market Move' lib/ezpzPublicSplitEligibility.ts
          grep -q 'Money.*Momentum' lib/ezpzPublicSplitEligibility.ts
          grep -q '<b>Market Move</b>' app/FootballBoardBase.tsx
          grep -q '<b>Money Momentum</b>' app/FootballBoardBase.tsx
          grep -q 'Market Move' app/FootballBoard.tsx
          grep -q 'Money Momentum' app/FootballBoard.tsx
          grep -q 'Market Move' app/FootballTrendMarketBoard.tsx
          grep -q 'Money Momentum' app/FootballTrendMarketBoard.tsx

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "ezpzpicks"
          git config user.email "ryanpaez5@gmail.com"
          git add -A
          git commit -m "Add NFL Market Move and Money Momentum signals"
          git push origin main
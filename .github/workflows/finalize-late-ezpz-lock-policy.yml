name: Finalize late EZPZ lock policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-late-ezpz-lock-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove remaining football kickoff hard stop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/footballPublicDataLegacy.ts")
          text = path.read_text()
          old = '    if(minutesToKickoff!=null&&minutesToKickoff<0)return row;\n'
          count = text.count(old)
          if count:
              text = text.replace(old, "")
              print(f"Removed {count} remaining kickoff hard stop(s)")
          else:
              print("No remaining kickoff hard stop found")
          if 'const locked=minutesToKickoff!=null&&minutesToKickoff<=15;' not in text:
              raise SystemExit("Late football finalization condition is missing")
          path.write_text(text)

          # Remove the temporary migration workflows so they cannot be rerun later.
          for name in [
              ".github/workflows/allow-late-pending-ezpz-locks.yml",
              ".github/workflows/commit-late-pending-ezpz-locks.yml",
              ".github/workflows/finalize-late-ezpz-lock-policy.yml",
          ]:
              target = Path(name)
              if target.exists():
                  target.unlink()
          PY

      - name: Verify final source state
        shell: bash
        run: |
          if grep -q 'minutesToKickoff!=null&&minutesToKickoff<0)return row' lib/footballPublicDataLegacy.ts; then exit 1; fi
          grep -q 'const locked=minutesToKickoff!=null&&minutesToKickoff<=15;' lib/footballPublicDataLegacy.ts
          grep -q 'latePendingSnapshotDecisions' app/api/public-data-v2/route.ts
          grep -q 'lateRecoveryFromPendingSnapshot' app/api/public-data-v2/route.ts
          grep -q 'RECOVERY OPEN • pending can still finalize' lib/footballTrendV2Lifecycle.ts

      - name: Commit final source state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize late EZPZ lock policy"
          git push

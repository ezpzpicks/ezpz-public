name: EZPZ Football Public Snapshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/football_public_snapshot.yml
      - app/api/cron/football-slate-sync/route.ts
      - app/api/cron/football-market-discovery/route.ts
      - app/api/football-weekly-market/route.ts
      - lib/footballWeeklyMarket.ts
      - app/FootballBoard.tsx
  schedule:
    # Check football markets every five minutes. The two-minute offset avoids
    # the busiest GitHub Actions scheduling boundary while still keeping the
    # market archive close to real time.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 10-23 * * *"
      timezone: "America/New_York"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0 * * *"
      timezone: "America/New_York"
    - cron: "2 1 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: ezpz-football-public-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sync NFL schedule into public slate
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://ezpzpicks.com/api/cron/football-slate-sync" \
              --output /tmp/nfl_slate_sync.json; then
              cat /tmp/nfl_slate_sync.json
              exit 0
            fi
            echo "NFL slate sync attempt $attempt failed; retrying."
            sleep 8
          done
          echo "NFL schedule sync unavailable this cycle; market discovery will still run."
          exit 1

      - name: Discover posted NFL markets
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --max-time 100 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://ezpzpicks.com/api/cron/football-market-discovery?sport=NFL" \
              --output /tmp/nfl_discovery.json; then
              cat /tmp/nfl_discovery.json
              jq -e '.ok == true' /tmp/nfl_discovery.json >/dev/null && exit 0
            fi
            echo "NFL market discovery attempt $attempt failed; retrying."
            sleep 8
          done
          exit 1

      - name: Capture NFL graded snapshot
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://ezpzpicks.com/api/cron/football-public-snapshot?sport=NFL" \
              --output /tmp/nfl_public_data.json; then
              cat /tmp/nfl_public_data.json | jq '{ok, sport, draftKings: {status: .draftKings.status, splitCount: ((.draftKings.splits // []) | length)}}'
              exit 0
            fi
            echo "NFL graded snapshot attempt $attempt failed; retrying."
            sleep 8
          done
          exit 1

      - name: Space Google Sheets writes
        run: sleep 8

      - name: Discover posted CFB markets
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --max-time 100 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://ezpzpicks.com/api/cron/football-market-discovery?sport=NCAAF" \
              --output /tmp/cfb_discovery.json; then
              cat /tmp/cfb_discovery.json
              jq -e '.ok == true' /tmp/cfb_discovery.json >/dev/null && exit 0
            fi
            echo "CFB market discovery attempt $attempt failed; retrying."
            sleep 8
          done
          exit 1

      - name: Capture CFB graded snapshot
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://ezpzpicks.com/api/cron/football-public-snapshot?sport=NCAAF" \
              --output /tmp/ncaaf_public_data.json; then
              cat /tmp/ncaaf_public_data.json | jq '{ok, sport, draftKings: {status: .draftKings.status, splitCount: ((.draftKings.splits // []) | length)}}'
              exit 0
            fi
            echo "CFB graded snapshot attempt $attempt failed; retrying."
            sleep 8
          done
          exit 1

name: Fix Frozen Trend Terminal Persistence

on:
  push:
    paths:
      - scripts/ai_trend_candidate_finalization_patch.mjs
      - .github/workflows/fix-frozen-trend-terminal-persistence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-frozen-trend-terminal-persistence
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply frozen Strong/Elite terminal-persistence fail-safe
        run: node scripts/ai_trend_candidate_finalization_patch.mjs

      - name: Commit patched production route
        run: |
          if git diff --quiet -- app/api/public-data/route.ts; then
            echo "Production route already contains the fail-safe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts
          git commit -m "Prevent frozen Strong Elite trends from disappearing"
          git push origin HEAD:main

name: Fix football lock build compatibility

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-football-lock-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve final-lock logic through the build patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/football_quota_stability_patch.mjs")
          text = path.read_text()
          label = '"scheduled football snapshot persistence",'
          label_pos = text.find(label)
          if label_pos < 0:
              raise SystemExit("Could not find scheduled football snapshot persistence label")

          start = text.rfind("  text = replaceOnce(", 0, label_pos)
          end = text.find("  );", label_pos)
          if start < 0 or end < 0:
              raise SystemExit("Could not isolate scheduled football snapshot persistence patch")
          end += len("  );")

          new = r'''  text = replaceOnce(
            text,
            "  if(currentSnapshots.length) await upsertSportRows(sport,\"public_split_snapshots\",PUBLIC_SPLIT_HEADERS,currentSnapshots,snapshotKey);",
            "  if(persist&&currentSnapshots.length) await upsertSportRows(sport,\"public_split_snapshots\",PUBLIC_SPLIT_HEADERS,currentSnapshots,snapshotKey);",
            "scheduled football snapshot persistence",
          );'''

          existing = text[start:end]
          if existing == new:
              print("Build patch is already compatible with final-lock logic")
          else:
              path.write_text(text[:start] + new + text[end:])
              print("Updated build patch to preserve final-lock snapshot filtering")
          PY

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/football_quota_stability_patch.mjs
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Preserve football final lock during build"
          git push

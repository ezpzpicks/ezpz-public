name: EZPZ DraftKings 15-Minute Tracking Snapshot

on:
  schedule:
    # Four evenly spaced checks per hour. For any possible first-pitch minute,
    # at least one check occurs 7-21 minutes beforehand. The API performs only
    # a lightweight slate check unless an uncaptured game is inside its window.
    - cron: "2,17,32,47 8-23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezpz-draftkings-15-minute-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Save one DraftKings tracking snapshot per game
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 10 \
            --max-time 75 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://ezpzpicks.com/api/cron/draftkings-snapshot"

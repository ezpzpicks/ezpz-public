name: Apply EZPZ final handoff fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ezpz-final-handoff-fix.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch final pregame handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/public-data/route.ts')
          text = path.read_text()

          def replace_one(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_one(
              'const AI_PICK_SELECTOR_VERSION = "ezpz-picks-hardcoded-v6-hot-only-roi10";\nconst AI_MINIMUM_ESTIMATED_ADVANTAGE = 5;',
              'const AI_PICK_SELECTOR_VERSION = "ezpz-picks-hardcoded-v6-hot-only-roi10";\nconst AI_MINIMUM_ESTIMATED_ADVANTAGE = 5;\n// A durable 15-minute snapshot is allowed one short retry window after the\n// scheduled start if its selector row missed the LIVE -> FINAL_PREGAME handoff.\n// This recovery never uses ordinary live/in-game market data.\nconst AI_FINAL_PREGAME_RECOVERY_GRACE_MS = 30 * 60_000;',
              'recovery constant',
          )

          replace_one(
              '''    const [slateTodayRaw, trackerRaw, liveDraftKings, initialSavedPublicSplits, storedAiPickRows, matchupDetailsRaw] = await Promise.all([\n      readWorksheet("daily_slate"),\n      readWorksheet("bet_tracker"),\n      loadDraftKingsData(),\n      safeReadPublicSplitRows(),\n      safeReadAiPickRows(),\n      safeReadAiBuilderMatchupRows(),\n    ]);\n    let savedPublicSplits = initialSavedPublicSplits;''',
              '''    const [initialSlateTodayRaw, trackerRaw, liveDraftKings, initialSavedPublicSplits, storedAiPickRows, matchupDetailsRaw] = await Promise.all([\n      readWorksheet("daily_slate"),\n      readWorksheet("bet_tracker"),\n      loadDraftKingsData(),\n      safeReadPublicSplitRows(),\n      safeReadAiPickRows(),\n      safeReadAiBuilderMatchupRows(),\n    ]);\n    let slateTodayRaw = initialSlateTodayRaw;\n    let savedPublicSplits = initialSavedPublicSplits;''',
              'initial daily_slate read',
          )

          replace_one(
              '''    if (persistence.status === "ERROR" && persistence.error) {\n      draftKings.errors = [...draftKings.errors, `Pregame persistence: ${persistence.error}`];\n    }\n    if (persistence.snapshotRowsUpdated > 0) {''',
              '''    if (persistence.status === "ERROR" && persistence.error) {\n      draftKings.errors = [...draftKings.errors, `Pregame persistence: ${persistence.error}`];\n    }\n    // LIVE_TO_FINAL_HANDOFF_V1: persistFinalPregameDraftKings can update the\n    // durable slate after the Promise.all above. Re-read it in this same request\n    // so selector finalization sees the newly saved pregame state immediately.\n    if (persistence.slateRowsUpdated > 0 || persistence.finalPregameRows > 0) {\n      slateTodayRaw = await readWorksheet("daily_slate");\n    }\n    if (persistence.snapshotRowsUpdated > 0) {''',
              'post-persistence slate refresh',
          )

          replace_one(
              '''  const targetCandidates = candidates.filter((candidate) => {\n    const hasFrozenTrendSnapshot =\n      candidate.trendPlay?.snapshotStatus === "FINAL_PREGAME";\n    if (!targetGameKeys.has(candidate.gameKey) && !hasFrozenTrendSnapshot) return false;\n    if (storedFinalCandidateIds.has(candidate.candidateId)) return false;\n    const started = candidate.slateRow\n      ? !isPregameRow(candidate.slateRow, selectorNow)\n      : false;\n    return !started;\n  });''',
              '''  const targetCandidates = candidates.filter((candidate) => {\n    const hasFrozenTrendSnapshot =\n      candidate.trendPlay?.snapshotStatus === "FINAL_PREGAME";\n    const hasDedicatedFinalMarketSnapshot =\n      finalDraftKingsGameKeys.has(candidate.gameKey);\n    if (!targetGameKeys.has(candidate.gameKey) && !hasFrozenTrendSnapshot) return false;\n    if (storedFinalCandidateIds.has(candidate.candidateId)) return false;\n    const started = candidate.slateRow\n      ? !isPregameRow(candidate.slateRow, selectorNow)\n      : false;\n    if (!started) return true;\n\n    // FINAL_PREGAME_HANDOFF_RECOVERY_V1: if the dedicated frozen pregame\n    // snapshot exists but its selector write was missed, allow one bounded\n    // post-start recovery path. A generic FINAL PREGAME slate label is not\n    // sufficient here because it can be written after first pitch; recovery\n    // requires the actual dedicated market snapshot (or frozen TrendPlay).\n    const start = candidate.slateRow\n      ? scheduledGameStart(candidate.slateRow)\n      : null;\n    const withinRecoveryGrace =\n      start == null || selectorNow <= start + AI_FINAL_PREGAME_RECOVERY_GRACE_MS;\n    if (\n      withinRecoveryGrace &&\n      (hasDedicatedFinalMarketSnapshot || hasFrozenTrendSnapshot)\n    ) {\n      candidate.dataStatus = [\n        "Recovered missing FINAL_PREGAME selector row from durable pregame snapshot",\n        ...candidate.dataStatus.filter(\n          (item) =>\n            item !==\n            "Recovered missing FINAL_PREGAME selector row from durable pregame snapshot",\n        ),\n      ].slice(0, 5);\n      return true;\n    }\n    return false;\n  });''',
              'target candidate recovery',
          )

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit production fix
        shell: bash
        run: |
          if git diff --quiet -- app/api/public-data/route.ts; then
            echo "No route change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts
          git commit -m "Fix EZPZ live to final pregame handoff"
          git push origin HEAD:main

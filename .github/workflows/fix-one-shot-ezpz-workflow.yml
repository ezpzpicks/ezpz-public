name: Fix one-shot EZPZ updater

on:
  push:
    branches:
      - chatgpt/ezpz-football-records-cleanup
    paths:
      - .github/workflows/fix-one-shot-ezpz-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ezpz-football-records-cleanup
      - name: Fix updater and retrigger
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/one-shot-ezpz-football-records.yml')
          s = p.read_text()
          old = "text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if old not in s:
              raise SystemExit('replacement line not found')
          s = s.replace(old, new, 1)
          s = s.replace("if: github.actor != 'github-actions[bot]'", "if: always()", 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-ezpz-football-records.yml
          git rm .github/workflows/fix-one-shot-ezpz-workflow.yml
          git commit -m "Fix one-shot EZPZ update workflow"
          git push origin HEAD:chatgpt/ezpz-football-records-cleanup

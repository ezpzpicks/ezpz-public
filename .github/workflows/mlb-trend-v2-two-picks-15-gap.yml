name: Update MLB Trend V2 daily limits

on:
  push:
    paths:
      - ".github/workflows/mlb-trend-v2-two-picks-15-gap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update MLB Trend V2 rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib_path = Path("lib/mlbTrendV2.ts")
          route_path = Path("app/api/public-data-v2/route.ts")
          lib = lib_path.read_text()
          route = route_path.read_text()

          old = 'export const MLB_TREND_V2_NORMAL_GAP = 10;'
          if old not in lib:
              raise SystemExit("Could not find normal-gap constant")
          lib = lib.replace(old, 'export const MLB_TREND_V2_NORMAL_GAP = 15;', 1)

          early = 'export const MLB_TREND_V2_EARLY_GAP = 20;'
          if early not in lib:
              raise SystemExit("Could not find early-gap constant")
          if 'MLB_TREND_V2_MAX_DAILY_PICKS' not in lib:
              lib = lib.replace(early, early + '\nexport const MLB_TREND_V2_MAX_DAILY_PICKS = 2;', 1)

          old_import = (
              '  MLB_TREND_V2_EARLY_GAP, MLB_TREND_V2_LAUNCH_DATE, MLB_TREND_V2_NORMAL_GAP,\n'
              '  MLB_TREND_V2_VERSION, V2TrendPlay,'
          )
          new_import = (
              '  MLB_TREND_V2_EARLY_GAP, MLB_TREND_V2_LAUNCH_DATE, MLB_TREND_V2_MAX_DAILY_PICKS,\n'
              '  MLB_TREND_V2_NORMAL_GAP, MLB_TREND_V2_VERSION, V2TrendPlay,'
          )
          if old_import not in route:
              raise SystemExit("Could not find V2 import block")
          route = route.replace(old_import, new_import, 1)

          old_meta = 'payload.trendV2={version:MLB_TREND_V2_VERSION,launchDate:MLB_TREND_V2_LAUNCH_DATE,normalGap:MLB_TREND_V2_NORMAL_GAP,earlyGap:MLB_TREND_V2_EARLY_GAP,decisionWindowMinutes:MLB_TREND_V2_DECISION_WINDOW_MINUTES,note:'
          new_meta = 'payload.trendV2={version:MLB_TREND_V2_VERSION,launchDate:MLB_TREND_V2_LAUNCH_DATE,normalGap:MLB_TREND_V2_NORMAL_GAP,earlyGap:MLB_TREND_V2_EARLY_GAP,maxDailyPicks:MLB_TREND_V2_MAX_DAILY_PICKS,decisionWindowMinutes:MLB_TREND_V2_DECISION_WINDOW_MINUTES,note:'
          if old_meta not in route:
              raise SystemExit("Could not find trendV2 metadata block")
          route = route.replace(old_meta, new_meta, 1)

          old_audit = '"Only one Trend v2 EZPZ Pick is allowed per MLB date"'
          new_audit = '`Maximum ${MLB_TREND_V2_MAX_DAILY_PICKS} Trend v2 EZPZ Picks are allowed per MLB date`'
          if old_audit not in route:
              raise SystemExit("Could not find single-pick audit copy")
          route = route.replace(old_audit, new_audit, 1)

          lock_start = route.index('  let dailyPicks=dailyRows.map(parseDailyPickRow)')
          lock_end = route.index('  const graded=', lock_start)
          new_lock_block = (
              '  let dailyPicks=dailyRows.map(parseDailyPickRow).filter((pick):pick is AnyRow=>Boolean(pick));\n'
              '  let todayLocks=dailyPicks.filter(pick=>isoDate(pick.date)===today);\n'
              '  if(isV2ScheduledCapture(request)&&today>=MLB_TREND_V2_LAUNCH_DATE&&todayLocks.length<MLB_TREND_V2_MAX_DAILY_PICKS){\n'
              '    const lockedPairs=new Set(todayLocks.map(pick=>`${String(pick.gameKey||"").trim().replace(/\\.0$/,"")}|${String(pick.market||"")}`));\n'
              '    let available=scored.filter(play=>!lockedPairs.has(`${play.v2GameKey}|${play.market}`));\n'
              '    const newLocks:AnyRow[]=[];\n'
              '    while(todayLocks.length+newLocks.length<MLB_TREND_V2_MAX_DAILY_PICKS){\n'
              '      const decision=chooseDailyTrendLock(available,slateRows,nowMs);\n'
              '      if(!decision)break;\n'
              '      const lock=dailyPickObject(decision,today,nowMs);\n'
              '      newLocks.push(lock);\n'
              '      const pair=`${decision.play.v2GameKey}|${decision.play.market}`;\n'
              '      lockedPairs.add(pair);\n'
              '      available=available.filter(play=>`${play.v2GameKey}|${play.market}`!==pair);\n'
              '    }\n'
              '    if(newLocks.length){\n'
              '      try{await appendV2Rows("daily",newLocks.map(dailyPickRow));dailyPicks.push(...newLocks);todayLocks.push(...newLocks)}\n'
              '      catch(error){console.error("Trend v2 daily lock persistence failed",error)}\n'
              '    }\n'
              '  }\n\n'
          )
          route = route[:lock_start] + new_lock_block + route[lock_end:]

          old_refresh = '  todayLock=dailyPicks.find(pick=>isoDate(pick.date)===today)||todayLock;'
          if old_refresh not in route:
              raise SystemExit("Could not find post-grade todayLock refresh")
          route = route.replace(old_refresh, '  todayLocks=dailyPicks.filter(pick=>isoDate(pick.date)===today);', 1)

          final_start = route.index('  const legacyAiPicks=Array.isArray(payload.aiPicks)?payload.aiPicks:[];')
          final_end = route.index('  return payload;', final_start)
          final_block = (
              '  const legacyAiPicks=Array.isArray(payload.aiPicks)?payload.aiPicks:[];\n'
              '  const filteredAiPicks=legacyAiPicks.filter((pick:AnyRow)=>!(isLaunchOrLater(pick?.date||today)&&pureLegacyTrendPick(pick)));\n'
              '  for(const lock of todayLocks)filteredAiPicks.push(lock);\n'
              '  payload.aiPicks=filteredAiPicks;\n'
              '  const legacyRecordRows=Array.isArray(payload.aiPickRecordRows)?payload.aiPickRecordRows:[];\n'
              '  const filteredRecordRows=legacyRecordRows.filter((pick:AnyRow)=>!(isLaunchOrLater(pick?.date||pick?.Date)&&pureLegacyTrendPick(pick)));\n'
              '  payload.aiPickRecordRows=[...filteredRecordRows,...dailyPicks];\n\n'
              '  const status=payload.aiSelectorStatus||{};\n'
              '  const finalCount=filteredAiPicks.filter((pick:AnyRow)=>pick?.snapshotStatus==="FINAL_PREGAME").length;\n'
              '  const lockedCount=todayLocks.length;\n'
              '  const lockedNames=todayLocks.map(pick=>pick.play).filter(Boolean).join("; ");\n'
              '  const remaining=Math.max(0,MLB_TREND_V2_MAX_DAILY_PICKS-lockedCount);\n'
              '  const trendMessage=lockedCount>=MLB_TREND_V2_MAX_DAILY_PICKS\n'
              '    ? `MLB Trend v2 daily max reached (${lockedCount}/${MLB_TREND_V2_MAX_DAILY_PICKS}): ${lockedNames}.`\n'
              '    : lockedCount>0\n'
              '      ? `MLB Trend v2 ${lockedCount}/${MLB_TREND_V2_MAX_DAILY_PICKS} locked: ${lockedNames}. ${remaining} slot${remaining===1?"":"s"} remain; another play must independently clear its threshold.`\n'
              '      : filteredAiPicks.length\n'
              '        ? `HOT Best Plays are final; MLB Trend v2 is ranking the slate for up to ${MLB_TREND_V2_MAX_DAILY_PICKS} daily trend picks.`\n'
              '        : `MLB Trend v2 is ranking the slate. Up to ${MLB_TREND_V2_MAX_DAILY_PICKS} daily trend picks may lock, but none are forced.`;\n'
              '  payload.aiSelectorStatus={...status,mode:finalCount===filteredAiPicks.length&&filteredAiPicks.length?"FINAL_PREGAME":"LIVE_PREVIEW",message:trendMessage,updatedAt:nowET(),candidateCount:Number(status.candidateCount||0)+scored.filter(play=>play.v2Direction).length,selectedCount:filteredAiPicks.length,trendV2DailyLocked:Boolean(lockedCount),trendV2DailyLockedCount:lockedCount,trendV2DailyMaxPicks:MLB_TREND_V2_MAX_DAILY_PICKS};\n'
          )
          route = route[:final_start] + final_block + route[final_end:]

          lib_path.write_text(lib)
          route_path.write_text(route)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit rule update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mlbTrendV2.ts app/api/public-data-v2/route.ts
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Allow 2 MLB Trend V2 picks and raise final gap"
          git push

name: One-time NCAAF MLB-style form badges

on:
  push:
    paths:
      - ".github/workflows/ncaaf-mlb-style-form-badges.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire NCAAF form badges into live cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Today’s Model Plays is rendered by FootballGameTabs, not FootballBoardBase.
          path = Path('app/FootballGameTabs.tsx')
          text = path.read_text()

          old = 'import { MatchupWithLogos, SelectionWithTeamLogo, TeamLogoName } from "./TeamLogoName";\n'
          new = old + 'import FootballModelFormBadges from "./FootballModelFormBadges";\n'
          if old not in text or 'from "./FootballModelFormBadges"' in text:
              raise SystemExit('FootballGameTabs import guard failed')
          text = text.replace(old, new, 1)

          old = '''type FootballData = {
            today?: string;
            lastUpdated?: string;
            bestPlays?: Play[];
            slateToday?: SheetRow[];
            draftKings?: { status?: string; splits?: Split[] };
          };'''
          new = '''type FootballData = {
            today?: string;
            lastUpdated?: string;
            bestPlays?: Play[];
            slateToday?: SheetRow[];
            betTrackerRows?: SheetRow[];
            draftKings?: { status?: string; splits?: Split[] };
          };'''
          if old not in text:
              raise SystemExit('FootballGameTabs data type guard failed')
          text = text.replace(old, new, 1)

          old = 'function ModelPlayRow({ play, sport }: { play: Play; sport: Sport }) {'
          new = 'function ModelPlayRow({ play, sport, data }: { play: Play; sport: Sport; data: FootballData }) {'
          if old not in text:
              raise SystemExit('ModelPlayRow signature guard failed')
          text = text.replace(old, new, 1)

          old = '''      {form ? (
                <div className="fgtFormLine">
                  <span className={`fgtBadge ${form.cls}`}>{form.icon} {form.label}</span>
                  {formRecord ? <span className="fgtFormRecord">L7 <b>{formRecord}</b></span> : null}
                </div>
              ) : null}'''
          new = '''      {sport === "NCAAF" && !isProp ? (
                <FootballModelFormBadges
                  rows={data.betTrackerRows || []}
                  today={data.today}
                  grade={play.playType}
                  market={play.role || play.playType}
                  selection={play.play}
                  className="fgtModelFormBadges"
                />
              ) : form ? (
                <div className="fgtFormLine">
                  <span className={`fgtBadge ${form.cls}`}>{form.icon} {form.label}</span>
                  {formRecord ? <span className="fgtFormRecord">L7 <b>{formRecord}</b></span> : null}
                </div>
              ) : null}'''
          if old not in text:
              raise SystemExit('ModelPlayRow form block guard failed')
          text = text.replace(old, new, 1)

          old = '<ModelPlayRow key={`${play.play}-${play.playerName}-${play.propMarket}-${index}`} play={play} sport={sport} />'
          new = '<ModelPlayRow key={`${play.play}-${play.playerName}-${play.propMarket}-${index}`} play={play} sport={sport} data={data} />'
          if old not in text:
              raise SystemExit('ModelPlayRow invocation guard failed')
          text = text.replace(old, new, 1)

          old = '.fgtFormLine{display:flex;align-items:center;gap:7px;flex-wrap:wrap}'
          new = '.fgtFormLine{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.fgtModelFormBadges{grid-column:1/-1}'
          if old not in text:
              raise SystemExit('FootballGameTabs CSS guard failed')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # EZPZ Picks is rendered by FootballBoard's history card.
          path = Path('app/FootballBoard.tsx')
          text = path.read_text()

          old = 'import { MatchupWithLogos, SelectionWithTeamLogo, TeamLogoName } from "./TeamLogoName";\n'
          new = old + 'import FootballModelFormBadges from "./FootballModelFormBadges";\n'
          if old not in text or 'from "./FootballModelFormBadges"' in text:
              raise SystemExit('FootballBoard import guard failed')
          text = text.replace(old, new, 1)

          old = 'function HistoryPickCard({ pick, sport, viewingToday }: { pick: EzpzPick; sport: Sport; viewingToday: boolean }) {'
          new = 'function HistoryPickCard({ pick, sport, viewingToday, data }: { pick: EzpzPick; sport: Sport; viewingToday: boolean; data: FootballData }) {'
          if old not in text:
              raise SystemExit('HistoryPickCard signature guard failed')
          text = text.replace(old, new, 1)

          old = '''      )}
            </article>
          );
        }'''
          new = '''      )}
            {!isProp && pick.source !== "Trend Play" ? (
              <FootballModelFormBadges
                rows={data.betTrackerRows || []}
                today={data.today}
                grade={pick.tier || pick.formType || pick.qualification}
                market={pick.market}
                selection={pick.selection}
                recordType={pick.formType}
                qualification={pick.qualification}
                className="footballHistoryFormBadges"
              />
            ) : null}
            </article>
          );
        }'''
          if old not in text:
              raise SystemExit('HistoryPickCard render guard failed')
          text = text.replace(old, new, 1)

          old = '<HistoryPickCard key={`${pickIdentity(pick)}-${index}`} pick={pick} sport={sport} viewingToday={viewingToday} />'
          new = '<HistoryPickCard key={`${pickIdentity(pick)}-${index}`} pick={pick} sport={sport} viewingToday={viewingToday} data={data} />'
          if old not in text:
              raise SystemExit('HistoryPickCard invocation guard failed')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify live badge wiring
        shell: bash
        run: |
          grep -q 'FootballModelFormBadges' app/FootballGameTabs.tsx
          grep -q 'betTrackerRows?: SheetRow\[\]' app/FootballGameTabs.tsx
          grep -q 'className="fgtModelFormBadges"' app/FootballGameTabs.tsx
          grep -q 'FootballModelFormBadges' app/FootballBoard.tsx
          grep -q 'className="footballHistoryFormBadges"' app/FootballBoard.tsx
          grep -q '7 Days:' app/FootballModelFormBadges.tsx
          grep -q 'Last 7 Bets:' app/FootballModelFormBadges.tsx
          git diff --check

      - name: Commit NCAAF badge update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/FootballGameTabs.tsx app/FootballBoard.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Show MLB-style form badges on NCAAF cards"
          git push

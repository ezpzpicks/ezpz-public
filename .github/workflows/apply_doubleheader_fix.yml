name: Apply Doubleheader Fix

on:
  push:
    branches:
      - agent/fix-doubleheaders

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-doubleheaders

      - name: Apply doubleheader patch
        run: python scripts/apply_doubleheader_fix.py

      - name: Verify alert monitor self-test
        run: node scripts/draftkings_odds_alerts.mjs --self-test

      - name: Type-check public site
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit patched files
        run: |
          if git diff --quiet -- app/api/public-data/route.ts app/api/cron/draftkings-snapshot/route.ts scripts/draftkings_odds_alerts.mjs; then
            echo "Doubleheader fix already applied."
            exit 0
          fi
          git config user.name "ezpzpicks"
          git config user.email "ryanpaez5@gmail.com"
          git add app/api/public-data/route.ts app/api/cron/draftkings-snapshot/route.ts scripts/draftkings_odds_alerts.mjs
          git commit -m "Fix DraftKings doubleheader game matching"
          git push origin HEAD:agent/fix-doubleheaders

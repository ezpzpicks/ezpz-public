name: Unify sport records by exact grade subset

on:
  push:
    paths:
      - ".github/workflows/unify-sport-record-subsets.yml"
      - "scripts/unify_sport_record_subsets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply approved records repair
        run: python scripts/unify_sport_record_subsets.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build and type validation
        run: npm run build

      - name: Commit verified repair to main
        run: |
          rm -f .github/workflows/unify-sport-record-subsets.yml scripts/unify_sport_record_subsets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No target changes to commit."
            exit 0
          fi
          git commit -m "Unify sport records by exact grade subset"
          git push origin HEAD:main

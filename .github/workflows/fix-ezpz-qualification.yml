name: Finalize EZPZ policy source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ezpz-qualification.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and apply the verified source patch
        shell: bash
        run: |
          git show 9d6f61d0d736a2a52d71d7a90b6ce3ce5006d825:.github/workflows/apply-ezpz-fix.yml > /tmp/old-ezpz-fix.yml
          python3 - <<'PY'
          from pathlib import Path
          import base64

          workflow = Path('/tmp/old-ezpz-fix.yml').read_text()
          start_marker = "          echo '"
          end_marker = "' | base64 -d > /tmp/apply_ezpz.py"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          payload = workflow[start:end]
          Path('/tmp/apply_ezpz.py').write_bytes(base64.b64decode(payload))
          PY
          python3 /tmp/apply_ezpz.py

      - name: Verify production build
        shell: bash
        run: |
          npm install --no-package-lock
          npm run build

      - name: Commit verified policy fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts lib/footballPublicData.ts app/FootballBoard.tsx
          git rm .github/workflows/fix-ezpz-qualification.yml
          git commit -m "Enable final policy-correct EZPZ Picks"
          git pull --rebase origin main
          git push origin HEAD:main

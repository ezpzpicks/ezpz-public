name: One-time EZPZ qualification source repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ezpz-qualification.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hard-code the exact EZPZ qualification paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/api/public-data/route.ts")
          s = path.read_text()

          def sub1(pattern, repl, label, flags=re.S):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 replacement, got {n}")
              s = s2

          # Version and permanent policy constants. Only these are eligibility
          # rules; scores/probabilities remain display/diagnostic data only.
          s = re.sub(
              r'const AI_PICK_SELECTOR_VERSION = "[^"]+";',
              'const AI_PICK_SELECTOR_VERSION = "ezpz-picks-v7-exact-two-path-policy";',
              s,
              count=1,
          )
          sub1(
              r'const EZPZ_BEST_PLAY_POLICY = \{[\s\S]*?\n\};\n\nconst EZPZ_TREND_POLICY = \{[\s\S]*?\n\};',
              '''const EZPZ_BEST_PLAY_POLICY = {
  requiredForm: "HOT" as const,
  maxFavoritePrice: -150,
};

const EZPZ_TREND_POLICY = {
  requireAllSignalsGreen: true,
  minimumNetRoiAdvantage: 10,
};''',
              "policy constants",
          )

          # Keep the legacy analytics helpers compilable, but make it explicit
          # that they do not impose EZPZ eligibility thresholds anymore.
          sub1(
              r'function aiPitcherRequiredScore\([\s\S]*?\n}\n\n(?=type AiPitcherQualificationProfile)',
              '''function aiPitcherRequiredScore(
  _record: RecordTotals,
  _form: AiPitcherBetTypeForm,
) {
  return 0;
}

''',
              "required score helper",
          )
          sub1(
              r'function aiPitcherQualificationProfile\([\s\S]*?\n}\n\n(?=function aiHistoricalRecordType)',
              '''function aiPitcherQualificationProfile(
  _form: AiPitcherBetTypeForm | undefined,
  _record: RecordTotals | null = null,
): AiPitcherQualificationProfile {
  return {
    score: 0,
    probability: 0,
    advantage: 0,
    enforceProbability: false,
  };
}

''',
              "qualification profile helper",
          )

          # BEST PLAY PATH: rolling Last-7 form is metadata until final selection.
          # A non-HOT Best Play must never globally block an independently valid
          # Trend Play for the same wager.
          sub1(
              r'function aiRecordAdjustments\([\s\S]*?\n}\n(?=function aiApplyMarketContext)',
              '''function aiRecordAdjustments(candidate: AiSelectorCandidate, completedTrackerRows: SheetRow[]) {
  const recordType = aiHistoricalRecordType(candidate);
  if (!recordType) return;

  if (!candidate.bestPlayType) {
    candidate.dataStatus.push(
      "Trend-only candidate: Best Play HOT gate does not apply",
    );
    return;
  }

  const lastSeven = aiLastSevenBetsSummaryForType(completedTrackerRows, recordType);
  const form = aiPitcherBetTypeForm(lastSeven);
  candidate.pitcherBetTypeForm = form;
  candidate.pitcherBetTypeRecord = lastSeven.record;
  candidate.pitcherRequiredScore = 0;

  const label =
    form === "HOT" ? "Hot" :
    form === "COLD" ? "Cold" :
    form === "NEUTRAL" ? "Neutral" : "Need 7 Bets";

  candidate.dataStatus.push(
    `${recordType} Last 7 Bets: ${label} • ${lastSeven.record}${
      form === EZPZ_BEST_PLAY_POLICY.requiredForm
        ? " • eligible for the HOT Best Play path"
        : " • Best Play path requires HOT"
    }`,
  );
  candidate.historicalNotes.push(
    form === "SAMPLE"
      ? `${recordType} Last 7 Bets: Need 7 Bets • ${lastSeven.totalBets}/7 completed`
      : `${recordType} Last 7 Bets: ${label} • ${lastSeven.record}`,
  );
  if (form === EZPZ_BEST_PLAY_POLICY.requiredForm) {
    candidate.whySelected.push(
      `${recordType} is HOT over its rolling Last 7 (${lastSeven.record})`,
    );
  }
}
''',
              "record adjustments",
          )

          # The -150 maximum belongs ONLY to the Best Play path. Missing odds are
          # still a technical block, but a -151 Trend Play can qualify through the
          # independent Trend path if its trend rules pass.
          sub1(
              r'function aiProtectionChecks\(candidate: AiSelectorCandidate\) \{[\s\S]*?\n}\n\n(?=function aiCandidateFromBestPlay)',
              '''function aiProtectionChecks(candidate: AiSelectorCandidate) {
  if (!candidate.slateRow) {
    candidate.protectionReasons.push("The candidate could not be matched to today’s saved slate");
  }
  const playableOdds = parseAmericanOdds(candidate.odds);
  if (!String(candidate.odds || "").trim() || !playableOdds) {
    candidate.protectionReasons.push("Playable odds are missing");
  }
  if (
    (candidate.market === "Total" || candidate.market === "Pitcher Strikeouts") &&
    !String(candidate.line || "").trim()
  ) {
    candidate.protectionReasons.push("The betting line is missing");
  }
  if (!Number.isFinite(candidate.modelScore) || !Number.isFinite(candidate.trendScore)) {
    candidate.protectionReasons.push("A required selector score is invalid");
  }
}

''',
              "technical protections",
          )

          # TREND PATH: this is the complete source-level eligibility rule.
          # Every active signal must be green, and the recent-window weighted ROI
          # must beat the opposing side by at least 10 percentage points. There is
          # no Trend tier, Trend score, AI score, odds cap, or opposing-7D veto.
          sub1(
              r'function aiTrendSignalsAllGreen\(play: TrendPlay\) \{[\s\S]*?\n}\n\n(?=function aiMergeTrendCandidate)',
              '''function aiTrendSignalsAllGreen(play: TrendPlay) {
  const signals = play.signals || [];
  return (
    EZPZ_TREND_POLICY.requireAllSignalsGreen &&
    signals.length > 0 &&
    signals.every((signal) => signal.tone === "positive")
  );
}

function aiTrendEzpzPolicyResult(play: TrendPlay, trendPlays: TrendPlay[]) {
  if (!aiTrendSignalsAllGreen(play)) {
    return { eligible: false, netRoiAdvantage: Number.NEGATIVE_INFINITY };
  }

  const candidateMetrics = frozenTrendPlayMetrics(play);
  if (!candidateMetrics.hasData) {
    return { eligible: false, netRoiAdvantage: Number.NEGATIVE_INFINITY };
  }

  const sideKey = trendSideComparisonKey(play);
  const opponents = trendPlays
    .filter(
      (candidate) =>
        trendGameInstanceKey(candidate) === trendGameInstanceKey(play) &&
        trendMarketComparisonKey(candidate) === trendMarketComparisonKey(play) &&
        trendSideComparisonKey(candidate) !== sideKey,
    )
    .map((candidate) => ({
      play: candidate,
      metrics: frozenTrendPlayMetrics(candidate),
    }))
    .filter((candidate) => candidate.metrics.hasData)
    .sort((a, b) => b.metrics.score - a.metrics.score);

  const opponent = opponents[0];
  if (!opponent) {
    return { eligible: false, netRoiAdvantage: Number.NEGATIVE_INFINITY };
  }

  const netRoiAdvantage =
    candidateMetrics.roiPct - opponent.metrics.roiPct;
  return {
    eligible:
      netRoiAdvantage >= EZPZ_TREND_POLICY.minimumNetRoiAdvantage,
    netRoiAdvantage: aiRound(netRoiAdvantage, 1),
  };
}

''',
              "trend policy helper",
          )

          # Replace Trend candidate creation so Good/Strong/Elite/Pass labels do
          # not decide eligibility. The exact all-green +10 ROI helper decides it.
          sub1(
              r'function aiMergeTrendCandidate\([\s\S]*?\n}\n\n(?=function buildAiSelectorCandidates)',
              '''function aiMergeTrendCandidate(
  candidateMap: Map<string, AiSelectorCandidate>,
  play: TrendPlay,
  trendPlays: TrendPlay[],
  slateRows: SheetRow[],
  today: string,
) {
  const trendPolicy = aiTrendEzpzPolicyResult(play, trendPlays);
  if (!trendPolicy.eligible) return;

  const slateRow = slateRows.find(
    (row) =>
      normalizeTeam(row["Away Team"] || "") === normalizeTeam(play.awayTeam) &&
      normalizeTeam(row["Home Team"] || "") === normalizeTeam(play.homeTeam),
  ) || null;
  const gameKey = slateRow
    ? draftKingsGameKey(slateRow)
    : `${isoPublicDate(today)}|${normalizeTeam(play.awayTeam)}|${normalizeTeam(play.homeTeam)}`;
  const selection =
    play.market === "Moneyline"
      ? play.selectionTeam || teamFromSelection(play.selection)
      : play.side;
  const line = play.market === "Total" && play.line != null ? String(play.line) : "";
  const id = aiCandidateId(today, gameKey, play.market, selection, line);
  const trendProbability = aiTrendProbability(play);
  const policyWhy = `Trend EZPZ policy passed: every active signal is green and net ROI is +${trendPolicy.netRoiAdvantage.toFixed(1)}% versus the opposing side`;
  const existing = candidateMap.get(id);

  if (existing) {
    const blend = aiTrendBlendWeights(play);
    existing.source = "Best + Trend";
    existing.trendPlay = play;
    existing.trendTier = play.tier;
    existing.trendScore = Number(play.score || 0);
    existing.baselineProbability = aiClamp(
      existing.baselineProbability * blend.modelWeight +
        trendProbability * blend.trendWeight +
        1.5,
      44,
      78,
    );
    existing.scoreAdjustment += 5;
    existing.whySelected.push(policyWhy);
    existing.whySelected.push("Best Play and Trend Play point to the same wager");
    existing.dataStatus.push(
      `Trend EZPZ gate: all green • net ROI +${trendPolicy.netRoiAdvantage.toFixed(1)}%`,
    );
    if (!existing.odds) existing.odds = play.odds || "";
    return;
  }

  const odds = play.odds || "";
  const trendHistoryAdjustment = aiTrendOnlyHistoryAdjustment(play);
  candidateMap.set(id, {
    candidateId: id,
    date: isoPublicDate(today),
    gameKey,
    gameTime: aiGameTime(slateRow) || play.recordGameTime || "",
    game: play.game,
    awayTeam: play.awayTeam,
    homeTeam: play.homeTeam,
    market: play.market,
    play: play.market === "Moneyline"
      ? `${selection} Moneyline`
      : `${play.side} ${line}`.trim(),
    selection,
    line,
    odds,
    source: "Trend Play",
    bestPlayType: "",
    trendTier: play.tier,
    modelScore: 0,
    trendScore: Number(play.score || 0),
    aiScore: aiTrendOnlyBaseScore(Number(play.score || 0)),
    estimatedProbability: trendProbability,
    marketImpliedProbability: aiImpliedProbability(odds),
    estimatedAdvantage: 0,
    selected: false,
    protectionStatus: "PASSED",
    rejectionReason: "",
    confidenceReason: [],
    whySelected: [policyWhy],
    historicalNotes: [
      `Trend evidence sample: about ${trendHistoryAdjustment.effectiveSample.toFixed(1)} effective historical decisions`,
    ],
    risks: [],
    researchSummary: "",
    verdict: "",
    dataStatus: [
      `Trend EZPZ gate: all green • net ROI +${trendPolicy.netRoiAdvantage.toFixed(1)}%`,
    ],
    externalReviewStatus: "NOT_REQUIRED",
    snapshotStatus: "LIVE",
    lockedAt: "",
    updatedAt: nowET(),
    result: "",
    units: 0,
    resultUpdated: "",
    selectorVersion: AI_PICK_SELECTOR_VERSION,
    slateRow,
    bestPlay: null,
    trendPlay: play,
    baselineProbability: trendProbability,
    scoreAdjustment: trendHistoryAdjustment.score,
    probabilityAdjustment: trendHistoryAdjustment.probability,
    protectionReasons: [],
  });
}

''',
              "trend candidate creation",
          )

          sub1(
              r'function buildAiSelectorCandidates\([\s\S]*?\n}\n\n(?=function sanitizeAiPublicText)',
              '''function buildAiSelectorCandidates(
  bestPlays: Play[],
  trendPlays: TrendPlay[],
  slateRows: SheetRow[],
  completedTrackerRows: SheetRow[],
  trackerRows: SheetRow[],
  draftKings: DraftKingsPayload,
  today: string,
) {
  const candidateMap = new Map<string, AiSelectorCandidate>();
  for (const play of bestPlays) {
    const candidate = aiCandidateFromBestPlay(play, slateRows, today);
    if (candidate) candidateMap.set(candidate.candidateId, candidate);
  }
  for (const play of aiPendingTotalBestPlays(trackerRows, today)) {
    const candidate = aiCandidateFromBestPlay(play, slateRows, today);
    if (candidate && !candidateMap.has(candidate.candidateId)) {
      candidateMap.set(candidate.candidateId, candidate);
    }
  }
  for (const play of trendPlays) {
    aiMergeTrendCandidate(candidateMap, play, trendPlays, slateRows, today);
  }

  for (const candidate of candidateMap.values()) {
    aiRecordAdjustments(candidate, completedTrackerRows);
    aiApplyMarketContext(candidate, draftKings);
    aiProtectionChecks(candidate);
  }
  return [...candidateMap.values()];
}

''',
              "candidate builder",
          )

          # Final selection is a literal OR of the two requested paths. Analytics
          # scores/probability/advantage are retained for display only.
          sub1(
              r'function finalizeAiCandidates\([\s\S]*?\nfunction aiFullGameMarketSourceRank',
              '''function finalizeAiCandidates(
  candidates: AiSelectorCandidate[],
  _externalReviews: Map<string, AiExternalReview>,
  _externalStatus: AiPickExternalStatus,
  snapshotStatus: AiPickSnapshotStatus,
  _reviewErrors: Map<string, string> = new Map(),
) {
  const finalized = candidates.map((candidate) => {
    const trendBlend = aiTrendBlendWeights(candidate.trendPlay);
    const baseScore = candidate.source === "Best + Trend"
      ? candidate.modelScore * trendBlend.modelWeight +
        candidate.trendScore * trendBlend.trendWeight
      : candidate.source === "Trend Play" && !candidate.bestPlayType
        ? aiTrendOnlyBaseScore(candidate.trendScore)
        : candidate.modelScore || candidate.trendScore;
    const aiScore = clampScore(baseScore + candidate.scoreAdjustment);
    const estimatedProbability = aiRound(
      aiClamp(candidate.baselineProbability + candidate.probabilityAdjustment, 40, 82),
      1,
    );
    const implied = candidate.marketImpliedProbability || aiImpliedProbability(candidate.odds);
    const advantage = implied ? aiRound(estimatedProbability - implied, 1) : 0;
    const playableOdds = parseAmericanOdds(candidate.odds);

    const technicalBlock = candidate.protectionReasons.length > 0;
    const bestPlayBacked = Boolean(candidate.bestPlayType);
    const trendBacked = Boolean(candidate.trendPlay);

    const qualifiesByBestPlay =
      bestPlayBacked &&
      candidate.pitcherBetTypeForm === EZPZ_BEST_PLAY_POLICY.requiredForm &&
      Boolean(playableOdds) &&
      playableOdds >= EZPZ_BEST_PLAY_POLICY.maxFavoritePrice;

    // aiMergeTrendCandidate attaches a Trend Play only after the hard-coded
    // all-green +10% net ROI policy passes. Recheck all-green here defensively;
    // there are deliberately no Trend tier/score/AI-score/odds gates.
    const qualifiesByTrend =
      trendBacked &&
      Boolean(candidate.trendPlay && aiTrendSignalsAllGreen(candidate.trendPlay));

    const selected =
      !technicalBlock && (qualifiesByBestPlay || qualifiesByTrend);

    const failures: string[] = [];
    if (!selected && !technicalBlock) {
      if (bestPlayBacked) {
        if (candidate.pitcherBetTypeForm !== EZPZ_BEST_PLAY_POLICY.requiredForm) {
          failures.push(
            `${candidate.bestPlayType} is not HOT over its rolling Last 7`,
          );
        } else if (!playableOdds) {
          failures.push("Best Play odds are missing");
        } else if (playableOdds < EZPZ_BEST_PLAY_POLICY.maxFavoritePrice) {
          failures.push(
            `Best Play odds ${playableOdds} exceed the -150 maximum price`,
          );
        }
      }
      if (!trendBacked && !bestPlayBacked) {
        failures.push("No Best Play or qualifying Trend Play path is attached");
      }
    }

    const rejectionReason = technicalBlock
      ? candidate.protectionReasons.join(" • ")
      : failures.join(" • ");
    const qualificationNote = selected
      ? qualifiesByBestPlay && qualifiesByTrend
        ? "Qualified through both EZPZ paths: HOT Best Play at -150 or better, and all-green Trend with +10% net ROI or better."
        : qualifiesByBestPlay
          ? "Qualified through the Best Play path: HOT over the rolling Last 7 and odds -150 or better."
          : "Qualified through the Trend Play path: every active trend signal is green and net ROI is at least +10% versus the opposing side."
      : "";

    return {
      ...candidate,
      aiScore,
      estimatedProbability,
      marketImpliedProbability: implied,
      estimatedAdvantage: advantage,
      selected,
      protectionStatus: technicalBlock ? "BLOCKED" as const : "PASSED" as const,
      rejectionReason,
      confidenceReason: sanitizeAiPublicList(candidate.confidenceReason, 6),
      whySelected: sanitizeAiPublicList(
        qualificationNote
          ? [qualificationNote, ...candidate.whySelected]
          : candidate.whySelected,
        14,
      ),
      historicalNotes: sanitizeAiPublicList(candidate.historicalNotes, 5),
      risks: [],
      researchSummary: sanitizeAiPublicText(candidate.researchSummary),
      verdict: sanitizeAiPublicText(candidate.verdict),
      dataStatus: [
        ...new Set([qualificationNote, ...candidate.dataStatus].filter(Boolean)),
      ].slice(0, 5),
      externalReviewStatus: "NOT_REQUIRED" as const,
      snapshotStatus,
      lockedAt: snapshotStatus === "FINAL_PREGAME" ? nowET() : "",
      updatedAt: nowET(),
      selectorVersion: AI_PICK_SELECTOR_VERSION,
    };
  });

  const publicPicks = finalized.map(({
    slateRow,
    bestPlay,
    trendPlay,
    baselineProbability,
    scoreAdjustment,
    probabilityAdjustment,
    protectionReasons,
    ...pick
  }) => pick as AiPick);

  return applyAiFullGameMarketLimit(publicPicks);
}

function aiFullGameMarketSourceRank''',
              "final selector",
          )

          # Stored decisions: Best-only picks recheck only HOT and -150. A
          # Best+Trend pick has an independent qualifying Trend path and must not
          # be demoted merely because its Best Play form later changes.
          sub1(
              r'function aiStoredLastSevenQualificationCorrection\([\s\S]*?\n}\n\n(?=function aiStoredFinalSelectionIsLocked)',
              '''function aiStoredLastSevenQualificationCorrection(
  pick: AiPick,
  completedTrackerRows: SheetRow[],
  selectorNow: number,
): AiPick | null {
  if (
    pick.snapshotStatus !== "FINAL_PREGAME" ||
    !pick.bestPlayType ||
    pick.source !== "Best Play"
  ) {
    return null;
  }

  const managedByThisGate = pick.rejectionReason.startsWith(
    AI_STORED_LAST7_GATE_PREFIX,
  );
  if (!pick.selected && !managedByThisGate) return null;

  const start = scheduledGameStart({
    Date: pick.date,
    "Game Time": pick.gameTime,
  });
  if (start != null && selectorNow >= start) return null;

  const recordType = aiCanonicalBestPlayType(pick.bestPlayType);
  if (!recordType) return null;
  const lastSeven = aiLastSevenBetsSummaryForType(completedTrackerRows, recordType);
  const form = aiPitcherBetTypeForm(lastSeven);
  const formLabel =
    form === "HOT" ? "Hot" :
    form === "COLD" ? "Cold" :
    form === "NEUTRAL" ? "Neutral" : "Small Sample";
  const statusLine = `${recordType} Last 7 Bets: ${formLabel} • ${lastSeven.record}`;
  const playableOdds = parseAmericanOdds(pick.odds);

  let failure = "";
  if (form !== EZPZ_BEST_PLAY_POLICY.requiredForm) {
    failure = `${recordType} is ${formLabel} over its rolling Last 7 (${lastSeven.record}); Best Play EZPZ Picks require HOT form`;
  } else if (!playableOdds) {
    failure = `${recordType} is missing playable odds`;
  } else if (playableOdds < EZPZ_BEST_PLAY_POLICY.maxFavoritePrice) {
    failure = `${recordType} odds ${playableOdds} exceed the -150 maximum price`;
  }

  const cleanedStatus = pick.dataStatus.filter(
    (item) =>
      !String(item).startsWith(`${recordType} Last 7 Bets:`) &&
      !String(item).startsWith(AI_STORED_LAST7_GATE_PREFIX),
  );

  if (failure) {
    const rejectionReason = `${AI_STORED_LAST7_GATE_PREFIX} ${failure}`;
    return {
      ...pick,
      selected: false,
      protectionStatus: "BLOCKED",
      rejectionReason,
      dataStatus: [statusLine, rejectionReason, ...cleanedStatus].slice(0, 5),
      updatedAt: nowET(),
      selectorVersion: AI_PICK_SELECTOR_VERSION,
    };
  }

  if (managedByThisGate && !pick.selected) {
    return {
      ...pick,
      selected: true,
      protectionStatus: "PASSED",
      rejectionReason: "",
      dataStatus: [statusLine, ...cleanedStatus].slice(0, 5),
      updatedAt: nowET(),
      selectorVersion: AI_PICK_SELECTOR_VERSION,
    };
  }

  return null;
}

''',
              "stored Best Play recheck",
          )

          sub1(
              r'function aiStoredFinalSelectionIsLocked\(pick: AiPick\) \{[\s\S]*?\n}\n\n(?=function aiStoredFinalDecisionIsTerminal)',
              '''function aiStoredFinalSelectionIsLocked(pick: AiPick) {
  return (
    pick.snapshotStatus === "FINAL_PREGAME" &&
    pick.selected === true &&
    (pick.externalReviewStatus === "NOT_REQUIRED" ||
      pick.externalReviewStatus === "WEB_REVIEWED") &&
    (pick.externalReviewStatus !== "NOT_REQUIRED" ||
      pick.selectorVersion === AI_PICK_SELECTOR_VERSION)
  );
}

''',
              "stored selection lock",
          )
          sub1(
              r'function aiStoredFinalDecisionIsTerminal\(pick: AiPick\) \{[\s\S]*?\n}\n\n(?=function aiSortByGameTime)',
              '''function aiStoredFinalDecisionIsTerminal(pick: AiPick) {
  if (pick.snapshotStatus !== "FINAL_PREGAME") return false;
  if (
    pick.externalReviewStatus === "NOT_REQUIRED" &&
    pick.selectorVersion === AI_PICK_SELECTOR_VERSION
  ) {
    return true;
  }
  if (aiStoredFinalSelectionIsLocked(pick)) return true;
  if (pick.externalReviewStatus === "WEB_REVIEWED") return true;
  if (pick.externalReviewStatus === "REVIEW_ERROR") return false;
  return (
    pick.externalReviewStatus === "NO_VERIFIED_CONTEXT" &&
    pick.protectionStatus === "BLOCKED" &&
    pick.selectorVersion === AI_PICK_SELECTOR_VERSION
  );
}

''',
              "stored terminal decision",
          )

          # Re-evaluate any pregame candidate under the new deterministic rules,
          # including newly eligible Trend candidates that had no stored row under
          # the old Good/69/80 gates. Do not create new picks after first pitch.
          sub1(
              r'  const targetCandidates = candidates\.filter\(\(candidate\) => \{[\s\S]*?\n  \}\);\n  // Deterministic failures can never become selected after research\.[\s\S]*?\n  const reviewCandidates = targetCandidates\.filter\([\s\S]*?\n  \);',
              '''  const targetCandidates = candidates.filter((candidate) => {
    if (!targetGameKeys.has(candidate.gameKey)) return false;
    const storedPick = storedTodayByCandidateId.get(candidate.candidateId);
    if (storedPick && aiStoredFinalDecisionIsTerminal(storedPick)) return false;
    const started = candidate.slateRow
      ? !isPregameRow(candidate.slateRow, selectorNow)
      : false;
    return !started;
  });''',
              "target candidates",
          )

          # No paid/external review is part of these two qualification rules.
          # Final-pregame simply freezes the deterministic result.
          sub1(
              r'  let externalReviews = new Map<string, AiExternalReview>\(\);[\s\S]*?\n  }\n\n  const refreshedStored =',
              '''  if (targetCandidates.length) {
    const finalTargetPicks = finalizeAiCandidates(
      targetCandidates,
      new Map(),
      "NOT_CONFIGURED",
      "FINAL_PREGAME",
    );
    await persistAiPickRows(finalTargetPicks);
    const finalRows = finalTargetPicks.map(aiPickRow);
    const finalizedCandidateIds = new Set(
      finalTargetPicks.map((pick) => pick.candidateId),
    );
    workingStoredRows = [
      ...workingStoredRows.filter((row) => {
        const storedPick = parseAiPickRow(row);
        return !storedPick || !finalizedCandidateIds.has(storedPick.candidateId);
      }),
      ...finalRows,
    ];
  }

  const refreshedStored =''',
              "remove external review selector",
          )

          # Status should describe the deterministic lock, not external research.
          s = s.replace(
              'externalResearchConfigured: Boolean(process.env.OPENAI_API_KEY),',
              'externalResearchConfigured: false,',
          )
          s = s.replace(
              '"Live selector preview; external context is reviewed and locked with the final pregame snapshot"',
              '"Live EZPZ preview; qualifying plays are frozen with the final pregame snapshot"',
          )

          # Remove stale policy wording in the unused research prompt so the repo
          # contains no contradictory Neutral/Sample Best Play qualification rules.
          s = s.replace(
              'Hot = 74 score / 50% probability / 1.5% advantage; Neutral = 80 / 52.5% / 3.25%; Small Sample = 86 / 55% / 5%; Cold is excluded before review.',
              'Best Play eligibility is HOT-only with odds no worse than -150. Neutral, Small Sample, and Cold do not qualify through the Best Play path.',
          )

          # Direct-source invariants. These fail the job before any commit if old
          # qualification gates survived.
          checks = [
              'requiredForm: "HOT" as const',
              'maxFavoritePrice: -150',
              'minimumNetRoiAdvantage: 10',
              'signals.every((signal) => signal.tone === "positive")',
              'aiTrendEzpzPolicyResult(play, trendPlays)',
              'netRoiAdvantage >= EZPZ_TREND_POLICY.minimumNetRoiAdvantage',
              'candidate.pitcherBetTypeForm === EZPZ_BEST_PLAY_POLICY.requiredForm',
              'playableOdds >= EZPZ_BEST_PLAY_POLICY.maxFavoritePrice',
          ]
          for marker in checks:
              if marker not in s:
                  raise SystemExit(f"Missing final policy invariant: {marker}")

          forbidden = [
              'if (play.tier === "Good") return;',
              'rawTrendScore >= 69',
              'qualificationScore >= 80',
              'candidate.trendPlay?.tier !== "Pass"',
          ]
          for marker in forbidden:
              if marker in s:
                  raise SystemExit(f"Legacy EZPZ qualification gate survived: {marker}")

          path.write_text(s)
          PY

          # This workflow is a migration tool only. Delete it in the resulting
          # commit so builds remain plain source builds with no policy patching.
          rm .github/workflows/fix-ezpz-qualification.yml

      - name: Build from committed source rules
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build

      - name: Commit direct-source repair
        run: |
          git config user.name "ezpzpicks"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/public-data/route.ts .github/workflows/fix-ezpz-qualification.yml
          git commit -m "Restore exact EZPZ qualification paths"
          git push origin main

name: Apply MLB pending gap-only layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mlb-pending-gap-only.yml'
      - 'scripts/apply_mlb_pending_gap_only.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pending gap-only UI
        run: python scripts/apply_mlb_pending_gap_only.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build verification
        run: npm run build
      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Show only gap on pending MLB EZPZ picks"
          git push

name: Apply NFL EZPZ exact Last 7 records

on:
  push:
    branches:
      - chatgpt/nfl-ezpz-exact-last7
    paths:
      - .github/workflows/apply-nfl-ezpz-exact-last7.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/nfl-ezpz-exact-last7
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Last 7 record patch
        run: python scripts/apply-nfl-ezpz-exact-last7.py

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit tested patch and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-nfl-ezpz-exact-last7.yml scripts/apply-nfl-ezpz-exact-last7.py
          git add app/FootballBoard.tsx
          git commit -m "Show exact NFL EZPZ Last 7 records"
          git push origin HEAD:chatgpt/nfl-ezpz-exact-last7

name: Run football EZPZ records source update

on:
  push:
    branches:
      - chatgpt/ezpz-football-records-cleanup
    paths:
      - .github/workflows/run-ezpz-records-v3.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ezpz-football-records-cleanup
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source update
        run: python scripts/one_shot_ezpz_records.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/FootballBoard.tsx
          git rm scripts/one_shot_ezpz_records.py
          git commit -m "Add football EZPZ records and simplify pick cards"
          git push origin HEAD:chatgpt/ezpz-football-records-cleanup

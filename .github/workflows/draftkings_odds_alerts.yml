name: EZPZ DraftKings Odds Alerts

on:
  schedule:
    - cron: "*/5 0-23 * * *"
  workflow_dispatch:
  push:
    branches:
      - agent/verify-ntfy

permissions:
  contents: read

env:
  TZ: America/New_York

concurrency:
  group: ezpz-draftkings-odds-alerts
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Verify ntfy secret and send one-time test notification
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/verify-ntfy'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          test -n "$NTFY_TOPIC" || { echo "::error::NTFY_TOPIC repository secret is missing or empty"; exit 1; }
          node --input-type=module <<'NODE'
          const topic = String(process.env.NTFY_TOPIC || "").trim();
          if (!/^[-_A-Za-z0-9]{1,64}$/.test(topic)) {
            throw new Error("NTFY_TOPIC is present but has invalid characters or is longer than 64 characters");
          }
          const response = await fetch("https://ntfy.sh/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              topic,
              title: "EZPZ Odds Alerts Test",
              message: "GitHub Actions -> ntfy is working. DraftKings odds alerts are connected.",
              priority: 3,
              tags: ["white_check_mark"]
            })
          });
          if (!response.ok) throw new Error(`ntfy returned HTTP ${response.status} ${response.statusText}`);
          console.log("NTFY_TOPIC is configured and ntfy accepted the test notification.");
          NODE

      - name: Restore previous DraftKings alert state
        uses: actions/cache/restore@v4
        with:
          path: .cache/draftkings_odds_alert_state.json
          key: draftkings-odds-alert-state-${{ github.run_id }}
          restore-keys: |
            draftkings-odds-alert-state-

      - name: Check DraftKings for meaningful odds movement
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_ALERT_CLICK_URL: https://ezpzpicks.com
        run: node scripts/draftkings_odds_alerts.mjs

      - name: Save DraftKings alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/draftkings_odds_alert_state.json
          key: draftkings-odds-alert-state-${{ github.run_id }}

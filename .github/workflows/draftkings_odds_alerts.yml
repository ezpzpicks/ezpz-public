name: EZPZ DraftKings Odds Alerts (Manual Only)

# Intraday movement notifications are intentionally disabled. This workflow is
# retained only for an on-demand manual check if we ever want to inspect the old
# movement-alert behavior without re-enabling scheduled phone pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: America/New_York

concurrency:
  group: ezpz-draftkings-odds-alerts
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous DraftKings alert state
        uses: actions/cache/restore@v4
        with:
          path: .cache/draftkings_odds_alert_state.json
          key: draftkings-odds-alert-state-${{ github.run_id }}
          restore-keys: |
            draftkings-odds-alert-state-

      - name: Manually check DraftKings for meaningful odds movement
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_ALERT_CLICK_URL: https://ezpzpicks.com
        run: node scripts/draftkings_odds_alerts.mjs

      - name: Save DraftKings alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/draftkings_odds_alert_state.json
          key: draftkings-odds-alert-state-${{ github.run_id }}

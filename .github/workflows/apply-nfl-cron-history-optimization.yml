name: Apply NFL cron history optimization

'on':
  push:
    paths:
      - '.github/nfl_cron_history_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/nfl_cron_history_patch.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Verify diff
        run: git diff --check
      - name: Commit patch and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-nfl-cron-history-optimization.yml .github/nfl_cron_history_patch.py
          git add lib/footballWeeklyMarket.ts
          git commit -m "Avoid NFL cron historical snapshot rescans"
          git push origin HEAD:main

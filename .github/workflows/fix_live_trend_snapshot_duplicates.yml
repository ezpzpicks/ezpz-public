name: Fix Live Trend Snapshot Duplicates

on:
  push:
    branches:
      - agent/fix-live-trend-snapshot-duplicates

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-live-trend-snapshot-duplicates

      - name: Patch live and final trend dedupe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/public-data/route.ts')
          text = path.read_text()

          old_live = "  return scoreHeadToHeadTrendPlays(rawPlays).sort((a, b) => {"
          new_live = (
              "  // DraftKings can retain an earlier snapshot alongside the current row.\n"
              "  // Collapse those rows before head-to-head scoring so stale snapshots cannot\n"
              "  // influence the opposing-side comparison, then rank/dedupe once more after scoring.\n"
              "  const latestRawPlays = rankTrendPlays(rawPlays);\n"
              "  return rankTrendPlays(scoreHeadToHeadTrendPlays(latestRawPlays)).sort((a, b) => {"
          )
          if old_live not in text:
              raise SystemExit('buildTrendPlays target statement not found')
          text = text.replace(old_live, new_live, 1)

          old_overlay = "  return combined.sort((a, b) => {"
          new_overlay = (
              "  // Final response-level safeguard: collapse any overlap after live/frozen sources combine.\n"
              "  return rankTrendPlays(combined).sort((a, b) => {"
          )
          if old_overlay not in text:
              raise SystemExit('overlayFrozenTrendPlays target statement not found')
          text = text.replace(old_overlay, new_overlay, 1)
          path.write_text(text)
          PY

      - name: Verify source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/api/public-data/route.ts').read_text()
          start = text.index('function buildTrendPlays(')
          end = text.index('\nfunction trendSnapshotFields(', start)
          build = text[start:end]
          assert 'const latestRawPlays = rankTrendPlays(rawPlays);' in build
          assert 'rankTrendPlays(scoreHeadToHeadTrendPlays(latestRawPlays))' in build

          start = text.index('function overlayFrozenTrendPlays(')
          end = text.index('\nfunction rowsFromLast7Days(', start)
          overlay = text[start:end]
          assert 'return rankTrendPlays(combined).sort' in overlay

          rank_start = text.index('function rankTrendPlays(')
          rank_end = text.index('\nfunction trendPlayForAllGameRow(', rank_start)
          rank = text[rank_start:rank_end]
          assert 'trendGameInstanceKey(play)' in rank
          assert '`${play.market}|${trendSideComparisonKey(play)}`' in rank
          print('Live/final trend dedupe invariants passed.')
          PY

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit validated route fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/public-data/route.ts
          if git diff --cached --quiet; then
            echo 'No route changes to commit.'
            exit 0
          fi
          git commit -m 'Deduplicate retained live trend snapshots'
          git push origin HEAD:agent/fix-live-trend-snapshot-duplicates

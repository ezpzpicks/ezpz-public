name: Apply CFB Week 2 trend sample guardrail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-week2-trend-sample-guardrail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CFB EZPZ trend sample safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend qualification: preserve the stored/displayed trend score and tier,
          # but apply CFB-only sample rules when a trend enters the EZPZ card.
          path = Path('lib/footballPublicData.ts')
          text = path.read_text()
          loop_start = text.find('  for (const play of headToHead(trends)) {')
          loop_end = text.find('  const deduped = new Map<string, FootballEzpzPick>();', loop_start)
          if loop_start < 0 or loop_end < 0:
              raise SystemExit('Could not locate football EZPZ trend candidate loop')
          block = text[loop_start:loop_end]

          old_head = '''  for (const play of headToHead(trends)) {\n    if (play.tier !== "Strong" && play.tier !== "Elite") continue;\n    if (!play.signals.length || !play.signals.every((signal) => signal.tone === "positive")) continue;'''
          new_head = '''  for (const play of headToHead(trends)) {\n    if (play.tier !== "Strong" && play.tier !== "Elite") continue;\n    const trendSampleSize = Number(play.TrendSampleSize || 0);\n    // CFB early-season safeguard only: 1-4 samples cannot enter EZPZ;\n    // 5-9 samples may qualify, but are capped at Strong. The underlying\n    // trend score/tier remains untouched for clean forward data collection.\n    if (sport === "NCAAF" && trendSampleSize < 5) continue;\n    const ezpzTrendTier =\n      sport === "NCAAF" && trendSampleSize < 10 && play.tier === "Elite"\n        ? "Strong"\n        : play.tier;\n    if (!play.signals.length || !play.signals.every((signal) => signal.tone === "positive")) continue;'''
          if old_head in block:
              block = block.replace(old_head, new_head, 1)
          elif 'trendSampleSize < 5' not in block or 'ezpzTrendTier' not in block:
              raise SystemExit('Could not locate trend qualification head')

          old_tier = '      tier: `${play.tier} Trend Play`,\n'
          new_tier = '      tier: `${ezpzTrendTier} Trend Play`,\n'
          if old_tier in block:
              block = block.replace(old_tier, new_tier, 1)
          elif new_tier not in block:
              raise SystemExit('Could not locate EZPZ trend tier output')

          text = text[:loop_start] + block + text[loop_end:]
          path.write_text(text)

          # Frontend defense-in-depth: a stale/cached 1-4 sample CFB trend card
          # must not render even if it somehow bypasses the backend candidate gate.
          path = Path('app/FootballBoard.tsx')
          text = path.read_text()
          old_sig = 'function fbTrendPickPassesEzpzRules(pick: EzpzPick, trendPlays: TrendPlay[]) {'
          new_sig = 'function fbTrendPickPassesEzpzRules(pick: EzpzPick, trendPlays: TrendPlay[], sport: Sport) {'
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
          elif new_sig not in text:
              raise SystemExit('Could not locate frontend trend qualification helper')

          old_play_gate = '''  const play = fbTrendPlayForPick(pick, trendPlays);\n  if (!play || (play.tier !== "Strong" && play.tier !== "Elite")) return false;\n  if (!play.signals?.length) return false;'''
          new_play_gate = '''  const play = fbTrendPlayForPick(pick, trendPlays);\n  if (!play || (play.tier !== "Strong" && play.tier !== "Elite")) return false;\n  if (sport === "NCAAF" && Number(play.TrendSampleSize || 0) < 5) return false;\n  if (!play.signals?.length) return false;'''
          if old_play_gate in text:
              text = text.replace(old_play_gate, new_play_gate, 1)
          elif 'Number(play.TrendSampleSize || 0) < 5' not in text:
              raise SystemExit('Could not locate frontend sample gate insertion point')

          old_call = 'fbTrendPickPassesEzpzRules(pick, ezpzTrendSource)'
          new_call = 'fbTrendPickPassesEzpzRules(pick, ezpzTrendSource, sport)'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('Could not locate frontend trend qualification call')

          path.write_text(text)
          PY

      - name: Verify CFB trend sample policy
        shell: bash
        run: |
          grep -Fq 'sport === "NCAAF" && trendSampleSize < 5' lib/footballPublicData.ts
          grep -Fq 'sport === "NCAAF" && trendSampleSize < 10 && play.tier === "Elite"' lib/footballPublicData.ts
          grep -Fq 'tier: `${ezpzTrendTier} Trend Play`' lib/footballPublicData.ts
          grep -Fq 'Number(play.TrendSampleSize || 0) < 5' app/FootballBoard.tsx
          grep -Fq 'fbTrendPickPassesEzpzRules(pick, ezpzTrendSource, sport)' app/FootballBoard.tsx
          git diff --check

      - name: Build application
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Commit implementation
        run: |
          if git diff --quiet -- lib/footballPublicData.ts app/FootballBoard.tsx; then
            echo 'No CFB trend sample guardrail source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/footballPublicData.ts app/FootballBoard.tsx
          git commit -m 'cfb: add early-season EZPZ trend sample safeguards'
          git pull --rebase origin main
          git push origin HEAD:main

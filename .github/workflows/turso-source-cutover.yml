name: Turso source cutover

on:
  push:
    branches: [turso-full-cutover]

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-full-cutover
          fetch-depth: 0
      - name: Transform permanent public storage source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/turso_source_cutover.mjs")
          text = path.read_text()
          text = text.replace(" || lifecycle.includes(\"google.\")", "")
          text = text.replace('''  const existing = await readTursoDataset("MLB", tabName);
          if (!existing) {
            await replaceTursoDataset("MLB", tabName, [], headers);
            invalidateWorksheetReadCache(tabName);
            return;
          }
          const merged = [...(existing.headers || [])];
          for (const header of headers) if (header && !merged.includes(header)) merged.push(header);
          if (merged.length !== (existing.headers || []).length) {
            await replaceTursoDataset("MLB", tabName, existing.rows, merged);
            invalidateWorksheetReadCache(tabName);
          }''', '''  const existing = await readTursoDataset("MLB", tabName, headers);
          if (!existing.length) {
            await replaceTursoDataset("MLB", tabName, [], headers);
            invalidateWorksheetReadCache(tabName);
          }''')
          text = text.replace('''  const dataset = await readTursoDataset("MLB", tabName);
          const headers = [...(dataset?.headers || [])];
          for (const header of createHeaders) if (header && !headers.includes(header)) headers.push(header);
          return matrixFromDataset(headers, (dataset?.rows || []) as SheetRow[]);''', '''  const rows = await readTursoDataset("MLB", tabName, createHeaders);
          const headers = [...createHeaders];
          for (const row of rows) {
            for (const key of Object.keys(row || {})) if (key && !headers.includes(key)) headers.push(key);
          }
          return matrixFromDataset(headers, rows as SheetRow[]);''')
          text = text.replace('''  const dataset = await readTursoDataset("UFC", tabName);
          return ((dataset?.rows || []) as SheetRow[]).map((row) => ({ ...row }));''', '''  return [];''')
          path.write_text(text)
          PY
          node scripts/turso_source_cutover.mjs
      - name: Remove googleapis package
        run: npm uninstall googleapis --package-lock-only --ignore-scripts
      - name: Install and verify build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit permanent source cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Replace public Google storage with Turso"
          git push origin HEAD:turso-full-cutover

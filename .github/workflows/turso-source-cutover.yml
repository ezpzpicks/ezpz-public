name: Turso source cutover

on:
  push:
    branches: [turso-full-cutover]

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-full-cutover
          fetch-depth: 0
      - name: Transform permanent public storage source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/turso_source_cutover.mjs")
          text = path.read_text()
          text = text.replace(' || lifecycle.includes("google.")', '')
          path.write_text(text)
          PY
          node scripts/turso_source_cutover.mjs
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/api/public-data-core.ts")
          text = path.read_text()

          def replace_between(start_marker, end_marker, replacement):
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          replace_between(
              "async function ensureWorksheet(",
              "async function readWorksheetMatrixWithClient(",
              '''async function ensureWorksheet(
            _sheets: any,
            _spreadsheetId: string,
            tabName: string,
            headers: string[] = [],
          ) {
            assertTursoStorage();
            const existing = await readTursoDataset("MLB", tabName, headers);
            if (!existing.length) {
              await replaceTursoDataset("MLB", tabName, [], headers);
              invalidateWorksheetReadCache(tabName);
            }
          }''',
          )

          replace_between(
              "async function readWorksheetMatrixWithClient(",
              "async function writeWholeWorksheet(",
              '''async function readWorksheetMatrixWithClient(
            _sheets: any,
            _spreadsheetId: string,
            tabName: string,
            createHeaders: string[] = [],
          ): Promise<WorksheetMatrix> {
            assertTursoStorage();
            await ensureWorksheet(null, "turso:MLB", tabName, createHeaders);
            const rows = await readTursoDataset("MLB", tabName, createHeaders);
            const headers = [...createHeaders];
            for (const row of rows) {
              for (const key of Object.keys(row || {})) {
                if (key && !headers.includes(key)) headers.push(key);
              }
            }
            return matrixFromDataset(headers, rows as SheetRow[]);
          }''',
          )

          ufc_start = text.find("async function readUfcWorksheet(")
          if ufc_start >= 0:
              match = re.search(r"\n(?:async )?function\s+", text[ufc_start + 1:])
              if not match:
                  raise RuntimeError("Could not find function after readUfcWorksheet")
              ufc_end = ufc_start + 1 + match.start() + 1
              text = (
                  text[:ufc_start]
                  + '''async function readUfcWorksheet(_tabName: string): Promise<SheetRow[]> {
            return [];
          }\n\n'''
                  + text[ufc_end:]
              )

          if "existing.headers" in text or "dataset?.headers" in text or "dataset?.rows" in text:
              raise RuntimeError("Old Turso object-shape assumptions remain in public-data-core.ts")

          path.write_text(text)
          PY
      - name: Remove googleapis package
        run: npm uninstall googleapis --package-lock-only --ignore-scripts
      - name: Install and verify build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Commit permanent source cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Replace public Google storage with Turso"
          git push origin HEAD:turso-full-cutover

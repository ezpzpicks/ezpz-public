name: Finalize EZPZ source policy

on:
  push:
    paths:
      - ".github/workflows/hardcode-ezpz-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize source rules
        run: node scripts/hardcode_ezpz_policy_source.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Verify production build
        run: npm run build
      - name: Commit source rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Finalize HOT-only and Trend EZPZ source gates"
          git push

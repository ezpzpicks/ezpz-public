name: Hard-code EZPZ policy

# One-time migration. Updating this file triggers the materialization job.
on:
  push:
    paths:
      - ".github/workflows/hardcode-ezpz-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize current build behavior into tracked source
        run: npm run prebuild

      - name: Hard-code permanent EZPZ qualification policy
        run: node scripts/hardcode_ezpz_policy_source.mjs

      - name: Verify source policy and remove patch lifecycle
        shell: bash
        run: |
          grep -q 'requiredForm: "HOT" as const' app/api/public-data/route.ts
          grep -q 'maxFavoritePrice: -150' app/api/public-data/route.ts
          grep -q 'minimumNetRoiAdvantage: 10' app/api/public-data/route.ts
          grep -q 'signals.every((signal) => signal.tone === "positive")' app/api/public-data/route.ts
          grep -q 'netRoiAdvantage >= EZPZ_TREND_POLICY.minimumNetRoiAdvantage' app/api/public-data/route.ts
          ! grep -q '"prebuild"' package.json

      - name: Commit direct-source policy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts app/page.tsx app/FootballBoard.tsx lib package.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Hard-code EZPZ HOT and trend qualification rules"
          git push

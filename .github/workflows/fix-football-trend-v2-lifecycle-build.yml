name: Fix football Trend V2 lifecycle build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-football-trend-v2-lifecycle-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize lifecycle sources with strict typing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/add-football-trend-v2-lifecycle.yml').read_text()

          def extract(target: str, next_marker: str):
              marker = f"          cat > {target} <<'EOF'\n"
              if marker not in workflow:
                  raise SystemExit(f'Missing source marker for {target}')
              segment = workflow.split(marker, 1)[1].split("          EOF\n", 1)[0]
              lines = []
              for line in segment.splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              text = '\n'.join(lines) + '\n'
              Path(target).write_text(text)

          extract('lib/footballTrendV2Lifecycle.ts', '')
          extract('app/api/football-weekly-market/route.ts', '')
          extract('app/api/cron/football-public-snapshot/route.ts', '')

          path = Path('lib/footballTrendV2Lifecycle.ts')
          text = path.read_text()
          old = '  const initial = payload.trendPlays.map((play) => {'
          new = '  const initial: Array<Record<string, any>> = payload.trendPlays.map((play) => {'
          if old not in text:
              raise SystemExit('Could not find strict typing patch target')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build production app
        shell: bash
        run: |
          npm install
          npm run build

      - name: Commit lifecycle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballTrendV2Lifecycle.ts app/api/football-weekly-market/route.ts app/api/cron/football-public-snapshot/route.ts
          git commit -m "Add automatic football Trend V2 promotion"
          git push

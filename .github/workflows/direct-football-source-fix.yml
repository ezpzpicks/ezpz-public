name: Direct football source correction

on:
  push:
    paths:
      - .github/workflows/direct-football-source-fix.yml

permissions:
  contents: write

jobs:
  correct-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          page_path = Path("app/page.tsx")
          page = page_path.read_text()
          for old, new in [
              ('Best Plays - Last 7 Days', 'Model Plays - Last 7 Days'),
              ('Best Plays - Running Total', 'Model Plays - Running Total'),
              ('Last 7 Days Best Plays', 'Last 7 Days Model Plays'),
              ('Overall Best Plays', 'Overall Model Plays'),
              ('Pending Best Plays', 'Pending Model Plays'),
              ('No qualified Best Plays saved yet for', 'No qualified Model Plays saved yet for'),
              ('{meta.name} Best Plays', '{meta.name} Model Plays'),
              ('Best Plays will appear here', 'Model Plays will appear here'),
              ('qualified Best Plays and Trend Plays', 'qualified Model Plays and Trend Plays'),
              ('evaluating today’s Best Plays and Trend Plays', 'evaluating today’s Model Plays and Trend Plays'),
              ('Best Play Record Snapshot', 'Model Play Record Snapshot'),
              ('HOT Best Play saved as final', 'HOT Model Play saved as final'),
          ]:
              page = page.replace(old, new)
          page_path.write_text(page)

          board_path = Path("app/FootballBoard.tsx")
          board = board_path.read_text()
          record_rendering = base64.b64decode('').decode()
          start = board.index('function fallbackTotals(): RecordTotals {')
          end = board.index('function RecordDropdown(', start)
          board = board[:start] + record_rendering + board[end:]
          record_helpers = base64.b64decode('').decode()
          anchor = board.index('function recentLabel(row: SheetRow) {')
          board = board[:anchor] + record_helpers + board[anchor:]
          records_function = base64.b64decode('').decode()
          records_start = board.index('function FootballRecords({ sport, data }')
          records_end = board.index('\n\nexport default function FootballBoard', records_start)
          board = board[:records_start] + records_function + board[records_end:]
          board_path.write_text(board)

          base_path = Path("app/FootballBoardBase.tsx")
          base = base_path.read_text()
          for old, new in [
              ('Last 7 Days Best Plays', 'Last 7 Days Model Plays'),
              ('Overall Best Plays', 'Overall Model Plays'),
              ('Completed Best Plays', 'Completed Model Plays'),
              ('No graded ${sport} Best Plays', 'No graded ${sport} Model Plays'),
              ('Best Plays and trend signals', 'Model Plays and trend signals'),
              ('HOT Best Plays', 'HOT Model Plays'),
              ('Best Play Record Snapshot', 'Model Play Record Snapshot'),
              ('Best Plays that also matched', 'Model Plays that also matched'),
              ('individual Best Plays', 'individual Model Plays'),
          ]:
              base = base.replace(old, new)
          base_path.write_text(base)

          public_data_path = Path("lib/footballPublicData.ts")
          public_data = public_data_path.read_text()
          public_data = public_data.replace('Best Play = HOT Last-7', 'Model Play = HOT Last-7')
          public_data = public_data.replace('play.formType || "Best Play"', 'play.formType || "Model Play"')
          public_data_path.write_text(public_data)
          PY
      - name: Commit canonical source update and remove migration workflow
        shell: bash
        run: |
          git config user.name "ezpzpicks"
          git config user.email "ryanpaez5@gmail.com"
          git rm .github/workflows/direct-football-source-fix.yml
          git add app/page.tsx app/FootballBoard.tsx app/FootballBoardBase.tsx lib/footballPublicData.ts
          git commit -m "Fix NFL prop records terminology and record colors"
          git push origin HEAD:main

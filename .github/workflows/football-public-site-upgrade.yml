name: Football public site source upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-public-site-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Apply football public site source upgrades'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply permanent source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Route both football sports' Full Slate and Model Plays through the
          # permanent game-grouped UI. Keep the existing NFL EZPZ and Records
          # implementations for the tabs they own.
          path = Path("app/FootballBoard.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              'import FootballBoardBase from "./FootballBoardBase";\n',
              'import FootballBoardBase from "./FootballBoardBase";\nimport FootballGameTabs from "./FootballGameTabs";\n',
              "FootballBoard import",
          )

          # Remove the superseded flat NFL Model Plays renderer rather than
          # leaving a second implementation that can drift back into use.
          start = text.find("function FormPill(")
          end = text.find("function sourceLabel(")
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("FootballBoard model renderer block not found")
          text = text[:start] + text[end:]

          old_router = '''export default function FootballBoard({ sport, tab, data }: { sport: Sport; tab: Tab; data: FootballData & Record<string, any> }) {
            if (tab === "Records") return <FootballRecords sport={sport} data={data} />;
            if (sport !== "NFL" || (tab !== "Today’s Model Plays" && tab !== "EZPZ Picks")) {
              return <FootballBoardBase sport={sport} tab={tab} data={data as any} />;
            }
            return (
              <>
                {tab === "Today’s Model Plays" ? <NflModelPlays data={data} /> : <NflEzpzPicks data={data} />}
          '''
          new_router = '''export default function FootballBoard({ sport, tab, data }: { sport: Sport; tab: Tab; data: FootballData & Record<string, any> }) {
            if (tab === "Full Slate" || tab === "Today’s Model Plays") {
              return <FootballGameTabs sport={sport} tab={tab} data={data} />;
            }
            if (tab === "Records") return <FootballRecords sport={sport} data={data} />;
            if (sport !== "NFL" || tab !== "EZPZ Picks") {
              return <FootballBoardBase sport={sport} tab={tab} data={data as any} />;
            }
            return (
              <>
                <NflEzpzPicks data={data} />
          '''
          text = replace_once(text, old_router, new_router, "FootballBoard router")
          path.write_text(text)

          # NFL Model Play / player-prop form is a pre-day snapshot. Today's
          # completed results cannot turn a current-day play HOT after kickoff.
          path = Path("lib/footballPublicData.ts")
          text = path.read_text()
          text = replace_once(
              text,
              'function formFromRows(rows: SheetRow[]): FormResult {',
              'function formFromRows(rows: SheetRow[], beforeDate = ""): FormResult {',
              "NFL form signature",
          )
          text = replace_once(
              text,
              '    .filter(({ row }) => Boolean(resultCode(row.Result || row.Status)))',
              '''    .filter(({ row }) => {
                if (!resultCode(row.Result || row.Status)) return false;
                const rowDate = isoDate(row.Date || row["Game Date"] || "");
                return !beforeDate || Boolean(rowDate && rowDate < beforeDate);
              })''',
              "NFL pre-day form filter",
          )
          text = replace_once(
              text,
              'function annotateGameModelPlays(plays: any[], tracker: SheetRow[], splits: any[]) {',
              'function annotateGameModelPlays(plays: any[], tracker: SheetRow[], splits: any[], beforeDate: string) {',
              "NFL game annotation signature",
          )
          text = replace_once(
              text,
              '    const form = formFromRows(tracker.filter((row) => trackerMatchesGameModel(row, formType)));',
              '    const form = formFromRows(tracker.filter((row) => trackerMatchesGameModel(row, formType)), beforeDate);',
              "NFL game form cutoff",
          )
          text = replace_once(
              text,
              '    const form = formFromRows(propTracker.filter((trackerRow) => propTrackerMatchesType(trackerRow, formType)));',
              '    const form = formFromRows(propTracker.filter((trackerRow) => propTrackerMatchesType(trackerRow, formType)), today);',
              "NFL prop form cutoff",
          )
          text = replace_once(
              text,
              '  const gameModelPlays = annotateGameModelPlays(coreGameModelPlays, tracker, splits);',
              '  const gameModelPlays = annotateGameModelPlays(coreGameModelPlays, tracker, splits, today);',
              "NFL annotation call",
          )
          path.write_text(text)

          # Core football trend histories and CFB HOT gates use only dates
          # strictly before the game day being evaluated.
          path = Path("lib/footballPublicDataCore.ts")
          text = path.read_text()
          old_windows = '''function withinDays(rows: SignalHistoryRow[], referenceDate: string, days: number) {
            const ref = Date.parse(`${referenceDate}T12:00:00Z`);
            return rows.filter((row) => { const at = Date.parse(`${row.date}T12:00:00Z`); const diff = Math.round((ref - at) / 86400000); return Number.isFinite(diff) && diff >= 0 && diff < days; });
          }
          function windows(rows: SignalHistoryRow[], referenceDate: string): TrendWindowRecords {
            return { allTime: trendRecord(rows), last30: trendRecord(withinDays(rows, referenceDate, 30)), last7: trendRecord(withinDays(rows, referenceDate, 7)) };
          }'''
          new_windows = '''function withinDays(rows: SignalHistoryRow[], referenceDate: string, days: number) {
            const ref = Date.parse(`${referenceDate}T12:00:00Z`);
            return rows.filter((row) => { const at = Date.parse(`${row.date}T12:00:00Z`); const diff = Math.round((ref - at) / 86400000); return Number.isFinite(diff) && diff > 0 && diff <= days; });
          }
          function windows(rows: SignalHistoryRow[], referenceDate: string): TrendWindowRecords {
            const prior = rows.filter((row) => Boolean(row.date) && row.date < referenceDate);
            return { allTime: trendRecord(prior), last30: trendRecord(withinDays(prior, referenceDate, 30)), last7: trendRecord(withinDays(prior, referenceDate, 7)) };
          }'''
          text = replace_once(text, old_windows, new_windows, "core trend windows")
          text = replace_once(
              text,
              'function footballLastSevenForType(rows: SheetRow[], recordType: FootballBestRecordType, sport: FootballSport) {',
              'function footballLastSevenForType(rows: SheetRow[], recordType: FootballBestRecordType, sport: FootballSport, beforeDate: string) {',
              "CFB form signature",
          )
          text = replace_once(
              text,
              '    .filter(({ row }) => resultCode(row.Result || row.Status) && footballTrackerRecordType(row, sport) === recordType)',
              '''    .filter(({ row }) => {
                const rowDate = isoDate(row.Date || row["Game Date"] || "");
                return Boolean(resultCode(row.Result || row.Status))
                  && footballTrackerRecordType(row, sport) === recordType
                  && Boolean(rowDate && rowDate < beforeDate);
              })''',
              "CFB pre-day form filter",
          )
          old_signature = '''function buildFootballEzpzPicks(
            best: any[],
            trends: TrendPlay[],
            tracker: SheetRow[],
            splits: DraftKingsSplit[],
            sport: FootballSport,
          ) {'''
          new_signature = '''function buildFootballEzpzPicks(
            best: any[],
            trends: TrendPlay[],
            tracker: SheetRow[],
            splits: DraftKingsSplit[],
            sport: FootballSport,
            referenceDate: string,
          ) {'''
          text = replace_once(text, old_signature, new_signature, "EZPZ builder signature")
          text = replace_once(
              text,
              '    const lastSeven = formCache.get(recordType) || footballLastSevenForType(tracker, recordType, sport);',
              '    const lastSeven = formCache.get(recordType) || footballLastSevenForType(tracker, recordType, sport, referenceDate);',
              "EZPZ pre-day HOT gate",
          )
          text = replace_once(
              text,
              '  const aiPicks=buildFootballEzpzPicks(modelBest,todayTrendPlays,tracker,todayEnriched,sport);',
              '  const aiPicks=buildFootballEzpzPicks(modelBest,todayTrendPlays,tracker,todayEnriched,sport,today);',
              "EZPZ builder call",
          )
          path.write_text(text)

          # The weekly market is the public Trend Plays source, so it must use
          # the same pre-day historical cutoff as the core builder.
          path = Path("lib/footballWeeklyMarket.ts")
          text = path.read_text()
          old_weekly = '''function withinDays(rows: HistoryRow[], referenceDate: string, days: number) {
            const ref = Date.parse(`${referenceDate}T12:00:00Z`);
            return rows.filter((row) => {
              const at = Date.parse(`${row.date}T12:00:00Z`);
              const diff = Math.round((ref - at) / 86_400_000);
              return Number.isFinite(diff) && diff >= 0 && diff < days;
            });
          }

          function windows(rows: HistoryRow[], referenceDate: string): WindowRecords {
            return { allTime: record(rows), last30: record(withinDays(rows, referenceDate, 30)), last7: record(withinDays(rows, referenceDate, 7)) };
          }'''
          new_weekly = '''function withinDays(rows: HistoryRow[], referenceDate: string, days: number) {
            const ref = Date.parse(`${referenceDate}T12:00:00Z`);
            return rows.filter((row) => {
              const at = Date.parse(`${row.date}T12:00:00Z`);
              const diff = Math.round((ref - at) / 86_400_000);
              return Number.isFinite(diff) && diff > 0 && diff <= days;
            });
          }

          function windows(rows: HistoryRow[], referenceDate: string): WindowRecords {
            const prior = rows.filter((row) => Boolean(row.date) && row.date < referenceDate);
            return { allTime: record(prior), last30: record(withinDays(prior, referenceDate, 30)), last7: record(withinDays(prior, referenceDate, 7)) };
          }'''
          text = replace_once(text, old_weekly, new_weekly, "weekly trend windows")
          path.write_text(text)
          PY

      - name: Type check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit source upgrade
        shell: bash
        run: |
          git config user.name "EZPZ Source Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/football-public-site-upgrade.yml
          git add app/FootballBoard.tsx app/FootballGameTabs.tsx lib/footballPublicData.ts lib/footballPublicDataCore.ts lib/footballWeeklyMarket.ts
          git commit -m "Upgrade football game tabs and freeze daily qualification history"
          git push origin HEAD:main

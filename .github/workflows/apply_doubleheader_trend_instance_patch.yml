name: Apply Doubleheader Trend Instance Patch

on:
  push:
    branches:
      - agent/fix-doubleheader-trend-instance
    paths:
      - .github/workflows/apply_doubleheader_trend_instance_patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-doubleheader-trend-instance

      - name: Apply trend instance patch
        run: python scripts/apply_doubleheader_trend_instance_patch.py

      - name: Verify doubleheader source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/api/public-data/route.ts').read_text()
          checks = {
              'time-aware live play': 'recordGameTime: parseEventTimeKey(split.eventTime || "")',
              'instance comparison': 'trendGameInstanceKey(candidate.play) === trendGameInstanceKey(play)',
              'strict split/slate resolver': 'function trendSlateRowForSplit(split: DraftKingsSplit, slateRows: SheetRow[])',
              'legacy doubleheader rejection': 'return matchupRows.length === 1 ? matchupRows[0] : null;',
              'time-aware overlay': 'refreshedFrozenPlays.map((play) => trendGameInstanceKey(play))',
          }
          missing = [name for name, needle in checks.items() if needle not in text]
          if missing:
              raise SystemExit('Missing doubleheader safeguards: ' + ', '.join(missing))
          print('Doubleheader trend instance source checks passed.')
          PY

      - name: Type-check public site
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit validated production route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts
          git commit -m "Separate doubleheader trend play instances"
          git push origin HEAD:agent/fix-doubleheader-trend-instance

name: Fix MLB post-start recovery and pitcher odds

on:
  push:
    paths:
      - ".github/workflows/fix-mlb-poststart-and-pitcher-odds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply MLB recovery and pitcher-odds fixes
        shell: bash
        env:
          OLD_V2_B64: ""
          NEW_V2_B64: ""
          OLD_ODDS_B64: "ICAgICAgY29uc3Qgb2RkcyA9IG9kZHNGcm9tTGluZUNlbGwoCiAgICAgICAgbWFya2V0Lm9kZHMgfHwKICAgICAgICAgIHRyYWNrZXJPZGRzIHx8CiAgICAgICAgICAocGFyc2VkLmxpbmUgPyBgTGluZSAke3BhcnNlZC5saW5lfWAgOiAiIiksCiAgICAgICk7Cg=="
          NEW_ODDS_B64: ""
          OLD_STORED_B64: "ICBsZXQgc3RvcmVkRmluYWxDYW5kaWRhdGVJZHMgPSBuZXcgU2V0KAogICAgc3RvcmVkVG9kYXkKICAgICAgLmZpbHRlcigocGljaykgPT4gcGljay5zbmFwc2hvdFN0YXR1cyA9PT0gIkZJTkFMX1BSRUdBTUUiKQogICAgICAubWFwKChwaWNrKSA9PiBwaWNrLmNhbmRpZGF0ZUlkKSwKICApOwo="
          NEW_STORED_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def patch(path_name, old_key, new_key, label):
              path = Path(path_name)
              text = path.read_text()
              old = base64.b64decode(os.environ[old_key]).decode()
              new = base64.b64decode(os.environ[new_key]).decode()
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"{label} target occurred {text.count(old)} times; refusing ambiguous patch")
                  text = text.replace(old, new, 1)
                  path.write_text(text)
                  print(f"Installed {label}")
              elif new in text:
                  print(f"{label} already installed")
              else:
                  raise SystemExit(f"Could not find {label} target")

          patch(
              "app/api/public-data-v2/route.ts",
              "OLD_V2_B64",
              "NEW_V2_B64",
              "post-start V2 finalization",
          )
          patch(
              "app/api/public-data/route.ts",
              "OLD_ODDS_B64",
              "NEW_ODDS_B64",
              "pitcher summary odds fallback",
          )
          patch(
              "app/api/public-data/route.ts",
              "OLD_STORED_B64",
              "NEW_STORED_B64",
              "odds-missing HOT pitcher recovery",
          )
          PY

      - name: Type-check
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mlb-poststart-and-pitcher-odds.yml
          git add app/api/public-data-v2/route.ts app/api/public-data/route.ts
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Fix MLB recovery and pitcher prop odds parsing"
          git push

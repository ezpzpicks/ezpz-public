name: Patch Doubleheader Trend Tile Grouping

on:
  push:
    branches:
      - agent/separate-doubleheader-trend-tiles

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/separate-doubleheader-trend-tiles

      - name: Patch TrendPlay identity and grouping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()
          old_type = 'type TrendPlay = {\n  date?: string;\n  gameTime?: string;'
          new_type = 'type TrendPlay = {\n  date?: string;\n  gameTime?: string;\n  recordDate?: string;\n  recordGameKey?: string;\n  recordGameTime?: string;'
          if old_type not in text:
              raise SystemExit('TrendPlay type anchor not found')
          text = text.replace(old_type, new_type, 1)
          old_time = '    const gameTime = String(play.gameTime || "").trim();\n    const timeKey = gameTime\n      ? String(scheduleInfoFromRaw(gameTime, date).minutes)\n      : "";\n    const matchupKey = trendGameMatchKey(play) || publicMatchKey(play.game);\n    const key = [date, matchupKey, timeKey].filter(Boolean).join("|");'
          new_time = '    const gameTime = String(\n      play.gameTime || play.recordGameTime || "",\n    ).trim();\n    const timeKey = gameTime\n      ? String(scheduleInfoFromRaw(gameTime, date).minutes)\n      : "";\n    const recordGameKey = String(play.recordGameKey || "")\n      .trim()\n      .replace(/\\.0$/, "");\n    const gameInstanceKey = timeKey || recordGameKey;\n    const matchupKey = trendGameMatchKey(play) || publicMatchKey(play.game);\n    const key = [date, matchupKey, gameInstanceKey].filter(Boolean).join("|");'
          if old_time not in text:
              raise SystemExit('Trend grouping time block not found')
          text = text.replace(old_time, new_time, 1)
          old_date = '  return normalizedDateKey(play.date);'
          new_date = '  return normalizedDateKey(play.recordDate || play.date);'
          if old_date in text:
              text = text.replace(old_date, new_date, 1)
          path.write_text(text)
          PY

      - name: Verify grouping invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/page.tsx').read_text()
          assert 'recordGameKey?: string;' in text
          assert 'recordGameTime?: string;' in text
          assert 'play.gameTime || play.recordGameTime || ""' in text
          assert 'const gameInstanceKey = timeKey || recordGameKey;' in text
          assert 'const key = [date, matchupKey, gameInstanceKey]' in text
          print('Doubleheader trend tile grouping invariants passed.')
          PY

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit validated page fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo 'No page changes to commit.'
            exit 0
          fi
          git commit -m 'Separate doubleheader trend play tiles'
          git push origin HEAD:agent/separate-doubleheader-trend-tiles

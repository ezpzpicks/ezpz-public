name: Apply EZPZ Picks fix

on:
  push:
    paths:
      - ".github/workflows/apply-ezpz-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_ezpz.py
          python3 /tmp/apply_ezpz.py

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts lib/footballPublicData.ts app/FootballBoard.tsx
          git rm .github/workflows/apply-ezpz-fix.yml
          git commit -m "Enable policy-correct football EZPZ Picks"
          git pull --rebase origin main
          git push origin HEAD:main

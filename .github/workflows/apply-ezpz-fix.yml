name: Apply EZPZ Picks fix

on:
  push:
    paths:
      - ".github/workflows/apply-ezpz-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch EZPZ policy and football selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # MLB: Trend-path EZPZ selections must be Strong/Elite, not merely non-Pass.
          route = Path('app/api/public-data/route.ts')
          text = route.read_text()
          old = '      candidate.trendPlay?.tier !== "Pass" &&\n'
          new = '      (candidate.trendPlay?.tier === "Strong" ||\n        candidate.trendPlay?.tier === "Elite") &&\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one MLB tier gate, found {text.count(old)}')
          route.write_text(text.replace(old, new, 1))

          # Football: mirror the MLB head-to-head trend contract (+10% net ROI and all-green).
          football = Path('lib/footballPublicData.ts')
          text = football.read_text()
          start = text.index('function headToHead(plays: TrendPlay[]) {')
          end = text.index('\n\nfunction findSlateForSplit', start)
          new_head_to_head = r'''function footballTrendMetrics(play: TrendPlay) {
  const signals = (play.signals || [])
    .map((signal) => {
      const metrics = windowMetrics(signal.records);
      if (!metrics.hasData) return metrics;
      return {
        ...metrics,
        score: signal.exactSample > 0
          ? metrics.score
          : Math.min(metrics.score, TREND_BROAD_FALLBACK_SCORE_CAP),
      };
    })
    .filter((metrics) => metrics.hasData);
  if (!signals.length) return { score: play.baseScore ?? play.score ?? 0, roiPct: 0, winPct: 0, hasData: false };
  return {
    score: signals.reduce((sum, signal) => sum + signal.score, 0) / signals.length,
    roiPct: signals.reduce((sum, signal) => sum + signal.roiPct, 0) / signals.length,
    winPct: signals.reduce((sum, signal) => sum + signal.winPct, 0) / signals.length,
    hasData: true,
  };
}

function footballTrendRecordTone(record: TrendRecord): Tone {
  if (record.wins > record.losses) return "positive";
  if (record.losses > record.wins) return "negative";
  return "neutral";
}

function headToHead(plays: TrendPlay[]) {
  const baseRows = plays.map((play) => ({ play, metrics: footballTrendMetrics(play) }));
  return baseRows.map(({ play, metrics }) => {
    const opponents = baseRows
      .filter((candidate) =>
        candidate.play.gameKey === play.gameKey &&
        candidate.play.market === play.market &&
        textKey(candidate.play.selection) !== textKey(play.selection))
      .sort((a, b) =>
        b.metrics.score - a.metrics.score ||
        b.metrics.roiPct - a.metrics.roiPct ||
        b.metrics.winPct - a.metrics.winPct);
    const opponent = opponents[0];
    if (!opponent) return { ...play, baseScore: metrics.score, opponentScore: null, comparisonGap: 0, comparisonWinner: false, score: 0, tier: "Pass" as const };

    const rawGap = metrics.score - opponent.metrics.score;
    const comparisonGap = Math.abs(rawGap);
    const comparisonWinner = rawGap > 0.01;
    const candidateRoiPct = metrics.roiPct;
    const opponentRoiPct = opponent.metrics.roiPct;
    const netRoiAdvantage = candidateRoiPct - opponentRoiPct;
    const opponentLast7Green = opponent.play.signals.some(
      (signal) => footballTrendRecordTone(signal.records.last7) === "positive",
    );
    const allSignalsGreen = play.signals.length > 0 && play.signals.every((signal) => signal.tone === "positive");
    const eligible = Boolean(
      comparisonWinner &&
      metrics.hasData &&
      opponent.metrics.hasData &&
      candidateRoiPct > 0 &&
      netRoiAdvantage >= 10 &&
      !opponentLast7Green &&
      allSignalsGreen
    );
    const comparisonBonus = Math.min(5, comparisonGap / 5);
    const winnerScore = Math.min(100, metrics.score + comparisonBonus);
    const loserScore = Math.min(59, Math.max(0, metrics.score - comparisonBonus));
    const score = eligible ? winnerScore : loserScore;
    return {
      ...play,
      baseScore: metrics.score,
      opponentScore: opponent.metrics.score,
      comparisonGap,
      comparisonWinner,
      score,
      tier: !eligible || score < 60 ? "Pass" : score >= 85 ? "Elite" : score >= 69 ? "Strong" : "Good",
    };
  });
}'''
          text = text[:start] + new_head_to_head + text[end:]

          marker = '\n\nasync function buildFootballPublicDataFresh'
          if marker not in text:
              raise SystemExit('Football builder insertion marker missing')
          helpers = r'''

type FootballEzpzPick = {
  source: "Best Play" | "Trend Play" | "Best + Trend";
  game: string;
  market: "Spread" | "Total";
  selection: string;
  odds: string;
  score: number;
  tier: string;
  qualification: string;
  record?: string;
};

function americanOddsText(value: unknown) {
  const raw = String(value || "").trim();
  const match = raw.match(/(?:^|\s)([+-]\d{3,})(?:\s|$)/);
  if (!match) return "";
  const odds = Number(match[1]);
  return Number.isFinite(odds) && Math.abs(odds) >= 100 ? match[1] : "";
}

function footballLastSevenForMarket(rows: SheetRow[], market: "Spread" | "Total") {
  const key = textKey(market);
  const completed = rows
    .map((row, index) => ({
      row,
      index,
      stamp: Date.parse(`${isoDate(row.Date)}T12:00:00Z`) || 0,
    }))
    .filter(({ row }) => resultCode(row.Result || row.Status) && textKey(row["Bet Type"] || row.Market).includes(key))
    .sort((a, b) => b.stamp - a.stamp || b.index - a.index)
    .slice(0, 7)
    .map(({ row }) => row);
  return recordTotals(completed);
}

function footballBestForm(record: ReturnType<typeof recordTotals>) {
  if (record.totalBets < 7) return "SAMPLE" as const;
  if (record.wins >= 5) return "HOT" as const;
  if (record.losses >= 5) return "COLD" as const;
  return "NEUTRAL" as const;
}

function footballBestPlaySplit(play: any, splits: DraftKingsSplit[], sport: FootballSport) {
  const sameGame = (split: DraftKingsSplit) =>
    textKey(split.game) === textKey(play.game) ||
    (sameTeam(play.awayTeam, split.awayTeam, sport) && sameTeam(play.homeTeam, split.homeTeam, sport));
  const market = textKey(play.role || play.playType).includes("total") ? "Total" : "Spread";
  if (market === "Total") {
    const side = textKey(play.play).startsWith("under") ? "Under" : "Over";
    return splits.find((split) => split.market === "Total" && split.side === side && sameGame(split));
  }
  const selection = String(play.play || "").replace(/\s+[+-]?\d+(?:\.\d+)?\s*$/, "").trim();
  return splits.find((split) => split.market === "Spread" && sameGame(split) && sameTeam(split.selectionTeam, selection, sport));
}

function buildFootballEzpzPicks(
  best: any[],
  trends: TrendPlay[],
  tracker: SheetRow[],
  splits: DraftKingsSplit[],
  sport: FootballSport,
) {
  const picks: FootballEzpzPick[] = [];
  const formCache = new Map<"Spread" | "Total", ReturnType<typeof recordTotals>>();
  for (const play of best) {
    const market: "Spread" | "Total" = textKey(play.role || play.playType).includes("total") ? "Total" : "Spread";
    const lastSeven = formCache.get(market) || footballLastSevenForMarket(tracker, market);
    formCache.set(market, lastSeven);
    if (footballBestForm(lastSeven) !== "HOT") continue;
    const split = footballBestPlaySplit(play, splits, sport);
    const odds = americanOddsText(split?.odds || play.oddsLine);
    if (!odds || Number(odds) < -150) continue;
    const rawScore = Number(play.score);
    const score = Number.isFinite(rawScore) ? (rawScore <= 1 ? rawScore * 100 : rawScore) : 0;
    picks.push({
      source: "Best Play",
      game: play.game,
      market,
      selection: play.play,
      odds,
      score,
      tier: play.playType || "Best Play",
      qualification: `HOT Last 7 Best Play (${lastSeven.record})`,
      record: lastSeven.record,
    });
  }

  for (const play of headToHead(trends)) {
    if (play.tier !== "Strong" && play.tier !== "Elite") continue;
    if (!play.signals.length || !play.signals.every((signal) => signal.tone === "positive")) continue;
    const odds = americanOddsText(play.odds);
    if (!odds || Number(odds) < -150) continue;
    picks.push({
      source: "Trend Play",
      game: play.game,
      market: play.market,
      selection: play.market === "Total" ? `${play.side} ${play.line ?? ""}`.trim() : `${play.selection} ${play.line == null ? "" : `${play.line > 0 ? "+" : ""}${play.line}`}`.trim(),
      odds,
      score: Math.round(play.score * 10) / 10,
      tier: `${play.tier} Trend Play`,
      qualification: "All-green Trend Play • 10%+ net ROI advantage",
    });
  }

  const deduped = new Map<string, FootballEzpzPick>();
  for (const pick of picks) {
    const key = `${textKey(pick.game)}|${pick.market}|${textKey(pick.selection)}`;
    const existing = deduped.get(key);
    if (!existing) {
      deduped.set(key, pick);
      continue;
    }
    deduped.set(key, {
      ...existing,
      source: "Best + Trend",
      score: Math.max(existing.score, pick.score),
      tier: `${existing.tier} + ${pick.tier}`,
      qualification: `${existing.qualification} • ${pick.qualification}`,
    });
  }
  return [...deduped.values()].sort((a, b) => b.score - a.score || a.game.localeCompare(b.game));
}
'''
          text = text.replace(marker, helpers + marker, 1)

          old_best = '  const best=bestPlays(slate,sport);const overall=recordTotals(tracker);'
          new_best = '  const best=bestPlays(slate,sport);const aiPicks=buildFootballEzpzPicks(best,displayTrendPlays,tracker,enriched,sport);const overall=recordTotals(tracker);'
          if text.count(old_best) != 1:
              raise SystemExit('Football best/selector marker missing')
          text = text.replace(old_best, new_best, 1)

          old_status = 'trendPlays:displayTrendPlays,aiPicks:[],aiPickRecordRows:[],aiSelectorStatus:{mode:"LIVE_PREVIEW",externalResearchConfigured:false,message:`${sport} AI selector is not enabled yet; model and trend records are live.`,updatedAt:nowET(),candidateCount:0,selectedCount:0}'
          new_status = 'trendPlays:displayTrendPlays,aiPicks,aiPickRecordRows:[],aiSelectorStatus:{mode:"LIVE",externalResearchConfigured:false,message:aiPicks.length?`${sport} EZPZ Picks are live: HOT Best Plays plus all-green Strong/Elite Trend Plays with 10%+ net ROI advantage; max price -150.`:`No ${sport} EZPZ Picks currently qualify under the HOT / all-green 10%+ ROI / Strong-Elite / -150 rules.`,updatedAt:nowET(),candidateCount:best.length+displayTrendPlays.length,selectedCount:aiPicks.length}'
          if text.count(old_status) != 1:
              raise SystemExit('Football AI selector status marker missing')
          text = text.replace(old_status, new_status, 1)
          football.write_text(text)

          # Football UI: render the live EZPZ cards instead of the disabled placeholder.
          board = Path('app/FootballBoard.tsx')
          text = board.read_text()
          type_marker = '\ntype DraftKingsSplit = {'
          if type_marker not in text:
              raise SystemExit('FootballBoard type marker missing')
          ezpz_type = r'''

type EzpzPick = {
  source: "Best Play" | "Trend Play" | "Best + Trend";
  game: string;
  market: "Spread" | "Total";
  selection: string;
  odds: string;
  score: number;
  tier: string;
  qualification: string;
  record?: string;
};
'''
          text = text.replace(type_marker, ezpz_type + type_marker, 1)
          old_data = '  trendPlays?: TrendPlay[]; recordSummary?: Summary[];\n  last7RecordSummary?: Summary[]; aiSelectorStatus?: { message?: string };'
          new_data = '  trendPlays?: TrendPlay[]; aiPicks?: EzpzPick[]; recordSummary?: Summary[];\n  last7RecordSummary?: Summary[]; aiSelectorStatus?: { message?: string };'
          if text.count(old_data) != 1:
              raise SystemExit('FootballData aiPicks marker missing')
          text = text.replace(old_data, new_data, 1)

          card_marker = '\nfunction SlateCard('
          if card_marker not in text:
              raise SystemExit('EZPZ card insertion marker missing')
          ezpz_card = r'''

function EzpzPickCard({ pick, index }: { pick: EzpzPick; index: number }) {
  return (
    <article className={`card green fade-in best footballBestCard ${index < 3 ? "top" : ""}`}>
      <div className="cardTop">
        <div className="rankBadge">#{index + 1}</div>
        <div className="scorePill" aria-label={`EZPZ qualification score ${pick.score.toFixed(1)}`}>
          <span className="scorePillLabel">EZPZ</span>
          <strong>{pick.score.toFixed(1)}</strong>
          <span className="scorePillSub">SCORE</span>
        </div>
      </div>
      <div className="cardSub footballMatchup">{pick.game}</div>
      <div className="projectionBlock footballProjectionBlock">
        <div className="projection footballProjection">{pick.selection}</div>
        <div className="grade">{pick.tier}</div>
      </div>
      <div className="divider" />
      <div className="bubbleGrid footballBestMetrics">
        <MiniBubble label="Odds" value={pick.odds} green />
        <MiniBubble label="Market" value={pick.market} green />
        <MiniBubble label="Source" value={pick.source} green />
        <MiniBubble label="Last 7" value={pick.record || "Trend"} green />
      </div>
      <div className="modelMeta footballModelMeta">
        <span>{pick.qualification}</span>
        <span>Max favorite price -150</span>
      </div>
    </article>
  );
}
'''
          text = text.replace(card_marker, ezpz_card + card_marker, 1)

          old_tab = '  } else if (tab === "EZPZ Picks") {\n    content = <div className="empty footballEmpty">{data.aiSelectorStatus?.message || `${sport} EZPZ Picks are not enabled yet. Model Best Plays and sport-specific Trend Plays are live.`}</div>;'
          new_tab = '''  } else if (tab === "EZPZ Picks") {
    content = <>
      <div className="sectionHead"><div><h2>{sport} EZPZ Picks</h2><p>{data.aiSelectorStatus?.message || "HOT Best Plays and qualifying Strong/Elite Trend Plays only."}</p></div></div>
      {data.aiPicks?.length ? <div className="fbGrid">{data.aiPicks.map((pick, index) => <EzpzPickCard key={`${pick.game}-${pick.market}-${pick.selection}-${index}`} pick={pick} index={index} />)}</div> : <div className="empty footballEmpty">No {sport} EZPZ Picks qualify right now.</div>}
    </>;'''
          if text.count(old_tab) != 1:
              raise SystemExit('Football EZPZ tab marker missing')
          text = text.replace(old_tab, new_tab, 1)
          board.write_text(text)
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts lib/footballPublicData.ts app/FootballBoard.tsx
          git rm .github/workflows/apply-ezpz-fix.yml
          git commit -m "Enable policy-correct football EZPZ Picks"
          git push origin HEAD:main

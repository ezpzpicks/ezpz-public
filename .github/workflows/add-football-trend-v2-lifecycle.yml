name: Add football Trend V2 lifecycle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-football-trend-v2-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add automatic football Trend V2 evaluation and promotion
        shell: bash
        run: |
          cat > lib/footballTrendV2Lifecycle.ts <<'EOF'
          import {
            readSportWorksheet,
            upsertSportRows,
            type FootballSport,
            type SheetRow,
          } from "./sportSheets";
          import { parseAmericanOdds, parseGameStart } from "./mlbTrendV2";

          export type FootballTrendV2Status = "COLLECTING" | "SHADOW" | "ACTIVE";

          type FeatureName =
            | "implied"
            | "legacy"
            | "gapPct"
            | "publicMovementPct"
            | "sharpMovementPct"
            | "lineMovementValue"
            | "market_spread"
            | "market_total"
            | "side_favorite"
            | "side_underdog"
            | "side_over"
            | "side_under"
            | "sig_BALANCED_PUBLIC_SHARP_SPLIT"
            | "sig_HEAVY_PUBLIC_SHARP_AGREEMENT"
            | "sig_EXTREME_PUBLIC_SHARP_AGREEMENT"
            | "sig_SHARP_SUPPORT"
            | "sig_STRONG_SHARP_SUPPORT"
            | "sig_SHARP_REJECTION"
            | "sig_STRONG_SHARP_REJECTION"
            | "sig_LINE_MOVEMENT_CONFIRMATION"
            | "sig_ADVERSE_LINE_MOVEMENT"
            | "sig_REVERSE_LINE_MOVEMENT_SUPPORT"
            | "sig_REVERSE_LINE_MOVEMENT_AGAINST"
            | "sig_STRONG_REVERSE_LINE_MOVEMENT_SUPPORT"
            | "sig_STRONG_REVERSE_LINE_MOVEMENT_AGAINST";

          const FEATURES: FeatureName[] = [
            "implied", "legacy", "gapPct", "publicMovementPct", "sharpMovementPct", "lineMovementValue",
            "market_spread", "market_total", "side_favorite", "side_underdog", "side_over", "side_under",
            "sig_BALANCED_PUBLIC_SHARP_SPLIT", "sig_HEAVY_PUBLIC_SHARP_AGREEMENT", "sig_EXTREME_PUBLIC_SHARP_AGREEMENT",
            "sig_SHARP_SUPPORT", "sig_STRONG_SHARP_SUPPORT", "sig_SHARP_REJECTION", "sig_STRONG_SHARP_REJECTION",
            "sig_LINE_MOVEMENT_CONFIRMATION", "sig_ADVERSE_LINE_MOVEMENT", "sig_REVERSE_LINE_MOVEMENT_SUPPORT",
            "sig_REVERSE_LINE_MOVEMENT_AGAINST", "sig_STRONG_REVERSE_LINE_MOVEMENT_SUPPORT",
            "sig_STRONG_REVERSE_LINE_MOVEMENT_AGAINST",
          ];

          const MODEL_TAB = "trend_v2_models";
          const MODEL_HEADERS = [
            "Sport", "Status", "Active Model Version", "Active Model AUC", "Candidate Model Version",
            "Candidate AUC", "Legacy AUC", "Evaluation Source", "Graded W/L", "Frozen W/L",
            "Unique Games", "Unique Dates", "Normal Gap", "Early Gap", "Decision Window Minutes",
            "Last Evaluated ET", "Promotion Reason", "Active Model JSON", "Candidate Model JSON",
          ];

          const MIN_GRADED = 200;
          const MIN_FROZEN = 100;
          const MIN_GAMES = 75;
          const MIN_DATES = 8;
          const MIN_CANDIDATE_AUC = 0.55;
          const MIN_AUC_LIFT = 0.02;
          const MIN_INCUMBENT_REPLACEMENT_LIFT = 0.01;
          const FOOTBALL_DECISION_WINDOW_MINUTES = 15;
          const MAX_FAVORITE_PRICE = -150;

          type ModelSpec = {
            features: FeatureName[];
            median: number[];
            mean: number[];
            scale: number[];
            coef: number[];
            intercept: number;
            normalGap: number;
            earlyGap: number;
            trainedRows: number;
            trainedDates: number;
          };

          type Example = {
            date: string;
            gameKey: string;
            market: "Spread" | "Total";
            y: 0 | 1;
            odds: number;
            legacy: number;
            x: Array<number | null>;
            frozen: boolean;
          };

          type ValidationEntry = { example: Example; probability: number };
          type ValidationResult = {
            candidateAuc: number;
            legacyAuc: number;
            entries: ValidationEntry[];
          };

          export type FootballTrendV2Lifecycle = {
            sport: FootballSport;
            status: FootballTrendV2Status;
            activeModelVersion: string;
            activeModelAuc: number | null;
            candidateModelVersion: string;
            candidateAuc: number | null;
            legacyAuc: number | null;
            evaluationSource: string;
            gradedRows: number;
            frozenRows: number;
            uniqueGames: number;
            uniqueDates: number;
            normalGap: number;
            earlyGap: number;
            decisionWindowMinutes: number;
            evaluatedAt: string;
            reason: string;
          };

          function finite(value: unknown): number | null {
            if (value === null || value === undefined || value === "") return null;
            const parsed = Number(String(value).replace(/%/g, "").replace(/−/g, "-").trim());
            return Number.isFinite(parsed) ? parsed : null;
          }

          function textKey(value: unknown) {
            return String(value || "")
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/−/g, "-")
              .replace(/[^a-z0-9]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function isoDate(value: unknown) {
            const raw = String(value || "").trim();
            const iso = raw.match(/(20\d{2})[-/](\d{1,2})[-/](\d{1,2})/);
            if (iso) return `${iso[1]}-${iso[2].padStart(2, "0")}-${iso[3].padStart(2, "0")}`;
            const us = raw.match(/(\d{1,2})\/(\d{1,2})\/(20\d{2})/);
            if (us) return `${us[3]}-${us[1].padStart(2, "0")}-${us[2].padStart(2, "0")}`;
            return raw;
          }

          function todayET(date = new Date()) {
            const parts = new Intl.DateTimeFormat("en-US", {
              timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit",
            }).formatToParts(date);
            const get = (type: string) => parts.find((part) => part.type === type)?.value || "";
            return `${get("year")}-${get("month")}-${get("day")}`;
          }

          function nowET(date = new Date()) {
            return `${todayET(date)} ${new Intl.DateTimeFormat("en-US", {
              timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
            }).format(date)} ET`;
          }

          function impliedFromOdds(value: unknown) {
            const odds = parseAmericanOdds(value);
            if (!odds) return null;
            return odds > 0 ? (100 / (odds + 100)) * 100 : (Math.abs(odds) / (Math.abs(odds) + 100)) * 100;
          }

          function parseDetails(row: SheetRow): Record<string, any> {
            const raw = String(row["Trend Score Details"] || "").trim();
            if (!raw) return {};
            try {
              const parsed = JSON.parse(raw);
              return parsed && typeof parsed === "object" ? parsed : {};
            } catch {
              return {};
            }
          }

          function canonicalSignal(value: unknown) {
            const key = textKey(value);
            if (!key) return "";
            if (key.includes("strong reverse") && key.includes("against")) return "STRONG_REVERSE_LINE_MOVEMENT_AGAINST";
            if (key.includes("strong reverse") && key.includes("support")) return "STRONG_REVERSE_LINE_MOVEMENT_SUPPORT";
            if (key.includes("reverse") && key.includes("against")) return "REVERSE_LINE_MOVEMENT_AGAINST";
            if (key.includes("reverse") && key.includes("support")) return "REVERSE_LINE_MOVEMENT_SUPPORT";
            if (key.includes("adverse line movement")) return "ADVERSE_LINE_MOVEMENT";
            if (key.includes("line movement confirmation")) return "LINE_MOVEMENT_CONFIRMATION";
            if (key.includes("extreme") && key.includes("agreement")) return "EXTREME_PUBLIC_SHARP_AGREEMENT";
            if (key.includes("heavy") && key.includes("agreement")) return "HEAVY_PUBLIC_SHARP_AGREEMENT";
            if (key.includes("strong handle above") || key.includes("strong sharp support")) return "STRONG_SHARP_SUPPORT";
            if (key.includes("strong handle below") || key.includes("strong sharp rejection")) return "STRONG_SHARP_REJECTION";
            if (key.includes("handle above") || key.includes("sharp support")) return "SHARP_SUPPORT";
            if (key.includes("handle below") || key.includes("sharp rejection")) return "SHARP_REJECTION";
            if (key.includes("balanced")) return "BALANCED_PUBLIC_SHARP_SPLIT";
            return String(value || "").trim().toUpperCase().replace(/[^A-Z0-9]+/g, "_");
          }

          function signalSet(source: Record<string, any>, row?: SheetRow) {
            const set = new Set<string>();
            for (const signal of Array.isArray(source.signals) ? source.signals : []) {
              const key = String(signal?.signalKey || canonicalSignal(signal?.signal) || "").trim();
              if (key) set.add(key);
            }
            const warning = canonicalSignal(row?.["Public Warning"] || source.warning);
            const movement = canonicalSignal(row?.["Line Movement Signal"] || source.lineMovementSignal);
            if (warning) set.add(warning);
            if (movement) set.add(movement);
            return set;
          }

          function normalizedSideGroup(source: Record<string, any>, row?: SheetRow) {
            const direct = String(source.sideGroup || "").trim();
            if (direct) return direct;
            const market = String(source.market || row?.Market || "");
            if (market === "Total") {
              const side = textKey(source.side || row?.Side || source.selection || row?.Selection);
              return side.startsWith("under") ? "Under" : side.startsWith("over") ? "Over" : "";
            }
            const line = finite(source.line ?? row?.["Public Split Line"] ?? row?.Line);
            return line == null || Math.abs(line) < 1e-9 ? "" : line < 0 ? "Favorite" : "Underdog";
          }

          function featureVector(source: Record<string, any>, row?: SheetRow): Array<number | null> {
            const signals = signalSet(source, row);
            const market = String(source.market || row?.Market || "");
            const sideGroup = normalizedSideGroup(source, row);
            const value: Record<FeatureName, number | null> = {
              implied: finite(source.currentImpliedPct ?? row?.["Current Implied %"]) ?? impliedFromOdds(source.odds ?? row?.["Public Split Odds"] ?? row?.Odds),
              legacy: finite(source.legacyScore ?? source.score ?? row?.["Trend Score"]),
              gapPct: finite(source.gapPct ?? row?.["Public Gap %"]),
              publicMovementPct: finite(source.publicMovementPct ?? row?.["Public Change %"]),
              sharpMovementPct: finite(source.sharpMovementPct ?? row?.["Sharp Change %"]),
              lineMovementValue: finite(source.lineMovementValue ?? row?.["Line Movement Value"]),
              market_spread: market === "Spread" ? 1 : 0,
              market_total: market === "Total" ? 1 : 0,
              side_favorite: sideGroup === "Favorite" ? 1 : 0,
              side_underdog: sideGroup === "Underdog" ? 1 : 0,
              side_over: sideGroup === "Over" ? 1 : 0,
              side_under: sideGroup === "Under" ? 1 : 0,
              sig_BALANCED_PUBLIC_SHARP_SPLIT: signals.has("BALANCED_PUBLIC_SHARP_SPLIT") ? 1 : 0,
              sig_HEAVY_PUBLIC_SHARP_AGREEMENT: signals.has("HEAVY_PUBLIC_SHARP_AGREEMENT") ? 1 : 0,
              sig_EXTREME_PUBLIC_SHARP_AGREEMENT: signals.has("EXTREME_PUBLIC_SHARP_AGREEMENT") ? 1 : 0,
              sig_SHARP_SUPPORT: signals.has("SHARP_SUPPORT") ? 1 : 0,
              sig_STRONG_SHARP_SUPPORT: signals.has("STRONG_SHARP_SUPPORT") ? 1 : 0,
              sig_SHARP_REJECTION: signals.has("SHARP_REJECTION") ? 1 : 0,
              sig_STRONG_SHARP_REJECTION: signals.has("STRONG_SHARP_REJECTION") ? 1 : 0,
              sig_LINE_MOVEMENT_CONFIRMATION: signals.has("LINE_MOVEMENT_CONFIRMATION") ? 1 : 0,
              sig_ADVERSE_LINE_MOVEMENT: signals.has("ADVERSE_LINE_MOVEMENT") ? 1 : 0,
              sig_REVERSE_LINE_MOVEMENT_SUPPORT: signals.has("REVERSE_LINE_MOVEMENT_SUPPORT") ? 1 : 0,
              sig_REVERSE_LINE_MOVEMENT_AGAINST: signals.has("REVERSE_LINE_MOVEMENT_AGAINST") ? 1 : 0,
              sig_STRONG_REVERSE_LINE_MOVEMENT_SUPPORT: signals.has("STRONG_REVERSE_LINE_MOVEMENT_SUPPORT") ? 1 : 0,
              sig_STRONG_REVERSE_LINE_MOVEMENT_AGAINST: signals.has("STRONG_REVERSE_LINE_MOVEMENT_AGAINST") ? 1 : 0,
            };
            return FEATURES.map((feature) => value[feature]);
          }

          function resultCode(value: unknown): 0 | 1 | null {
            const key = String(value || "").trim().toUpperCase();
            if (["W", "WIN", "WON"].includes(key)) return 1;
            if (["L", "LOSS", "LOST"].includes(key)) return 0;
            return null;
          }

          function examplesFromRows(rows: SheetRow[]): Example[] {
            const output: Example[] = [];
            for (const row of rows) {
              const y = resultCode(row.Result || row.Status);
              if (y == null || String(row["Trend Play"] || "").trim().toUpperCase() !== "TRUE") continue;
              const detail = parseDetails(row);
              const date = isoDate(row.Date || detail.date);
              const market = String(detail.market || row.Market || "");
              if (!date || (market !== "Spread" && market !== "Total")) continue;
              const legacy = finite(row["Trend Score"] ?? detail.score) ?? 0;
              const snapshotStatus = String(detail.snapshotStatus || "").toUpperCase();
              const gradingVersion = String(detail.gradingVersion || "").toLowerCase();
              const matchConfidence = String(row["Public Split Match Confidence"] || "").toLowerCase();
              const frozen = snapshotStatus === "FINAL_PREGAME" &&
                (gradingVersion.includes("football-frozen") || matchConfidence.includes("final 15-minute"));
              const gameKey = String(row["Game Key"] || detail.gameKey || row.Game || "").trim();
              const odds = parseAmericanOdds(row["Public Split Odds"] || row.Odds || detail.odds) || -110;
              output.push({
                date,
                gameKey,
                market: market as "Spread" | "Total",
                y,
                odds,
                legacy,
                x: featureVector(detail, row),
                frozen,
              });
            }
            return output;
          }

          function median(values: number[]) {
            if (!values.length) return 0;
            const sorted = [...values].sort((a, b) => a - b);
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
          }

          function sigmoid(value: number) {
            const bounded = Math.max(-30, Math.min(30, value));
            return 1 / (1 + Math.exp(-bounded));
          }

          function fitModel(rows: Example[]): ModelSpec | null {
            if (rows.length < 20) return null;
            const width = FEATURES.length;
            const medians = Array.from({ length: width }, (_, column) =>
              median(rows.map((row) => row.x[column]).filter((value): value is number => value != null && Number.isFinite(value))),
            );
            const filled = rows.map((row) => row.x.map((value, column) => value == null || !Number.isFinite(value) ? medians[column] : value));
            const means = Array.from({ length: width }, (_, column) => filled.reduce((sum, row) => sum + row[column], 0) / filled.length);
            const scales = Array.from({ length: width }, (_, column) => {
              const variance = filled.reduce((sum, row) => sum + (row[column] - means[column]) ** 2, 0) / filled.length;
              const scale = Math.sqrt(variance);
              return Number.isFinite(scale) && scale > 1e-8 ? scale : 1;
            });
            const matrix = filled.map((row) => row.map((value, column) => (value - means[column]) / scales[column]));
            const positiveRate = Math.min(0.999, Math.max(0.001, rows.reduce((sum, row) => sum + row.y, 0) / rows.length));
            let intercept = Math.log(positiveRate / (1 - positiveRate));
            const coef = Array(width).fill(0) as number[];
            const lambda = 4;
            for (let iteration = 0; iteration < 450; iteration += 1) {
              const grad = Array(width).fill(0) as number[];
              let gradIntercept = 0;
              for (let rowIndex = 0; rowIndex < rows.length; rowIndex += 1) {
                let linear = intercept;
                for (let column = 0; column < width; column += 1) linear += coef[column] * matrix[rowIndex][column];
                const error = sigmoid(linear) - rows[rowIndex].y;
                gradIntercept += error;
                for (let column = 0; column < width; column += 1) grad[column] += error * matrix[rowIndex][column];
              }
              const rate = 0.12 / Math.sqrt(1 + iteration / 40);
              intercept -= rate * (gradIntercept / rows.length);
              for (let column = 0; column < width; column += 1) {
                const regularized = grad[column] / rows.length + (lambda / rows.length) * coef[column];
                coef[column] -= rate * regularized;
              }
            }
            return {
              features: FEATURES,
              median: medians,
              mean: means,
              scale: scales,
              coef,
              intercept,
              normalGap: 15,
              earlyGap: 20,
              trainedRows: rows.length,
              trainedDates: new Set(rows.map((row) => row.date)).size,
            };
          }

          function predictModel(spec: ModelSpec, vector: Array<number | null>) {
            let linear = spec.intercept;
            for (let column = 0; column < spec.features.length; column += 1) {
              const raw = vector[column];
              const value = raw == null || !Number.isFinite(raw) ? spec.median[column] : raw;
              linear += spec.coef[column] * ((value - spec.mean[column]) / (spec.scale[column] || 1));
            }
            return sigmoid(linear);
          }

          function auc(labels: number[], scores: number[]) {
            if (labels.length !== scores.length || !labels.length) return NaN;
            const positives = labels.reduce((sum, label) => sum + (label === 1 ? 1 : 0), 0);
            const negatives = labels.length - positives;
            if (!positives || !negatives) return NaN;
            const ranked = scores.map((score, index) => ({ score, index })).sort((a, b) => a.score - b.score);
            const ranks = Array(scores.length).fill(0) as number[];
            let cursor = 0;
            while (cursor < ranked.length) {
              let end = cursor + 1;
              while (end < ranked.length && Math.abs(ranked[end].score - ranked[cursor].score) < 1e-12) end += 1;
              const averageRank = (cursor + 1 + end) / 2;
              for (let i = cursor; i < end; i += 1) ranks[ranked[i].index] = averageRank;
              cursor = end;
            }
            let positiveRankSum = 0;
            labels.forEach((label, index) => { if (label === 1) positiveRankSum += ranks[index]; });
            return (positiveRankSum - (positives * (positives + 1)) / 2) / (positives * negatives);
          }

          function validation(rows: Example[]): ValidationResult | null {
            const dates = [...new Set(rows.map((row) => row.date))].sort();
            if (rows.length < 40 || dates.length < 4) return null;
            const rawBounds = [Math.floor(dates.length * 0.55), Math.floor(dates.length * 0.70), Math.floor(dates.length * 0.85), dates.length];
            const bounds = rawBounds.map((value, index) => Math.max(index + 2, Math.min(dates.length, value)));
            const entries: ValidationEntry[] = [];
            for (let fold = 0; fold < 3; fold += 1) {
              const trainEnd = bounds[fold];
              const testEnd = bounds[fold + 1];
              if (trainEnd >= dates.length || testEnd <= trainEnd) continue;
              const trainDates = new Set(dates.slice(0, trainEnd));
              const testDates = new Set(dates.slice(trainEnd, testEnd));
              const train = rows.filter((row) => trainDates.has(row.date));
              const test = rows.filter((row) => testDates.has(row.date));
              if (train.length < 30 || test.length < 5) continue;
              const spec = fitModel(train);
              if (!spec) continue;
              for (const example of test) entries.push({ example, probability: predictModel(spec, example.x) });
            }
            if (entries.length < 10) {
              const splitIndex = Math.max(1, Math.floor(dates.length * 0.7));
              const trainDates = new Set(dates.slice(0, splitIndex));
              const testDates = new Set(dates.slice(splitIndex));
              const train = rows.filter((row) => trainDates.has(row.date));
              const test = rows.filter((row) => testDates.has(row.date));
              const spec = fitModel(train);
              if (!spec || test.length < 5) return null;
              for (const example of test) entries.push({ example, probability: predictModel(spec, example.x) });
            }
            const labels = entries.map((entry) => entry.example.y);
            const candidateAuc = auc(labels, entries.map((entry) => entry.probability));
            const legacyAuc = auc(labels, entries.map((entry) => entry.example.legacy));
            if (!Number.isFinite(candidateAuc) || !Number.isFinite(legacyAuc)) return null;
            return { candidateAuc, legacyAuc, entries };
          }

          function profit(y: 0 | 1, odds: number) {
            if (!y) return -1;
            return odds > 0 ? odds / 100 : odds < 0 ? 100 / Math.abs(odds) : 1;
          }

          function tuneThresholds(result: ValidationResult) {
            const grouped = new Map<string, { entry: ValidationEntry; gap: number }>();
            for (const entry of result.entries) {
              const implied = entry.example.x[0] ?? impliedFromOdds(entry.example.odds) ?? 50;
              const gap = entry.probability * 100 - implied;
              const key = `${entry.example.date}|${entry.example.gameKey}|${entry.example.market}`;
              const current = grouped.get(key);
              if (!current || gap > current.gap) grouped.set(key, { entry, gap });
            }
            const selections = [...grouped.values()];
            const thresholds = [5, 7.5, 10, 12.5, 15, 17.5, 20, 22.5, 25, 27.5, 30];
            const stats = (threshold: number) => {
              const plays = selections.filter((selection) => selection.gap >= threshold);
              const units = plays.reduce((sum, selection) => sum + profit(selection.entry.example.y, selection.entry.example.odds), 0);
              return { count: plays.length, roi: plays.length ? (units / plays.length) * 100 : -Infinity };
            };
            let normal = 15;
            for (const threshold of thresholds) {
              const metric = stats(threshold);
              if (metric.count >= 20 && metric.roi >= 5) { normal = threshold; break; }
            }
            let early = Math.min(30, normal + 5);
            for (const threshold of thresholds.filter((value) => value >= normal + 2.5)) {
              const metric = stats(threshold);
              if (metric.count >= 15 && metric.roi >= 8) { early = threshold; break; }
            }
            return { normal, early: Math.max(normal + 2.5, early) };
          }

          function parseModel(raw: unknown): ModelSpec | null {
            try {
              const parsed = JSON.parse(String(raw || "")) as ModelSpec;
              if (!parsed || !Array.isArray(parsed.features) || parsed.features.join("|") !== FEATURES.join("|")) return null;
              if (!Array.isArray(parsed.coef) || parsed.coef.length !== FEATURES.length) return null;
              return parsed;
            } catch {
              return null;
            }
          }

          function numberOrNull(value: unknown) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
          }

          function lifecycleFromRow(sport: FootballSport, row?: SheetRow): FootballTrendV2Lifecycle {
            return {
              sport,
              status: (String(row?.Status || "COLLECTING") as FootballTrendV2Status),
              activeModelVersion: String(row?.["Active Model Version"] || ""),
              activeModelAuc: numberOrNull(row?.["Active Model AUC"]),
              candidateModelVersion: String(row?.["Candidate Model Version"] || ""),
              candidateAuc: numberOrNull(row?.["Candidate AUC"]),
              legacyAuc: numberOrNull(row?.["Legacy AUC"]),
              evaluationSource: String(row?.["Evaluation Source"] || ""),
              gradedRows: Number(row?.["Graded W/L"] || 0),
              frozenRows: Number(row?.["Frozen W/L"] || 0),
              uniqueGames: Number(row?.["Unique Games"] || 0),
              uniqueDates: Number(row?.["Unique Dates"] || 0),
              normalGap: Number(row?.["Normal Gap"] || 15),
              earlyGap: Number(row?.["Early Gap"] || 20),
              decisionWindowMinutes: Number(row?.["Decision Window Minutes"] || FOOTBALL_DECISION_WINDOW_MINUTES),
              evaluatedAt: String(row?.["Last Evaluated ET"] || ""),
              reason: String(row?.["Promotion Reason"] || "Waiting for first evaluation."),
            };
          }

          async function registryRow(sport: FootballSport) {
            const rows = await readSportWorksheet(sport, MODEL_TAB, MODEL_HEADERS);
            return rows.find((row) => String(row.Sport || "").toUpperCase() === sport);
          }

          export async function getFootballTrendV2Lifecycle(sport: FootballSport) {
            return lifecycleFromRow(sport, await registryRow(sport));
          }

          export async function evaluateFootballTrendV2(
            sport: FootballSport,
            options: { force?: boolean } = {},
          ): Promise<FootballTrendV2Lifecycle> {
            const existing = await registryRow(sport);
            if (!options.force && String(existing?.["Last Evaluated ET"] || "").startsWith(todayET())) {
              return lifecycleFromRow(sport, existing);
            }

            const history = await readSportWorksheet(sport, "all_game_trends");
            const graded = examplesFromRows(history);
            const frozen = graded.filter((row) => row.frozen);
            const uniqueGames = new Set(graded.map((row) => row.gameKey).filter(Boolean)).size;
            const uniqueDates = new Set(graded.map((row) => row.date).filter(Boolean)).size;
            const frozenGames = new Set(frozen.map((row) => row.gameKey).filter(Boolean)).size;
            const frozenDates = new Set(frozen.map((row) => row.date).filter(Boolean)).size;

            const shadowValidation = graded.length >= 60 ? validation(graded) : null;
            const strictReady = graded.length >= MIN_GRADED && frozen.length >= MIN_FROZEN &&
              frozenGames >= MIN_GAMES && frozenDates >= MIN_DATES;
            const strictValidation = strictReady ? validation(frozen) : null;
            const selectedValidation = strictValidation || shadowValidation;
            const evaluationSource = strictValidation ? "FINAL_PREGAME" : shadowValidation ? "ALL_GRADED_SHADOW" : "INSUFFICIENT_DATA";
            const candidateAuc = selectedValidation?.candidateAuc ?? null;
            const legacyAuc = selectedValidation?.legacyAuc ?? null;
            const candidateVersion = `${sport.toLowerCase()}-trend-v2-auto-${todayET()}`;
            const candidateTrainingRows = strictValidation ? frozen : graded;
            const candidateSpec = candidateTrainingRows.length >= 40 ? fitModel(candidateTrainingRows) : null;
            if (candidateSpec && selectedValidation) {
              const tuned = tuneThresholds(selectedValidation);
              candidateSpec.normalGap = tuned.normal;
              candidateSpec.earlyGap = tuned.early;
            }

            const existingActiveSpec = parseModel(existing?.["Active Model JSON"]);
            const existingActive = String(existing?.Status || "") === "ACTIVE" && existingActiveSpec;
            const existingActiveAuc = numberOrNull(existing?.["Active Model AUC"]);
            const passesPerformance = Boolean(strictValidation && candidateAuc != null && legacyAuc != null &&
              candidateAuc >= MIN_CANDIDATE_AUC && candidateAuc >= legacyAuc + MIN_AUC_LIFT);
            const beatsIncumbent = !existingActive || existingActiveAuc == null ||
              (candidateAuc != null && candidateAuc >= existingActiveAuc + MIN_INCUMBENT_REPLACEMENT_LIFT);
            const promote = Boolean(candidateSpec && passesPerformance && beatsIncumbent);

            let status: FootballTrendV2Status;
            let activeVersion = String(existing?.["Active Model Version"] || "");
            let activeAuc = existingActiveAuc;
            let activeModelJson = String(existing?.["Active Model JSON"] || "");
            let normalGap = Number(existing?.["Normal Gap"] || 15);
            let earlyGap = Number(existing?.["Early Gap"] || 20);
            let reason = "";

            if (promote && candidateSpec) {
              status = "ACTIVE";
              activeVersion = candidateVersion;
              activeAuc = candidateAuc;
              activeModelJson = JSON.stringify(candidateSpec);
              normalGap = candidateSpec.normalGap;
              earlyGap = candidateSpec.earlyGap;
              reason = existingActive
                ? `Promoted challenger: OOS AUC ${(candidateAuc || 0).toFixed(3)} beat incumbent by at least ${MIN_INCUMBENT_REPLACEMENT_LIFT.toFixed(2)}.`
                : `Promoted automatically: frozen time-split AUC ${(candidateAuc || 0).toFixed(3)} vs legacy ${(legacyAuc || 0).toFixed(3)}.`;
            } else if (existingActive) {
              status = "ACTIVE";
              reason = strictValidation && candidateAuc != null
                ? `Incumbent retained. Challenger AUC ${candidateAuc.toFixed(3)} did not clear every promotion gate.`
                : "Incumbent retained while the next challenger accumulates enough frozen validation data.";
            } else if (shadowValidation) {
              status = "SHADOW";
              const blockers: string[] = [];
              if (graded.length < MIN_GRADED) blockers.push(`${graded.length}/${MIN_GRADED} graded`);
              if (frozen.length < MIN_FROZEN) blockers.push(`${frozen.length}/${MIN_FROZEN} frozen`);
              if (frozenGames < MIN_GAMES) blockers.push(`${frozenGames}/${MIN_GAMES} frozen games`);
              if (frozenDates < MIN_DATES) blockers.push(`${frozenDates}/${MIN_DATES} frozen dates`);
              if (strictValidation && !passesPerformance) blockers.push("out-of-sample lift gate");
              reason = `Shadow only — ${blockers.join(", ") || "promotion gates not yet cleared"}.`;
            } else {
              status = "COLLECTING";
              reason = `Collecting history — ${graded.length}/${MIN_GRADED} graded, ${frozen.length}/${MIN_FROZEN} frozen pregame observations.`;
            }

            const row: SheetRow = {
              Sport: sport,
              Status: status,
              "Active Model Version": activeVersion,
              "Active Model AUC": activeAuc == null ? "" : activeAuc.toFixed(6),
              "Candidate Model Version": candidateSpec ? candidateVersion : "",
              "Candidate AUC": candidateAuc == null ? "" : candidateAuc.toFixed(6),
              "Legacy AUC": legacyAuc == null ? "" : legacyAuc.toFixed(6),
              "Evaluation Source": evaluationSource,
              "Graded W/L": String(graded.length),
              "Frozen W/L": String(frozen.length),
              "Unique Games": String(uniqueGames),
              "Unique Dates": String(uniqueDates),
              "Normal Gap": String(normalGap),
              "Early Gap": String(earlyGap),
              "Decision Window Minutes": String(FOOTBALL_DECISION_WINDOW_MINUTES),
              "Last Evaluated ET": nowET(),
              "Promotion Reason": reason,
              "Active Model JSON": activeModelJson,
              "Candidate Model JSON": candidateSpec ? JSON.stringify(candidateSpec) : "",
            };
            await upsertSportRows(sport, MODEL_TAB, MODEL_HEADERS, [row], (item) => String(item.Sport || ""));
            return lifecycleFromRow(sport, row);
          }

          function strengthScore(gap: number) {
            if (!Number.isFinite(gap)) return 0;
            if (gap < 5) return Math.max(0, Math.min(59, Math.round(50 + gap * 2)));
            if (gap < 10) return Math.max(60, Math.min(68, Math.round(60 + (gap - 5) * 1.8)));
            if (gap < 20) return Math.max(69, Math.min(84, Math.round(69 + (gap - 10) * 1.6)));
            return Math.max(85, Math.min(100, Math.round(85 + (gap - 20) * 0.75)));
          }

          function tier(score: number, direction: boolean, eligible: boolean) {
            if (!direction || !eligible || score < 60) return "Pass";
            if (score >= 85) return "Elite";
            if (score >= 69) return "Strong";
            return "Good";
          }

          function sameDateSlate(play: Record<string, any>, games: SheetRow[]) {
            const date = isoDate(play.date || play.Date);
            return games.filter((row) => isoDate(row.Date || row["Game Date"]) === date);
          }

          function thresholdInfo(play: Record<string, any>, games: SheetRow[], normalGap: number, earlyGap: number) {
            const date = isoDate(play.date || play.Date);
            const start = parseGameStart(date, play.gameTime || play["Game Time"] || play["Game Time ET"]);
            if (start == null) return { start: null, threshold: normalGap, early: false, blockIndex: 0, blockCount: 0 };
            const minute = (value: number) => Math.round(value / 60_000) * 60_000;
            const blocks = [...new Set(sameDateSlate(play, games)
              .map((row) => parseGameStart(row.Date || row["Game Date"], row["Game Time"] || row["Game Time ET"] || row.Time))
              .filter((value): value is number => value != null)
              .map(minute))].sort((a, b) => a - b);
            const startBlock = minute(start);
            let index = blocks.findIndex((block) => block === startBlock);
            if (index < 0) index = blocks.findIndex((block) => block > startBlock);
            if (index < 0) index = Math.max(0, blocks.length - 1);
            const earlyCount = Math.floor(blocks.length / 2);
            const early = blocks.length > 1 && index < earlyCount;
            return { start, threshold: early ? earlyGap : normalGap, early, blockIndex: index + 1, blockCount: blocks.length };
          }

          export async function applyFootballTrendV2<T extends { trendPlays?: Record<string, any>[]; games?: SheetRow[] }>(
            sport: FootballSport,
            payload: T,
            nowMs = Date.now(),
          ): Promise<T & { trendV2?: Record<string, any> }> {
            let row: SheetRow | undefined;
            try {
              row = await registryRow(sport);
            } catch (error) {
              console.warn(`${sport} Trend V2 registry read failed`, error);
              return { ...payload, trendV2: { status: "COLLECTING", reason: "Trend V2 registry unavailable; legacy scoring retained." } };
            }
            const lifecycle = lifecycleFromRow(sport, row);
            const spec = lifecycle.status === "ACTIVE" ? parseModel(row?.["Active Model JSON"]) : null;
            if (!spec || !Array.isArray(payload.trendPlays) || !payload.trendPlays.length) {
              return { ...payload, trendV2: { ...lifecycle, active: false } };
            }

            const games = Array.isArray(payload.games) ? payload.games : [];
            const initial = payload.trendPlays.map((play) => {
              const vector = featureVector(play);
              const probability = predictModel(spec, vector);
              const implied = vector[0] ?? impliedFromOdds(play.odds) ?? 50;
              const marketGap = probability * 100 - implied;
              const legacyScore = Number(play.score || 0);
              const legacyTier = String(play.tier || "Pass");
              const odds = parseAmericanOdds(play.odds);
              const dataComplete = vector[0] != null && vector[1] != null && vector[2] != null &&
                Number(vector[1] || 0) > 0 && Array.isArray(play.signals) && play.signals.length > 0 && odds !== 0;
              return {
                ...play,
                legacyScore,
                legacyTier,
                v2Probability: probability * 100,
                v2MarketGap: marketGap,
                v2ImpliedProbability: implied,
                v2DataComplete: dataComplete,
                v2Direction: false,
                v2DailyEligible: false,
                v2DailyRank: null as number | null,
                v2ModelVersion: lifecycle.activeModelVersion,
                v2PlayablePrice: odds > 0 || odds >= MAX_FAVORITE_PRICE,
              };
            });

            const groups = new Map<string, typeof initial>();
            for (const play of initial) {
              const key = `${isoDate(play.date)}|${String(play.gameKey || play.game)}|${String(play.market)}`;
              const group = groups.get(key) || [];
              group.push(play);
              groups.set(key, group);
            }

            const resolved: Array<Record<string, any>> = [];
            for (const group of groups.values()) {
              const winner = [...group].sort((a, b) => Number(b.v2MarketGap) - Number(a.v2MarketGap) || Number(b.v2Probability) - Number(a.v2Probability))[0];
              for (const play of group) {
                const direction = group.length >= 2 && play === winner;
                const eligible = direction && Boolean(play.v2DataComplete) && Boolean(play.v2PlayablePrice);
                const score = strengthScore(Number(play.v2MarketGap));
                const v2Tier = tier(score, direction, eligible);
                const threshold = thresholdInfo(play, games, spec.normalGap, spec.earlyGap);
                const minutesToStart = threshold.start == null ? null : (threshold.start - nowMs) / 60_000;
                const decisionWindowOpen = minutesToStart != null && minutesToStart > 0 && minutesToStart <= FOOTBALL_DECISION_WINDOW_MINUTES;
                const thresholdCleared = Number(play.v2MarketGap) >= threshold.threshold;
                const gapNeeded = Math.max(0, threshold.threshold - Number(play.v2MarketGap));
                let decisionStatus = "";
                if (!direction) decisionStatus = "Not V2 direction";
                else if (!eligible) decisionStatus = "Blocked by V2 guardrail";
                else if (minutesToStart == null) decisionStatus = "Decision time unavailable";
                else if (minutesToStart <= 0) decisionStatus = "Game started";
                else if (!decisionWindowOpen) decisionStatus = `Waiting for T-${FOOTBALL_DECISION_WINDOW_MINUTES} min`;
                else if (thresholdCleared) decisionStatus = "OPEN • threshold cleared";
                else decisionStatus = "OPEN • below threshold";
                resolved.push({
                  ...play,
                  score: direction ? score : Math.min(59, score),
                  tier: v2Tier,
                  v2Score: direction ? score : Math.min(59, score),
                  v2Tier,
                  v2Direction: direction,
                  v2DailyEligible: eligible,
                  v2RequiredGap: threshold.threshold,
                  v2GapNeeded: gapNeeded,
                  v2MinutesToStart: minutesToStart,
                  v2EarlyPremium: threshold.early,
                  v2SlateBlock: threshold.blockIndex,
                  v2SlateBlockCount: threshold.blockCount,
                  v2DecisionWindowOpen: decisionWindowOpen,
                  v2ThresholdCleared: thresholdCleared,
                  v2DecisionStatus: decisionStatus,
                });
              }
            }

            const ranked = resolved
              .filter((play) => play.v2Direction && play.v2DailyEligible)
              .sort((a, b) => Number(b.v2MarketGap) - Number(a.v2MarketGap));
            const rank = new Map(ranked.map((play, index) => [`${isoDate(play.date)}|${String(play.gameKey || play.game)}|${String(play.market)}`, index + 1]));
            const final = resolved.map((play) => ({
              ...play,
              v2DailyRank: play.v2Direction ? rank.get(`${isoDate(play.date)}|${String(play.gameKey || play.game)}|${String(play.market)}`) || null : null,
            }));

            return {
              ...payload,
              trendPlays: final,
              trendV2: {
                ...lifecycle,
                active: true,
                note: "Football V2 activates only after frozen, time-split out-of-sample promotion gates clear. Ranking probability is not a calibrated win probability.",
              },
            };
          }
          EOF

          cat > app/api/football-weekly-market/route.ts <<'EOF'
          import { NextRequest, NextResponse } from "next/server";
          import { readWeeklyFootballMarket } from "../../../lib/footballWeeklyMarket";
          import { rescoreNcaafWeeklyMarket } from "../../../lib/footballTrendRescore";
          import { applyFootballTrendV2 } from "../../../lib/footballTrendV2Lifecycle";
          import type { FootballSport } from "../../../lib/sportSheets";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";
          export const revalidate = 0;
          export const maxDuration = 60;

          export async function GET(request: NextRequest) {
            const raw = String(request.nextUrl.searchParams.get("sport") || "").toUpperCase();
            if (raw !== "NFL" && raw !== "NCAAF") {
              return NextResponse.json({ ok: false, error: "sport must be NFL or NCAAF" }, { status: 400 });
            }
            try {
              const sport = raw as FootballSport;
              const result = await readWeeklyFootballMarket(sport);
              const rescored = await rescoreNcaafWeeklyMarket(sport, result);
              const scored = await applyFootballTrendV2(sport, rescored);
              return NextResponse.json(scored, { headers: { "Cache-Control": "no-store, max-age=0" } });
            } catch (error) {
              console.error("Football weekly market read failed", error);
              return NextResponse.json({ ok: false, sport: raw, error: error instanceof Error ? error.message : String(error) }, { status: 500 });
            }
          }
          EOF

          cat > app/api/cron/football-public-snapshot/route.ts <<'EOF'
          import { NextRequest, NextResponse } from "next/server";
          import { buildFootballPublicData } from "../../../../lib/footballPublicData";
          import { evaluateFootballTrendV2 } from "../../../../lib/footballTrendV2Lifecycle";
          import type { FootballSport } from "../../../../lib/sportSheets";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";
          export const revalidate = 0;
          export const maxDuration = 120;

          function requestedSport(request: NextRequest): FootballSport | null {
            const sport = String(request.nextUrl.searchParams.get("sport") || "")
              .trim()
              .toUpperCase();
            return sport === "NFL" || sport === "NCAAF" ? sport : null;
          }

          export async function GET(request: NextRequest) {
            const cronSecret = process.env.CRON_SECRET;
            if (!cronSecret) {
              return NextResponse.json(
                { ok: false, error: "CRON_SECRET is not configured." },
                { status: 500 },
              );
            }

            if (request.headers.get("authorization") !== `Bearer ${cronSecret}`) {
              return NextResponse.json({ ok: false, error: "Unauthorized" }, { status: 401 });
            }

            const sport = requestedSport(request);
            if (!sport) {
              return NextResponse.json(
                { ok: false, error: "sport must be NFL or NCAAF" },
                { status: 400 },
              );
            }

            try {
              const payload = await buildFootballPublicData(sport, {
                forceFresh: true,
                persist: true,
              });
              let trendV2Lifecycle: unknown = null;
              try {
                // evaluateFootballTrendV2 internally throttles itself to one full
                // evaluation per ET date, so frequent market snapshots stay cheap.
                trendV2Lifecycle = await evaluateFootballTrendV2(sport);
              } catch (error) {
                console.warn(`${sport} Trend V2 lifecycle evaluation failed`, error);
                trendV2Lifecycle = {
                  sport,
                  status: "COLLECTING",
                  reason: "Lifecycle evaluation failed; incumbent/legacy scoring was left unchanged.",
                };
              }
              return NextResponse.json({ ...payload, trendV2Lifecycle }, {
                headers: {
                  "Cache-Control": "no-store, max-age=0",
                },
              });
            } catch (error) {
              console.error(`${sport} football public snapshot failed`, error);
              return NextResponse.json(
                {
                  ok: false,
                  sport,
                  error: error instanceof Error ? error.message : String(error),
                },
                { status: 500 },
              );
            }
          }
          EOF


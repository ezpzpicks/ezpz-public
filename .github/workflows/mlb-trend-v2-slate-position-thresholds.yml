name: Use MLB Trend V2 slate-position thresholds

on:
  push:
    paths:
      - ".github/workflows/mlb-trend-v2-slate-position-thresholds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply slate-position threshold rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib_path = Path("lib/mlbTrendV2.ts")
          route_path = Path("app/api/public-data-v2/route.ts")
          page_path = Path("app/page.tsx")

          lib = lib_path.read_text()
          route = route_path.read_text()
          page = page_path.read_text()

          old_lock = '''export type DailyLockDecision={play:V2TrendPlay;threshold:number;earlyPremium:boolean;minutesToStart:number};
          export function chooseDailyTrendLock(scored:V2TrendPlay[],slateRows:AnyRow[],nowMs=Date.now()):DailyLockDecision|null{
            const slateStarts=slateRows.map(r=>({key:String(r?.["Game Key"]||"").trim().replace(/\\.0$/,""),start:parseGameStart(r?.Date,r?.["Game Time"]||r?.["Game Time ET"])})).filter(x=>x.start!==null) as Array<{key:string;start:number}>;
            const candidates=scored.filter(p=>p.v2Direction&&p.v2DailyEligible).map(play=>{const start=parseGameStart(play.recordDate||play.Date,play.v2GameTime);const minutes=start==null?null:(start-nowMs)/60000;if(start==null||minutes==null||minutes<=0||minutes>MLB_TREND_V2_DECISION_WINDOW_MINUTES)return null;const later=slateStarts.some(x=>x.start>start+60000);const threshold=later?MLB_TREND_V2_EARLY_GAP:MLB_TREND_V2_NORMAL_GAP;if(play.v2MarketGap<threshold)return null;return{play,threshold,earlyPremium:later,minutesToStart:minutes}}).filter((x):x is DailyLockDecision=>Boolean(x)).sort((a,b)=>b.play.v2MarketGap-a.play.v2MarketGap);return candidates[0]||null;
          }
          '''

          new_lock = '''export type SlateThresholdInfo={threshold:number;earlyPremium:boolean;blockIndex:number;blockCount:number;phase:"EARLY"|"NORMAL"};
          export function slateThresholdForStart(start:number,slateRows:AnyRow[]):SlateThresholdInfo{
            const minute=(value:number)=>Math.round(value/60000)*60000;
            const blocks=[...new Set(slateRows.map(r=>parseGameStart(r?.Date,r?.["Game Time"]||r?.["Game Time ET"])).filter((value):value is number=>value!==null).map(minute))].sort((a,b)=>a-b);
            const startBlock=minute(start);
            let blockIndex=blocks.findIndex(block=>block===startBlock);
            if(blockIndex<0){blockIndex=blocks.findIndex(block=>block>startBlock);if(blockIndex<0)blockIndex=Math.max(0,blocks.length-1)}
            const earlyBlockCount=Math.floor(blocks.length/2);
            const earlyPremium=blocks.length>1&&blockIndex<earlyBlockCount;
            return{threshold:earlyPremium?MLB_TREND_V2_EARLY_GAP:MLB_TREND_V2_NORMAL_GAP,earlyPremium,blockIndex:blockIndex+1,blockCount:blocks.length,phase:earlyPremium?"EARLY":"NORMAL"};
          }

          export type DailyLockDecision={play:V2TrendPlay;threshold:number;earlyPremium:boolean;minutesToStart:number};
          export function chooseDailyTrendLock(scored:V2TrendPlay[],slateRows:AnyRow[],nowMs=Date.now()):DailyLockDecision|null{
            const candidates=scored.filter(p=>p.v2Direction&&p.v2DailyEligible).map(play=>{const start=parseGameStart(play.recordDate||play.Date,play.v2GameTime);const minutes=start==null?null:(start-nowMs)/60000;if(start==null||minutes==null||minutes<=0||minutes>MLB_TREND_V2_DECISION_WINDOW_MINUTES)return null;const thresholdInfo=slateThresholdForStart(start,slateRows);if(play.v2MarketGap<thresholdInfo.threshold)return null;return{play,threshold:thresholdInfo.threshold,earlyPremium:thresholdInfo.earlyPremium,minutesToStart:minutes}}).filter((x):x is DailyLockDecision=>Boolean(x)).sort((a,b)=>b.play.v2MarketGap-a.play.v2MarketGap);return candidates[0]||null;
          }
          '''

          if old_lock not in lib:
              raise SystemExit("Could not find current DailyLockDecision/chooseDailyTrendLock block")
          lib = lib.replace(old_lock, new_lock, 1)

          old_import = '''  chooseDailyTrendLock, isoDate, nowET, parseGameStart, resultProfit,
            scoreTrendBoardV2,
          '''
          new_import = '''  chooseDailyTrendLock, isoDate, nowET, parseGameStart, resultProfit,
            scoreTrendBoardV2, slateThresholdForStart,
          '''
          if old_import not in route:
              raise SystemExit("Could not find route import block")
          route = route.replace(old_import, new_import, 1)

          old_annotate = '''function annotateLiveV2Status(scored:V2TrendPlay[],slateRows:AnyRow[],nowMs:number):V2TrendPlay[]{
            const slateStarts=slateRows.map(row=>parseGameStart(row?.Date,row?.["Game Time"]||row?.["Game Time ET"])).filter((value):value is number=>value!==null);
            return scored.map(play=>{
              const start=parseGameStart(play.recordDate||play.Date,play.v2GameTime);
              const minutesToStart=start==null?null:(start-nowMs)/60000;
              const hasLaterGame=start!=null&&slateStarts.some(other=>other>start+60000);
              const requiredGap=start==null?null:(hasLaterGame?MLB_TREND_V2_EARLY_GAP:MLB_TREND_V2_NORMAL_GAP);
              const gapNeeded=requiredGap==null?null:Math.max(0,requiredGap-Number(play.v2MarketGap||0));
              const decisionWindowOpen=minutesToStart!=null&&minutesToStart>0&&minutesToStart<=MLB_TREND_V2_DECISION_WINDOW_MINUTES;
              const thresholdCleared=requiredGap!=null&&Number(play.v2MarketGap)>=requiredGap;
              let decisionStatus="";
              if(!play.v2Direction)decisionStatus="Not V2 direction";
              else if(!play.v2DailyEligible)decisionStatus="Blocked by guardrail";
              else if(minutesToStart==null)decisionStatus="Decision time unavailable";
              else if(minutesToStart<=0)decisionStatus="Game started";
              else if(!decisionWindowOpen)decisionStatus=`Waiting for T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} min`;
              else if(thresholdCleared)decisionStatus="OPEN • threshold cleared";
              else decisionStatus="OPEN • below threshold";
              return{...play,v2RequiredGap:requiredGap,v2GapNeeded:gapNeeded,v2MinutesToStart:minutesToStart,v2EarlyPremium:requiredGap==null?null:hasLaterGame,v2DecisionWindowOpen:decisionWindowOpen,v2ThresholdCleared:thresholdCleared,v2DecisionStatus:decisionStatus} as V2TrendPlay;
            });
          }
          '''

          new_annotate = '''function annotateLiveV2Status(scored:V2TrendPlay[],slateRows:AnyRow[],nowMs:number):V2TrendPlay[]{
            return scored.map(play=>{
              const start=parseGameStart(play.recordDate||play.Date,play.v2GameTime);
              const minutesToStart=start==null?null:(start-nowMs)/60000;
              const thresholdInfo=start==null?null:slateThresholdForStart(start,slateRows);
              const requiredGap=thresholdInfo?.threshold??null;
              const gapNeeded=requiredGap==null?null:Math.max(0,requiredGap-Number(play.v2MarketGap||0));
              const decisionWindowOpen=minutesToStart!=null&&minutesToStart>0&&minutesToStart<=MLB_TREND_V2_DECISION_WINDOW_MINUTES;
              const thresholdCleared=requiredGap!=null&&Number(play.v2MarketGap)>=requiredGap;
              let decisionStatus="";
              if(!play.v2Direction)decisionStatus="Not V2 direction";
              else if(!play.v2DailyEligible)decisionStatus="Blocked by guardrail";
              else if(minutesToStart==null)decisionStatus="Decision time unavailable";
              else if(minutesToStart<=0)decisionStatus="Game started";
              else if(!decisionWindowOpen)decisionStatus=`Waiting for T-${MLB_TREND_V2_DECISION_WINDOW_MINUTES} min`;
              else if(thresholdCleared)decisionStatus="OPEN • threshold cleared";
              else decisionStatus="OPEN • below threshold";
              return{...play,v2RequiredGap:requiredGap,v2GapNeeded:gapNeeded,v2MinutesToStart:minutesToStart,v2EarlyPremium:thresholdInfo?.earlyPremium??null,v2SlatePhase:thresholdInfo?.phase??null,v2SlateBlockIndex:thresholdInfo?.blockIndex??null,v2SlateBlockCount:thresholdInfo?.blockCount??null,v2DecisionWindowOpen:decisionWindowOpen,v2ThresholdCleared:thresholdCleared,v2DecisionStatus:decisionStatus} as V2TrendPlay;
            });
          }
          '''

          if old_annotate not in route:
              raise SystemExit("Could not find live V2 annotation block")
          route = route.replace(old_annotate, new_annotate, 1)

          old_rule = 'const rule=decision.earlyPremium?`Early-game premium cleared: V2 Market Gap ${play.v2MarketGap.toFixed(1)} >= ${decision.threshold.toFixed(0)}`:`Normal daily threshold cleared: V2 Market Gap ${play.v2MarketGap.toFixed(1)} >= ${decision.threshold.toFixed(0)}`;'
          new_rule = 'const rule=decision.earlyPremium?`Early-half slate premium cleared: V2 Market Gap ${play.v2MarketGap.toFixed(1)} >= ${decision.threshold.toFixed(0)}`:`Back-half normal threshold cleared: V2 Market Gap ${play.v2MarketGap.toFixed(1)} >= ${decision.threshold.toFixed(0)}`;'
          if old_rule not in route:
              raise SystemExit("Could not find daily pick rule copy")
          route = route.replace(old_rule, new_rule, 1)

          old_meta = 'payload.trendV2={version:MLB_TREND_V2_VERSION,launchDate:MLB_TREND_V2_LAUNCH_DATE,normalGap:MLB_TREND_V2_NORMAL_GAP,earlyGap:MLB_TREND_V2_EARLY_GAP,maxDailyPicks:MLB_TREND_V2_MAX_DAILY_PICKS,decisionWindowMinutes:MLB_TREND_V2_DECISION_WINDOW_MINUTES,note:"V2 Ranking Probability and Market Gap are ranking diagnostics, not calibrated win probabilities."};'
          new_meta = 'payload.trendV2={version:MLB_TREND_V2_VERSION,launchDate:MLB_TREND_V2_LAUNCH_DATE,normalGap:MLB_TREND_V2_NORMAL_GAP,earlyGap:MLB_TREND_V2_EARLY_GAP,maxDailyPicks:MLB_TREND_V2_MAX_DAILY_PICKS,decisionWindowMinutes:MLB_TREND_V2_DECISION_WINDOW_MINUTES,thresholdRule:"20% for the first half of unique game-start blocks; 15% from the midpoint through the final block",note:"V2 Ranking Probability and Market Gap are ranking diagnostics, not calibrated win probabilities."};'
          if old_meta not in route:
              raise SystemExit("Could not find trendV2 metadata block")
          route = route.replace(old_meta, new_meta, 1)

          old_label = 'return `${required.toFixed(0)}%${play.v2EarlyPremium ? " • EARLY" : " • FINAL"}`;'
          new_label = 'return `${required.toFixed(0)}%${play.v2EarlyPremium ? " • EARLY" : " • NORMAL"}`;'
          if old_label not in page:
              raise SystemExit("Could not find Required Gap display label")
          page = page.replace(old_label, new_label, 1)

          lib_path.write_text(lib)
          route_path.write_text(route)
          page_path.write_text(page)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit slate-position rule
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mlbTrendV2.ts app/api/public-data-v2/route.ts app/page.tsx
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Use slate-position thresholds for MLB Trend V2"
          git push

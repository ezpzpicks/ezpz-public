name: NCAAF MLB-style form badges v2

on:
  push:
    paths:
      - ".github/workflows/ncaaf-mlb-style-form-badges-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_ncaaf_mlb_form_badges.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Verify
        run: |
          grep -q 'FootballModelFormBadges' app/FootballGameTabs.tsx
          grep -q 'FootballModelFormBadges' app/FootballBoard.tsx
          grep -q 'fgtModelFormBadges' app/FootballGameTabs.tsx
          grep -q 'footballHistoryFormBadges' app/FootballBoard.tsx
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/FootballGameTabs.tsx app/FootballBoard.tsx
          git commit -m "Show MLB-style form badges on NCAAF cards"
          git push

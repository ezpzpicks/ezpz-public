name: Multi-sport football public smoke

on:
  push:
    branches:
      - main
      - football-public-vercel-hotfix
    paths:
      - app/FootballBoard.tsx
      - app/page.tsx
      - app/api/public-data-v2/route.ts
      - lib/footballPublicData.ts
      - lib/sportSheets.ts
      - package.json
      - .github/workflows/multi-sport-football-public.yml
  pull_request:
    branches:
      - main
    paths:
      - app/FootballBoard.tsx
      - app/page.tsx
      - app/api/public-data-v2/route.ts
      - lib/footballPublicData.ts
      - lib/sportSheets.ts
      - package.json
      - .github/workflows/multi-sport-football-public.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Reproduce Vercel production build
        run: npm run build
      - name: Check generated diff
        run: git diff --check

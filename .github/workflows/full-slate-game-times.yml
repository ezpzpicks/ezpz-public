name: One-time full slate game-time ordering update

on:
  push:
    paths:
      - ".github/workflows/full-slate-game-times.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sort live full slates by game time and show start times
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("app/page.tsx")
          text = page.read_text()

          # MLB: resolve a display/sort time from the saved slate first, then
          # fall back to the matching DraftKings event time when the slate row
          # itself does not contain a start-time field.
          if "function publicSlateRawTime(" not in text:
              anchor = "function liveSplitsForRow("
              if anchor not in text:
                  raise SystemExit("MLB helper anchor not found")
              helper = '''const PUBLIC_SLATE_TIME_KEYS = [
            "Game Time ET",
            "Game Time",
            "Game Start Time",
            "Scheduled Start",
            "Start Time",
            "Scheduled Time",
            "First Pitch",
            "Time",
          ];

          function publicSlateRawTime(
            row: SheetRow | undefined,
            draftKings?: DraftKingsData | null,
          ) {
            if (!row) return "";
            const direct = PUBLIC_SLATE_TIME_KEYS
              .map((column) => String(row[column] || "").trim())
              .find(Boolean);
            if (direct) return direct;

            const away = publicMatchKey(row["Away Team"]);
            const home = publicMatchKey(row["Home Team"]);
            if (!away || !home) return "";

            const marketRow = [
              ...(draftKings?.splits || []),
              ...(draftKings?.props || []),
            ].find(
              (candidate) =>
                publicMatchKey(candidate.awayTeam) === away &&
                publicMatchKey(candidate.homeTeam) === home &&
                candidate.eventTime,
            );
            return String(marketRow?.eventTime || "").trim();
          }

          function publicSlateTimeSortValue(
            row: SheetRow | undefined,
            draftKings?: DraftKingsData | null,
          ) {
            const raw = publicSlateRawTime(row, draftKings);
            if (!raw) return Number.POSITIVE_INFINITY;

            const meridiem = raw.match(/(\\d{1,2})(?::(\\d{2}))?\\s*(AM|PM)\\b/i);
            if (meridiem) {
              let hour = Number(meridiem[1]) % 12;
              if (meridiem[3].toUpperCase() === "PM") hour += 12;
              return hour * 60 + Number(meridiem[2] || 0);
            }

            const twentyFour = raw.match(/^(\\d{1,2}):(\\d{2})(?:\\s*ET)?$/i);
            if (twentyFour) return Number(twentyFour[1]) * 60 + Number(twentyFour[2]);

            const stamp = Date.parse(raw);
            if (Number.isFinite(stamp)) {
              const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/New_York",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
              }).formatToParts(new Date(stamp));
              const hour = Number(parts.find((part) => part.type === "hour")?.value || "");
              const minute = Number(parts.find((part) => part.type === "minute")?.value || "");
              if (Number.isFinite(hour) && Number.isFinite(minute)) return hour * 60 + minute;
            }

            return Number.POSITIVE_INFINITY;
          }

          function displayPublicSlateTime(
            row: SheetRow | undefined,
            draftKings?: DraftKingsData | null,
          ) {
            const raw = publicSlateRawTime(row, draftKings);
            if (!raw) return "";

            const meridiem = raw.match(/(\\d{1,2})(?::(\\d{2}))?\\s*(AM|PM)\\b/i);
            if (meridiem) {
              return `${Number(meridiem[1])}:${String(meridiem[2] || "00").padStart(2, "0")} ${meridiem[3].toUpperCase()}`;
            }

            const twentyFour = raw.match(/^(\\d{1,2}):(\\d{2})(?:\\s*ET)?$/i);
            if (twentyFour) {
              const hour24 = Number(twentyFour[1]);
              const suffix = hour24 >= 12 ? "PM" : "AM";
              const hour12 = hour24 % 12 || 12;
              return `${hour12}:${twentyFour[2]} ${suffix}`;
            }

            const stamp = Date.parse(raw);
            if (Number.isFinite(stamp)) {
              return new Intl.DateTimeFormat("en-US", {
                timeZone: "America/New_York",
                hour: "numeric",
                minute: "2-digit",
                hour12: true,
              }).format(new Date(stamp));
            }

            return raw.replace(/\\s+ET$/i, "");
          }

          '''
              text = text.replace(anchor, helper + anchor, 1)

          old_map = "data.slateToday.map((row, index) => {"
          if old_map in text:
              new_map = '''[...data.slateToday]
                .sort((a, b) => {
                  const aTime = publicSlateTimeSortValue(a, draftKings);
                  const bTime = publicSlateTimeSortValue(b, draftKings);
                  if (aTime !== bTime) return aTime - bTime;
                  const aGame = a["Game Label"] || `${a["Away Team"]} at ${a["Home Team"]}`;
                  const bGame = b["Game Label"] || `${b["Away Team"]} at ${b["Home Team"]}`;
                  return aGame.localeCompare(bGame);
                })
                .map((row, index) => {'''
              text = text.replace(old_map, new_map, 1)
          elif "publicSlateTimeSortValue(a, draftKings)" not in text:
              raise SystemExit("MLB Full Slate map not found")

          old_game = '''                const game =
                  row["Game Label"] || `${row["Away Team"]} at ${row["Home Team"]}`;

                return ('''
          if old_game in text:
              new_game = '''                const game =
                  row["Game Label"] || `${row["Away Team"]} at ${row["Home Team"]}`;
                const gameTime = displayPublicSlateTime(row, draftKings);

                return ('''
              text = text.replace(old_game, new_game, 1)
          elif "const gameTime = displayPublicSlateTime(row, draftKings);" not in text:
              raise SystemExit("MLB game-time insertion point not found")

          old_title = '<div className="slateDropdownTitle">{game}</div>\n                      </div>'
          if old_title in text:
              new_title = '<div className="slateDropdownTitle">{game}</div>\n                        {gameTime ? <div className="slateDropdownSub">{gameTime}</div> : null}\n                      </div>'
              text = text.replace(old_title, new_title, 1)
          elif '{gameTime ? <div className="slateDropdownSub">{gameTime}</div> : null}' not in text:
              raise SystemExit("MLB Full Slate title block not found")

          page.write_text(text)

          # NFL + NCAAF: keep the existing visible time, but normalize the field
          # lookup and sort the merged slate chronologically before rendering.
          football = Path("app/FootballBoardBase.tsx")
          text = football.read_text()

          if "function footballRowGameTime(" not in text:
              anchor = "function selectedSplit("
              if anchor not in text:
                  raise SystemExit("Football helper anchor not found")
              helper = '''const FOOTBALL_SLATE_TIME_KEYS = [
            "Game Time ET",
            "Game Time",
            "Game Start Time",
            "Scheduled Start",
            "Start Time",
            "Scheduled Time",
            "First Pitch",
            "Time",
          ];

          function footballRowGameTime(row: SheetRow | undefined) {
            if (!row) return "";
            return FOOTBALL_SLATE_TIME_KEYS
              .map((column) => String(row[column] || "").trim())
              .find(Boolean) || "";
          }

          function footballSlateTimeSortValue(row: SheetRow | undefined) {
            const raw = footballRowGameTime(row);
            const simple = gameTimeSortValue(raw);
            if (Number.isFinite(simple)) return simple;
            const stamp = Date.parse(raw);
            if (!Number.isFinite(stamp)) return Number.POSITIVE_INFINITY;
            const parts = new Intl.DateTimeFormat("en-US", {
              timeZone: "America/New_York",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            }).formatToParts(new Date(stamp));
            const hour = Number(parts.find((part) => part.type === "hour")?.value || "");
            const minute = Number(parts.find((part) => part.type === "minute")?.value || "");
            return Number.isFinite(hour) && Number.isFinite(minute)
              ? hour * 60 + minute
              : Number.POSITIVE_INFINITY;
          }

          '''
              text = text.replace(anchor, helper + anchor, 1)

          old_return = "    return rows;\n  }, [weeklyData?.games, data.slateToday, data.today]);"
          if old_return in text:
              new_return = '''    return rows.sort((a, b) => {
              const aTime = footballSlateTimeSortValue(a);
              const bTime = footballSlateTimeSortValue(b);
              if (aTime !== bTime) return aTime - bTime;
              const aGame = a.Game || a["Game Label"] || `${a["Away Team"] || ""} @ ${a["Home Team"] || ""}`;
              const bGame = b.Game || b["Game Label"] || `${b["Away Team"] || ""} @ ${b["Home Team"] || ""}`;
              return aGame.localeCompare(bGame);
            });
          }, [weeklyData?.games, data.slateToday, data.today]);'''
              text = text.replace(old_return, new_return, 1)
          elif "return rows.sort((a, b) => {" not in text:
              raise SystemExit("Football slate return block not found")

          old_time = '          const gameTime = String(row["Game Time"] || row.Time || row["Start Time"] || "").trim();'
          new_time = '          const gameTime = footballRowGameTime(row);'
          if old_time in text:
              text = text.replace(old_time, new_time, 1)
          elif new_time not in text:
              raise SystemExit("Football Full Slate time line not found")

          football.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify full slate behavior
        shell: bash
        run: |
          grep -q 'publicSlateTimeSortValue(a, draftKings)' app/page.tsx
          grep -q 'displayPublicSlateTime(row, draftKings)' app/page.tsx
          grep -q 'footballSlateTimeSortValue(a)' app/FootballBoardBase.tsx
          grep -q 'const gameTime = footballRowGameTime(row);' app/FootballBoardBase.tsx
          git diff --check

      - name: Commit full slate time update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-slate-game-times.yml
          git add app/page.tsx app/FootballBoardBase.tsx
          git commit -m "Sort full slates by game time"
          git push

name: Validate MLB one-pick-per-game policy

on:
  push:
    branches: [main]
    paths:
      - 'app/api/public-data-v2/route.ts'
      - 'lib/mlbTrendV2.ts'
      - 'app/page.tsx'
      - 'scripts/mlb_all_15_patch.mjs'
      - '.github/workflows/mlb-all-15.yml'
  pull_request:
    paths:
      - 'app/api/public-data-v2/route.ts'
      - 'lib/mlbTrendV2.ts'
      - 'app/page.tsx'
      - 'scripts/mlb_all_15_patch.mjs'
      - '.github/workflows/mlb-all-15.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlb-one-pick-per-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/mlb_all_15_patch.mjs
      - run: npm run build

name: Apply MLB all-15 Trend V2 rule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb-all-15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/mlb_all_15_patch.mjs
      - run: npm run build
      - name: Commit validated rule change
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/mlbTrendV2.ts app/api/public-data-v2/route.ts
          git commit -m "Lock every eligible MLB Trend V2 play at 15%+"
          git push

# Retrigger after workflow registration.

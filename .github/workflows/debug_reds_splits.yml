name: Debug Cardinals Reds Splits

on:
  push:
    branches:
      - agent/debug-reds-splits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live Cardinals Reds trend instances
        run: |
          curl --fail-with-body --silent --show-error --max-time 75 \
            'https://ezpzpicks.com/api/public-data' -o /tmp/public.json
          echo '--- Live DK splits ---'
          jq -c '.draftKings.splits[] | select((.awayTeam|ascii_downcase|contains("cardinal")) and (.homeTeam|ascii_downcase|contains("red")) and (.market=="Moneyline" or .market=="Total")) | {eventTime,market,selection,line,odds,betsPct,moneyPct}' /tmp/public.json
          echo '--- Live trend plays ---'
          jq -c '.trendPlays[] | select((.awayTeam|ascii_downcase|contains("cardinal")) and (.homeTeam|ascii_downcase|contains("red"))) | {recordGameTime,recordGameKey,market,selection,line,odds,betsPct,moneyPct,score,tier}' /tmp/public.json
          echo '--- Validation ---'
          jq -e '
            ([.trendPlays[] | select((.awayTeam|ascii_downcase|contains("cardinal")) and (.homeTeam|ascii_downcase|contains("red")))] ) as $reds |
            ($reds | length > 0) and
            ([$reds[] | select((.recordGameTime // "") == "")] | length == 0) and
            ([$reds[].recordGameTime] | unique | index("13:40") != null) and
            ([$reds[].recordGameTime] | unique | index("18:40") != null)
          ' /tmp/public.json >/dev/null
          echo 'Cardinals/Reds trend plays are time-separated with no untimed legacy trend rows.'

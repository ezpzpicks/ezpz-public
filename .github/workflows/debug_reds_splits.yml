name: Debug Cardinals Reds Splits

on:
  push:
    branches:
      - agent/debug-reds-splits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect DraftKings client data sources
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H 'User-Agent: Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/139.0 Safari/537.36' \
            'https://dknetwork.draftkings.com/draftkings-sportsbook-betting-splits/' \
            -o /tmp/dk.html
          python - <<'PY'
          import re, html
          from urllib.parse import urljoin
          raw=open('/tmp/dk.html',errors='ignore').read()
          print('=== SCRIPT SRCS ===')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', raw, flags=re.I):
              print(urljoin('https://dknetwork.draftkings.com/', html.unescape(src)))
          print('=== RELEVANT URL-LIKE STRINGS ===')
          seen=set()
          for m in re.finditer(r'(?:(?:https?:)?//[^"\'<>\s]+|/[^"\'<>\s]*(?:api|ajax|split|betting)[^"\'<>\s]*)', raw, flags=re.I):
              s=html.unescape(m.group(0))[:500]
              if s not in seen:
                  seen.add(s); print(s)
          print('=== LINES WITH API/AJAX/TABLE FILTER TERMS ===')
          text=html.unescape(raw)
          for line in text.splitlines():
              lower=line.lower()
              if any(k in lower for k in ['admin-ajax','wp-json','betting-split','tb_page','tb_edate','itm_content','% handle','sportsbook betting splits']):
                  line=re.sub(r'\s+',' ',line).strip()
                  if line:
                      print(line[:2000])
          PY

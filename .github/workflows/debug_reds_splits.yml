name: Verify Production Trend Card Dedupe

on:
  push:
    branches:
      - agent/debug-reds-splits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify production trend cards are unique
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            'https://ezpzpicks.com/api/public-data' -o /tmp/public.json
          python - <<'PY'
          import json, re
          from collections import defaultdict

          data = json.load(open('/tmp/public.json'))
          plays = data.get('trendPlays') or []

          def norm(v):
              return re.sub(r'[^a-z0-9]+', '', str(v or '').lower())

          def game_key(p):
              matchup = f"{norm(p.get('awayTeam'))}@{norm(p.get('homeTeam'))}"
              instance = norm(p.get('recordGameKey')) or norm(p.get('recordGameTime'))
              return f"{matchup}|{instance}"

          def side_key(p):
              market = str(p.get('market') or '').lower()
              raw = f"{p.get('side') or ''} {p.get('selection') or ''}".lower()
              if market == 'total':
                  if 'over' in raw: return 'over'
                  if 'under' in raw: return 'under'
              return norm(p.get('side')) or norm(p.get('selection'))

          groups = defaultdict(list)
          for p in plays:
              key = (game_key(p), str(p.get('market') or '').lower(), side_key(p))
              groups[key].append(p)

          dupes = {k:v for k,v in groups.items() if len(v) > 1}
          print('TOTAL TREND PLAYS:', len(plays))
          print('LOGICAL DUPLICATE GROUPS:', len(dupes))
          for k, vals in dupes.items():
              print('DUPLICATE', k)
              for p in vals:
                  print(' ', {x:p.get(x) for x in ['awayTeam','homeTeam','recordGameTime','recordGameKey','market','selection','side','line','score','rank','updatedAt','frozenAt']})

          print('\n--- PITTSBURGH GAME ---')
          for p in plays:
              if 'tiger' in str(p.get('awayTeam','')).lower() and 'pirate' in str(p.get('homeTeam','')).lower():
                  print({x:p.get(x) for x in ['recordGameTime','recordGameKey','market','selection','side','line','score','rank','updatedAt','frozenAt']})

          print('\n--- CARDINALS / REDS ---')
          for p in plays:
              if 'cardinal' in str(p.get('awayTeam','')).lower() and 'red' in str(p.get('homeTeam','')).lower():
                  print({x:p.get(x) for x in ['recordGameTime','recordGameKey','market','selection','side','line','score','rank','updatedAt','frozenAt']})

          if dupes:
              raise SystemExit(f'Found {len(dupes)} logical duplicate trend-card group(s) in production')
          print('\nPASS: production has no duplicate logical trend-card groups.')
          PY

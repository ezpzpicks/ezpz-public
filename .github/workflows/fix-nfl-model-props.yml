name: Apply NFL model props display fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-nfl-model-props.yml'
      - 'scripts/fix_nfl_model_props.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply NFL model props fix
        run: python scripts/fix_nfl_model_props.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build verification
        run: npm run build
      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicData.ts app/FootballBoard.tsx
          git commit -m "Show qualified NFL player props in model plays"
          git push

name: Apply football public snapshot read optimization

'on':
  push:
    paths:
      - '.github/football_public_read_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/football_public_read_patch.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Verify diff
        run: git diff --check
      - name: Commit patch and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-football-public-read-optimization.yml .github/football_public_read_patch.py
          git add lib/footballPublicDataCore.ts
          git commit -m "Skip NFL history hydration in public snapshot cron"
          git push origin HEAD:main

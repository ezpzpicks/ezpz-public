name: Fix EZPZ total half-run matching

on:
  push:
    paths:
      - ".github/workflows/fix-ezpz-total-half-run-matching.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Allow half-run total line movement when grading EZPZ Picks
        shell: bash
        env:
          OLD_BLOCK_B64: ""
          NEW_BLOCK_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("app/api/public-data/route.ts")
          text = path.read_text()
          old = base64.b64decode(os.environ["OLD_BLOCK_B64"]).decode()
          new = base64.b64decode(os.environ["NEW_BLOCK_B64"]).decode()

          if old in text:
              text = text.replace(old, new, 1)
          elif new in text:
              print("EZPZ half-run total result matching is already installed")
          else:
              raise SystemExit("Could not find aiPickTrackerMatch total-line target")

          path.write_text(text)
          PY

      - name: Type-check
        shell: bash
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Match EZPZ total results across half-run moves"
          git push

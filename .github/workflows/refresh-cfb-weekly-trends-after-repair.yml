name: Refresh CFB weekly trends after repair

on:
  push:
    paths:
      - ".github/workflows/refresh-cfb-weekly-trends-after-repair.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh and verify CFB weekly trend scores
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo "Missing CRON_SECRET"; exit 1; }

          for attempt in 1 2 3 4; do
            echo "Refresh attempt $attempt"
            curl --fail-with-body --silent --show-error --max-time 110 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://ezpzpicks.com/api/cron/football-market-discovery?sport=NCAAF" \
              --output /tmp/cfb_discovery.json
            cat /tmp/cfb_discovery.json
            jq -e '.ok == true' /tmp/cfb_discovery.json >/dev/null

            curl --fail-with-body --silent --show-error --max-time 60 \
              "https://ezpzpicks.com/api/football-weekly-market?sport=NCAAF" \
              --output /tmp/cfb_weekly.json

            echo "Current score summary:"
            jq '[.trendPlays[] | {game, selection, score, baseScore, tier, signals: [.signals[] | {signalKey, exactSample, record: .records.allTime.record, totalBets: .records.allTime.totalBets, last7: .records.last7.record}]}] | .[0:24]' /tmp/cfb_weekly.json

            non50=$(jq '[.trendPlays[]?.score | select(. != 50)] | length' /tmp/cfb_weekly.json)
            history=$(jq '[.trendPlays[]?.signals[]? | select(.records.allTime.totalBets > 0)] | length' /tmp/cfb_weekly.json)
            echo "non-50 scores: $non50 ; signals with settled history: $history"
            if [ "$non50" -gt 0 ] && [ "$history" -gt 0 ]; then
              exit 0
            fi
            sleep 15
          done

          echo "CFB weekly trend scores still have no usable historical differentiation."
          exit 1

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-cfb-weekly-trends-after-repair.yml
          git commit -m "Remove one-shot CFB weekly trend refresh"
          git pull --rebase origin main
          git push origin HEAD:main

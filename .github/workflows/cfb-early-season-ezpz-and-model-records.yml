name: Apply CFB early-season EZPZ and model record rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-early-season-ezpz-and-model-records.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CFB policy and record-subset updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Patch target not found: {label}")

          # ---------------- Backend / public payload ----------------
          backend = Path('lib/footballPublicDataLegacy.ts')
          text = backend.read_text()

          old = '''type FootballBestRecordType = "Spread" | "Total" | "Favorite Spread" | "Underdog Spread" | "Over" | "Under";'''
          new = '''type FootballBestRecordType = string;

const CFB_MODEL_RECORD_TYPES: FootballBestRecordType[] = [
  "A Spread Favorite",
  "A Spread Underdog",
  "A Points/Total Over",
  "A Points/Total Under",
  "B Spread Favorite",
  "B Spread Underdog",
  "B Points/Total Over",
  "B Points/Total Under",
];

function footballGradeBucket(value: unknown) {
  const grade = textKey(value);
  if (grade === "a" || grade.startsWith("a ")) return "A";
  if (grade === "b" || grade.startsWith("b ")) return "B";
  return "";
}

function footballCfbRecordType(base: FootballBestRecordType, gradeValue: unknown): FootballBestRecordType {
  const grade = footballGradeBucket(gradeValue);
  if (!grade) return base;
  if (base === "Favorite Spread") return `${grade} Spread Favorite`;
  if (base === "Underdog Spread") return `${grade} Spread Underdog`;
  if (base === "Over") return `${grade} Points/Total Over`;
  if (base === "Under") return `${grade} Points/Total Under`;
  return `${grade} ${base}`.trim();
}'''
          text = replace_once(text, old, new, 'backend CFB record type helpers')

          old = '''function footballTrackerRecordType(row: SheetRow, sport: FootballSport): FootballBestRecordType | "" {
  const marketKey = textKey(row["Bet Type"] || row.Market);
  if (sport !== "NCAAF") return marketKey.includes("total") ? "Total" : marketKey.includes("spread") ? "Spread" : "";
  if (marketKey.includes("total")) {
    const side = textKey(row.Selection);
    return side.startsWith("under") ? "Under" : side.startsWith("over") ? "Over" : "";
  }
  if (!marketKey.includes("spread")) return "";
  const line = trackerLine(row.Selection);
  return line == null || Math.abs(line) < 1e-9 ? "" : line < 0 ? "Favorite Spread" : "Underdog Spread";
}'''
          new = '''function footballTrackerRecordType(row: SheetRow, sport: FootballSport): FootballBestRecordType | "" {
  const marketKey = textKey(row["Bet Type"] || row.Market);
  if (sport !== "NCAAF") return marketKey.includes("total") ? "Total" : marketKey.includes("spread") ? "Spread" : "";
  let base: FootballBestRecordType | "" = "";
  if (marketKey.includes("total")) {
    const side = textKey(row.Selection);
    base = side.startsWith("under") ? "Under" : side.startsWith("over") ? "Over" : "";
  } else if (marketKey.includes("spread")) {
    const line = trackerLine(row.Selection);
    base = line == null || Math.abs(line) < 1e-9 ? "" : line < 0 ? "Favorite Spread" : "Underdog Spread";
  }
  return base ? footballCfbRecordType(base, row.Grade || row["Model Grade"]) : "";
}'''
          text = replace_once(text, old, new, 'backend tracker record type')

          old = '''function footballBestPlayRecordType(play: any, split: DraftKingsSplit | undefined, sport: FootballSport): FootballBestRecordType {
  const market: "Spread" | "Total" = textKey(play.role || play.playType).includes("total") ? "Total" : "Spread";
  if (sport !== "NCAAF") return market;
  if (market === "Total") return split?.side === "Under" || textKey(play.play).startsWith("under") ? "Under" : "Over";
  if (split?.sideGroup === "Favorite" || split?.sideGroup === "Underdog") return `${split.sideGroup} Spread` as FootballBestRecordType;
  const line = split?.line ?? trackerLine(play.play);
  return line != null && line > 0 ? "Underdog Spread" : "Favorite Spread";
}'''
          new = '''function footballBestPlayRecordType(play: any, split: DraftKingsSplit | undefined, sport: FootballSport): FootballBestRecordType {
  const market: "Spread" | "Total" = textKey(play.role || play.playType).includes("total") ? "Total" : "Spread";
  if (sport !== "NCAAF") return market;
  let base: FootballBestRecordType;
  if (market === "Total") {
    base = split?.side === "Under" || textKey(play.play).startsWith("under") ? "Under" : "Over";
  } else if (split?.sideGroup === "Favorite" || split?.sideGroup === "Underdog") {
    base = `${split.sideGroup} Spread`;
  } else {
    const line = split?.line ?? trackerLine(play.play);
    base = line != null && line > 0 ? "Underdog Spread" : "Favorite Spread";
  }
  return footballCfbRecordType(base, play.playType || play.grade || play["Model Grade"]);
}'''
          text = replace_once(text, old, new, 'backend best-play record type')

          old = '''    const trendSampleSize = Number(play.TrendSampleSize || 0);
    // Football early-season safeguard: 1-4 settled samples cannot enter EZPZ.
    // 5-9 samples may qualify, but are capped at Strong. This applies to both
    // CFB and NFL so a new season can legitimately begin with no EZPZ trend plays.
    if (trendSampleSize < 5) continue;
    const ezpzTrendTier =
      trendSampleSize < 10 && play.tier === "Elite"
        ? "Strong"
        : play.tier;'''
          new = '''    const trendSampleSize = Number(play.TrendSampleSize || 0);
    // CFB Weeks 1-4 provisional EZPZ gate: require more history while preserving
    // the underlying Trend Play score/tier and every stored candidate for the
    // Week 5 regression/backtest. NFL retains the existing early-season guardrail.
    const minTrendSampleSize = sport === "NCAAF" ? 8 : 5;
    if (trendSampleSize < minTrendSampleSize) continue;
    const ezpzTrendTier =
      trendSampleSize < 10 && play.tier === "Elite"
        ? "Strong"
        : play.tier;
    if (sport === "NCAAF") {
      const candidateMetrics = footballTrendMetrics(play);
      const opponent = trends
        .filter((candidate) =>
          candidate.gameKey === play.gameKey &&
          candidate.market === play.market &&
          textKey(candidate.selection) !== textKey(play.selection))
        .map((candidate) => ({ candidate, metrics: footballTrendMetrics(candidate) }))
        .filter(({ metrics }) => metrics.hasData)
        .sort((a, b) =>
          b.metrics.score - a.metrics.score ||
          b.metrics.roiPct - a.metrics.roiPct ||
          b.metrics.winPct - a.metrics.winPct)[0];
      const netRoiAdvantage = opponent ? candidateMetrics.roiPct - opponent.metrics.roiPct : Number.NEGATIVE_INFINITY;
      if (!candidateMetrics.hasData || candidateMetrics.roiPct <= 0 || netRoiAdvantage < 25) continue;
    }'''
          text = replace_once(text, old, new, 'backend provisional CFB trend gate')

          old = '''      qualification: "All-green Trend Play • 15%+ net ROI advantage",'''
          new = '''      qualification: sport === "NCAAF"
        ? "All-green Trend Play • 25%+ net ROI advantage • 8+ graded trend sample"
        : "All-green Trend Play • 15%+ net ROI advantage",'''
          text = replace_once(text, old, new, 'backend qualification text')

          old = '''  return [...deduped.values()].sort((a, b) => b.score - a.score || a.game.localeCompare(b.game));
}'''
          new = '''  const sorted = [...deduped.values()].sort((a, b) => b.score - a.score || a.game.localeCompare(b.game));
  if (sport !== "NCAAF") return sorted;
  // One public CFB EZPZ pick per game. If multiple markets qualify, keep the
  // strongest scored pick; same-selection Best + Trend combinations are already merged above.
  const seenGames = new Set<string>();
  return sorted.filter((pick) => {
    const gameKey = textKey(pick.game);
    if (!gameKey || seenGames.has(gameKey)) return false;
    seenGames.add(gameKey);
    return true;
  });
}'''
          text = replace_once(text, old, new, 'backend one CFB EZPZ pick per game')

          old = '''  const recordGroups = sport === "NCAAF"
    ? [
        { betType: "Favorite Spread", rows: tracker.filter((r) => textKey(r["Bet Type"] || r.Market).includes("spread") && (trackerLine(r.Selection) ?? 0) < 0) },
        { betType: "Underdog Spread", rows: tracker.filter((r) => textKey(r["Bet Type"] || r.Market).includes("spread") && (trackerLine(r.Selection) ?? 0) > 0) },
        { betType: "Over", rows: tracker.filter((r) => textKey(r["Bet Type"] || r.Market).includes("total") && textKey(r.Selection).startsWith("over")) },
        { betType: "Under", rows: tracker.filter((r) => textKey(r["Bet Type"] || r.Market).includes("total") && textKey(r.Selection).startsWith("under")) },
      ]
    : ['''
          new = '''  const recordGroups = sport === "NCAAF"
    ? CFB_MODEL_RECORD_TYPES.map((betType) => ({
        betType,
        rows: tracker.filter((row) => footballTrackerRecordType(row, sport) === betType),
      }))
    : ['''
          text = replace_once(text, old, new, 'backend CFB record groups')

          text = text.replace(
              'HOT Best Plays are FINAL immediately; currently qualifying all-green Strong/Elite Trend Plays appear as PENDING',
              'HOT Best Plays are FINAL immediately; currently qualifying all-green Strong/Elite Trend Plays with 25%+ net ROI advantage and 8+ graded trend sample appear as PENDING',
              1,
          )
          text = text.replace(
              'HOT / all-green 10%+ ROI / Strong-Elite / -150 rules.',
              'HOT / all-green 25%+ net ROI / 8+ graded trend sample / Strong-Elite / -150 rules.',
              1,
          )

          backend.write_text(text)

          # ---------------- Legacy CFB public UI ----------------
          frontend = Path('app/FootballBoardLegacy.tsx')
          text = frontend.read_text()

          old = '''type FbRecordType = "Spread" | "Total" | "Favorite Spread" | "Underdog Spread" | "Over" | "Under";'''
          new = '''type FbRecordType = string;'''
          text = replace_once(text, old, new, 'frontend record type')

          old = '''const FB_CFB_RECORD_TYPES: FbRecordType[] = ["Favorite Spread", "Underdog Spread", "Over", "Under"];
const FB_NFL_RECORD_TYPES: FbRecordType[] = ["Spread", "Total"];'''
          new = '''const FB_CFB_RECORD_TYPES: FbRecordType[] = [
  "A Spread Favorite",
  "A Spread Underdog",
  "A Points/Total Over",
  "A Points/Total Under",
  "B Spread Favorite",
  "B Spread Underdog",
  "B Points/Total Over",
  "B Points/Total Under",
];
const FB_NFL_RECORD_TYPES: FbRecordType[] = ["Spread", "Total"];

function fbGradeBucket(value: unknown) {
  const grade = textKey(value);
  if (grade === "a" || grade.startsWith("a ")) return "A";
  if (grade === "b" || grade.startsWith("b ")) return "B";
  return "";
}

function fbCfbRecordType(base: FbRecordType, gradeValue: unknown): FbRecordType {
  const grade = fbGradeBucket(gradeValue);
  if (!grade) return base;
  if (base === "Favorite Spread") return `${grade} Spread Favorite`;
  if (base === "Underdog Spread") return `${grade} Spread Underdog`;
  if (base === "Over") return `${grade} Points/Total Over`;
  if (base === "Under") return `${grade} Points/Total Under`;
  return `${grade} ${base}`.trim();
}'''
          text = replace_once(text, old, new, 'frontend CFB record helpers')

          old = '''function fbTrackerRecordType(row: SheetRow, sport: Sport): FbRecordType | null {
  const marketKey = textKey(row["Bet Type"] || row.Market);
  if (sport === "NFL") return marketKey.includes("total") ? "Total" : marketKey.includes("spread") ? "Spread" : null;
  if (marketKey.includes("total")) return fbRecordTypeForSelection("Total", row.Selection, fbTrailingLine(row.Selection));
  if (marketKey.includes("spread")) return fbRecordTypeForSelection("Spread", row.Selection, fbTrailingLine(row.Selection));
  return null;
}'''
          new = '''function fbTrackerRecordType(row: SheetRow, sport: Sport): FbRecordType | null {
  const marketKey = textKey(row["Bet Type"] || row.Market);
  if (sport === "NFL") return marketKey.includes("total") ? "Total" : marketKey.includes("spread") ? "Spread" : null;
  const base = marketKey.includes("total")
    ? fbRecordTypeForSelection("Total", row.Selection, fbTrailingLine(row.Selection))
    : marketKey.includes("spread")
      ? fbRecordTypeForSelection("Spread", row.Selection, fbTrailingLine(row.Selection))
      : null;
  return base ? fbCfbRecordType(base, row.Grade || row["Model Grade"]) : null;
}'''
          text = replace_once(text, old, new, 'frontend tracker record type')

          old = '''function fbBestPlayRecordType(play: Play, split: DraftKingsSplit | undefined, sport: Sport): FbRecordType | null {
  const market: "Spread" | "Total" = textKey(play.role || play.playType).includes("total") ? "Total" : "Spread";
  if (sport === "NFL") return market;
  if (market === "Total") return fbRecordTypeForSelection(market, split?.side || play.play, split?.line ?? fbTrailingLine(play.play));
  return fbRecordTypeForSelection(market, play.play, split?.line ?? fbTrailingLine(play.play));
}'''
          new = '''function fbBestPlayRecordType(play: Play, split: DraftKingsSplit | undefined, sport: Sport): FbRecordType | null {
  const market: "Spread" | "Total" = textKey(play.role || play.playType).includes("total") ? "Total" : "Spread";
  if (sport === "NFL") return market;
  const base = market === "Total"
    ? fbRecordTypeForSelection(market, split?.side || play.play, split?.line ?? fbTrailingLine(play.play))
    : fbRecordTypeForSelection(market, play.play, split?.line ?? fbTrailingLine(play.play));
  return base ? fbCfbRecordType(base, play.playType) : null;
}'''
          text = replace_once(text, old, new, 'frontend best-play record type')

          old = '''function fbEzpzRecordType(pick: EzpzPick, splits: DraftKingsSplit[], sport: Sport): FbRecordType | null {
  if (sport === "NFL") return pick.market;
  const split = fbPickSplit(pick, splits);
  return fbRecordTypeForSelection(pick.market, pick.market === "Total" ? split?.side || pick.selection : pick.selection, split?.line ?? fbTrailingLine(pick.selection));
}'''
          new = '''function fbEzpzRecordType(pick: EzpzPick, splits: DraftKingsSplit[], sport: Sport): FbRecordType | null {
  if (sport === "NFL") return pick.market;
  const split = fbPickSplit(pick, splits);
  const base = fbRecordTypeForSelection(pick.market, pick.market === "Total" ? split?.side || pick.selection : pick.selection, split?.line ?? fbTrailingLine(pick.selection));
  return base ? fbCfbRecordType(base, pick.tier) : null;
}'''
          text = replace_once(text, old, new, 'frontend EZPZ record type')

          old = '''  if (!play || (play.tier !== "Strong" && play.tier !== "Elite")) return false;
  if (Number(play.TrendSampleSize || 0) < 5) return false;
  if (!play.signals?.length) return false;'''
          new = '''  if (!play || (play.tier !== "Strong" && play.tier !== "Elite")) return false;
  const minTrendSampleSize = sport === "NCAAF" ? 8 : 5;
  if (Number(play.TrendSampleSize || 0) < minTrendSampleSize) return false;
  if (!play.signals?.length) return false;'''
          text = replace_once(text, old, new, 'frontend CFB sample gate')

          old = '''  const roi = fbTrendNetRoiSummary(play, trendPlays);
  if (!roi || roi.candidateRoiPct <= 0 || roi.netRoiPct < 15) return false;'''
          new = '''  const roi = fbTrendNetRoiSummary(play, trendPlays);
  const minNetRoiAdvantage = sport === "NCAAF" ? 25 : 15;
  if (!roi || roi.candidateRoiPct <= 0 || roi.netRoiPct < minNetRoiAdvantage) return false;'''
          text = replace_once(text, old, new, 'frontend CFB ROI gate')

          old = '''        {sport === "NCAAF" ? <>
          <RecordTile label="Favorite Spread - Running Total" value={summaryMap.get("Favorite Spread")} />
          <RecordTile label="Underdog Spread - Running Total" value={summaryMap.get("Underdog Spread")} />
          <RecordTile label="Over - Running Total" value={summaryMap.get("Over")} />
          <RecordTile label="Under - Running Total" value={summaryMap.get("Under")} />
        </> : (data.recordSummary || []).map((row) =>
          <RecordTile key={row.betType} label={`${row.betType} - Running Total`} value={row} />
        )}'''
          new = '''        {(data.recordSummary || []).map((row) =>
          <RecordTile key={row.betType} label={`${row.betType} - Running Total`} value={row} />
        )}'''
          text = replace_once(text, old, new, 'frontend record tiles')

          old = '''<div className="sectionHead"><div><h2>Bet Type Records</h2><p>{sport === "NFL" ? "Exact A/B grade + market + direction subsets used by HOT / COLD / SMALL SAMPLE" : "Spread and Total Best Play performance"}</p></div></div>'''
          new = '''<div className="sectionHead"><div><h2>Bet Type Records</h2><p>Exact A/B grade + market + direction subsets used by HOT / COLD / SMALL SAMPLE</p></div></div>'''
          text = replace_once(text, old, new, 'frontend record section copy')

          old = '''<FbRecordDropdown title="Last 7 Days Best Plays" subtitle={sport === "NFL" ? "Exact NFL grade / market / direction records" : "Spread + Total qualified model records"} rows={data.last7RecordSummary || []} defaultOpen />
        <FbRecordDropdown title="Overall Best Plays" subtitle={sport === "NFL" ? "Running exact NFL grade / market / direction records" : "Running Spread + Total records"} rows={data.recordSummary || []} />'''
          new = '''<FbRecordDropdown title="Last 7 Days Best Plays" subtitle={`Exact ${sport} grade / market / direction records`} rows={data.last7RecordSummary || []} defaultOpen />
        <FbRecordDropdown title="Overall Best Plays" subtitle={`Running exact ${sport} grade / market / direction records`} rows={data.recordSummary || []} />'''
          text = replace_once(text, old, new, 'frontend record dropdown copy')

          frontend.write_text(text)
          PY

      - name: Verify CFB policy changes
        shell: bash
        run: |
          grep -Fq '"A Spread Favorite"' lib/footballPublicDataLegacy.ts
          grep -Fq '"B Points/Total Under"' lib/footballPublicDataLegacy.ts
          grep -Fq 'footballCfbRecordType(base, row.Grade || row["Model Grade"])' lib/footballPublicDataLegacy.ts
          grep -Fq 'const minTrendSampleSize = sport === "NCAAF" ? 8 : 5;' lib/footballPublicDataLegacy.ts
          grep -Fq 'netRoiAdvantage < 25' lib/footballPublicDataLegacy.ts
          grep -Fq '25%+ net ROI advantage • 8+ graded trend sample' lib/footballPublicDataLegacy.ts
          grep -Fq 'One public CFB EZPZ pick per game' lib/footballPublicDataLegacy.ts
          grep -Fq 'CFB_MODEL_RECORD_TYPES.map' lib/footballPublicDataLegacy.ts
          grep -Fq '"A Spread Favorite"' app/FootballBoardLegacy.tsx
          grep -Fq 'const minTrendSampleSize = sport === "NCAAF" ? 8 : 5;' app/FootballBoardLegacy.tsx
          grep -Fq 'const minNetRoiAdvantage = sport === "NCAAF" ? 25 : 15;' app/FootballBoardLegacy.tsx
          grep -Fq 'fbCfbRecordType(base, play.playType)' app/FootballBoardLegacy.tsx
          git diff --check

      - name: Build application
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- lib/footballPublicDataLegacy.ts app/FootballBoardLegacy.tsx; then
            echo 'CFB policy and record subsets are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/footballPublicDataLegacy.ts app/FootballBoardLegacy.tsx
          git commit -m 'cfb: tighten early EZPZ gate and split model records'
          git pull --rebase origin main
          git push origin HEAD:main

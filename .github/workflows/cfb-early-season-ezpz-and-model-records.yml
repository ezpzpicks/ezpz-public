name: Apply CFB early-season EZPZ and model record rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-early-season-ezpz-and-model-records.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CFB policy and record-subset updates
        run: python scripts/apply_cfb_early_season_patch.py

      - name: Verify CFB policy changes
        shell: bash
        run: |
          grep -Fq '"A Spread Favorite"' lib/footballPublicDataLegacy.ts
          grep -Fq '"B Points/Total Under"' lib/footballPublicDataLegacy.ts
          grep -Fq 'footballCfbRecordType(base, row.Grade || row["Model Grade"])' lib/footballPublicDataLegacy.ts
          grep -Fq 'const minTrendSampleSize = sport === "NCAAF" ? 8 : 5;' lib/footballPublicDataLegacy.ts
          grep -Fq 'netRoiAdvantage < 25' lib/footballPublicDataLegacy.ts
          grep -Fq '25%+ net ROI advantage • 8+ graded trend sample' lib/footballPublicDataLegacy.ts
          grep -Fq 'One public CFB EZPZ pick per game' lib/footballPublicDataLegacy.ts
          grep -Fq 'CFB_MODEL_RECORD_TYPES.map' lib/footballPublicDataLegacy.ts
          grep -Fq '"A Spread Favorite"' app/FootballBoardLegacy.tsx
          grep -Fq 'const minTrendSampleSize = sport === "NCAAF" ? 8 : 5;' app/FootballBoardLegacy.tsx
          grep -Fq 'const minNetRoiAdvantage = sport === "NCAAF" ? 25 : 15;' app/FootballBoardLegacy.tsx
          grep -Fq 'fbCfbRecordType(base, play.playType)' app/FootballBoardLegacy.tsx
          git diff --check

      - name: Build application
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- lib/footballPublicDataLegacy.ts app/FootballBoardLegacy.tsx; then
            echo 'CFB policy and record subsets are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/footballPublicDataLegacy.ts app/FootballBoardLegacy.tsx
          git commit -m 'cfb: tighten early EZPZ gate and split model records'
          git pull --rebase origin main
          git push origin HEAD:main

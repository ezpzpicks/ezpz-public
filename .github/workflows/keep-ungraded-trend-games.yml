name: Show all tracked trend sides

on:
  push:
    paths:
      - .github/workflows/keep-ungraded-trend-games.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Trend Plays board
        run: python .github/scripts/show_all_trend_sides.py
      - name: Validate and commit
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Show all four tracked sides on trend cards"
          git push origin HEAD:main

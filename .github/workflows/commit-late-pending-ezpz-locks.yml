name: Commit late pending EZPZ locks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commit-late-pending-ezpz-locks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration script
        shell: bash
        run: |
          awk '
            /python - <<.PY./ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/allow-late-pending-ezpz-locks.yml > /tmp/late-lock-patch.py
          python /tmp/late-lock-patch.py

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Allow late EZPZ locks from saved pending snapshots"
          git push

name: Fix football missed-lock recovery

on:
  push:
    paths:
      - .github/workflows/fix-football-missed-lock-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply missed-lock recovery patch
        run: python scripts/fix_football_missed_lock_recovery.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "ezpzpicks"
          git config user.email "ryanpaez5@gmail.com"
          git add lib/footballWeeklyMarket.ts
          git commit -m "Recover football locks from fresh near-kick snapshots"
          git push

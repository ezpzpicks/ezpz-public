name: Apply Frontend Doubleheader Fix

on:
  push:
    branches:
      - agent/fix-doubleheaders

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-doubleheaders

      - name: Apply frontend doubleheader patch
        run: python scripts/apply_frontend_doubleheader_fix.py

      - name: Verify alert monitor self-test
        run: node scripts/draftkings_odds_alerts.mjs --self-test

      - name: Type-check public site
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit frontend fix
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo "Frontend doubleheader fix already applied."
            exit 0
          fi
          git config user.name "ezpzpicks"
          git config user.email "ryanpaez5@gmail.com"
          git add app/page.tsx
          git commit -m "Make DraftKings frontend matching doubleheader-safe"
          git push origin HEAD:agent/fix-doubleheaders

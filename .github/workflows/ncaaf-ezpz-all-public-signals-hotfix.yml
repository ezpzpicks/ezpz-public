name: One-time NCAAF Sharp threshold hotfix

on:
  push:
    paths:
      - ".github/workflows/ncaaf-ezpz-all-public-signals-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set NCAAF Sharp threshold to 25 percent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/footballPublicDataCore.ts')
          text = path.read_text()
          old = 'EZPZ_SHARP_MIN_MONEY_OVER_BETS_PCT: Record<FootballSport, number> = { NFL: 25, NCAAF: 40 }'
          new = 'EZPZ_SHARP_MIN_MONEY_OVER_BETS_PCT: Record<FootballSport, number> = { NFL: 25, NCAAF: 25 }'
          count = text.count(old)
          if count != 1:
            raise SystemExit(f'Expected exactly one old NCAAF Sharp threshold, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify NCAAF Sharp threshold
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('lib/footballPublicDataCore.ts').read_text()
          expected = 'EZPZ_SHARP_MIN_MONEY_OVER_BETS_PCT: Record<FootballSport, number> = { NFL: 25, NCAAF: 25 }'
          assert expected in text
          PY
          git diff --check

      - name: Commit NCAAF Sharp threshold fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicDataCore.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Set NCAAF Sharp threshold to 25 percent"
          git push

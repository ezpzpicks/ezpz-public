name: Verify team logo parity

on:
  push:
    branches:
      - team-logo-parity
    paths:
      - scripts/apply_team_logo_parity.py
      - .github/workflows/team-logo-parity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team-logo-parity

      - name: Apply team logo parity
        run: python scripts/apply_team_logo_parity.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified app changes
        run: |
          git config user.name "EZPZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/FootballBoard.tsx app/FootballBoardLegacy.tsx app/TeamLogoName.tsx app/api/team-logos/route.ts
          if git diff --cached --quiet; then
            echo "No app changes to commit."
            exit 0
          fi
          git commit -m "Add team logos across football boards"
          git push origin HEAD:team-logo-parity

name: Apply HOT Pending AI Selector Update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  patch:
    if: github.event.issue.title == 'APPLY HOT PENDING AI SELECTOR UPDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply selector patch
        shell: bash
        run: |
          python .github/scripts/hot_pending_ai_patch.py
          git diff --check

      - name: Restore normal workflow files and commit route update
        shell: bash
        run: |
          # Restore the normal DraftKings snapshot workflow from the clean commit
          # before these one-time patch helpers were introduced.
          git show 4ffa3c307da9b319954b6e7542986c389f9fbd87:.github/workflows/draftkings_snapshot.yml > .github/workflows/draftkings_snapshot.yml
          git rm .github/scripts/hot_pending_ai_patch.py
          git rm .github/workflows/hot-pending-ai-issue-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data/route.ts .github/workflows/draftkings_snapshot.yml
          git commit -m "Let HOT Best Plays enter pending AI review"
          git push origin HEAD:main

name: Fix Full Slate MLB parity

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/fix-full-slate-mlb-parity.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch football Full Slate
        run: python scripts/fix_full_slate_mlb_parity.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified change
        run: |
          git config user.name "EZPZ automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/FootballBoardLegacy.tsx
          if git diff --cached --quiet; then
            echo "No app change to commit."
            exit 0
          fi
          git commit -m "Align football Full Slate with MLB"
          git push

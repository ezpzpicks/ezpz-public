name: MLB Whiff Matchup Regression

# Isolated analysis workflow; does not deploy or modify production.
# Corrected snapshot-join run.
on:
  push:
    branches:
      - analysis/whiff-matchup-regression
    paths:
      - 'analysis/whiff_matchup_regression_v2.py'
      - '.github/workflows/whiff_matchup_regression.yml'
  workflow_dispatch:

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy scipy statsmodels

      - name: Fetch public MLB pitch archive (2023-2026 monthly only)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lancebroz/mlb-pitcher-data.git /tmp/mlb-pitcher-data
          cd /tmp/mlb-pitcher-data
          git sparse-checkout init --cone
          git sparse-checkout set data/raw/2023/monthly data/raw/2024/monthly data/raw/2025/monthly data/raw/2026/monthly
          git checkout main

      - name: Run regression
        run: python analysis/whiff_matchup_regression_v2.py

      - name: Upload regression outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiff-matchup-regression-results
          path: analysis_output/
          if-no-files-found: warn

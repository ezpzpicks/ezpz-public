name: Fix football append-only line history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-football-line-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply durable football market history patch
        run: python scripts/fix_football_line_history.py

      - name: Verify source changes
        run: |
          grep -q 'appendSportRows' lib/sportSheets.ts
          grep -q 'MARKET_HISTORY_TAB = "odds_snapshot"' lib/footballWeeklyMarket.ts
          grep -q 'marketHistoryRowsAppended' lib/footballWeeklyMarket.ts
          grep -q 'Total Line History' lib/footballWeeklyMarket.ts
          grep -q 'Line Path' app/FootballBoard.tsx

      - name: Build application
        run: |
          npm ci
          npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sportSheets.ts lib/footballWeeklyMarket.ts app/FootballBoard.tsx
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Persist full football line movement history"
          git push

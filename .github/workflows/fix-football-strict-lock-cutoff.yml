name: Enforce strict football lock cutoff

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-football-strict-lock-cutoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Freeze the last snapshot at or before the advertised cutoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/footballPublicData.ts")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              if new in text:
                  print(f"{label}: already applied")
                  return
              if old not in text:
                  raise SystemExit(f"Could not find patch target: {label}")
              text = text.replace(old, new, 1)
              print(f"{label}: applied")

          marker = '''function emptyRecord(): TrendRecord { return { record: "0-0-0", totalBets: 0, wins: 0, losses: 0, pushes: 0, winPct: 0, roiPct: 0, unitsWon: 0 }; }'''
          helper = '''function finiteSnapshotNumber(value: unknown) {
            if (value == null || String(value).trim() === "") return null;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
          }

          function splitFromPersistedSnapshot(split: DraftKingsSplit, snapshot: SheetRow | undefined): DraftKingsSplit | null {
            if (!snapshot) return null;
            const betsPct = finiteSnapshotNumber(snapshot["Public Bets %"] ?? snapshot["Current Public %"]) ?? split.betsPct;
            const moneyPct = finiteSnapshotNumber(snapshot["Public Money %"] ?? snapshot["Current Sharp %"]) ?? split.moneyPct;
            const warning = warningFor(betsPct, moneyPct);
            const odds = String(snapshot.Odds || split.odds);
            const movementTone = String(snapshot["Line Movement Tone"] || "");
            const movementBasis = String(snapshot["Line Movement Basis"] || "");
            return {
              ...split,
              line: numericLine(snapshot.Line) ?? split.line,
              odds,
              betsPct,
              moneyPct,
              gapPct: finiteSnapshotNumber(snapshot["Public Gap %"]) ?? Math.round((moneyPct - betsPct) * 10) / 10,
              ...warning,
              openingLine: numericLine(snapshot["Opening Line"]) ?? split.openingLine,
              openingOdds: String(snapshot["Opening Odds"] || split.openingOdds || odds),
              openingSnapshotTime: String(snapshot["Opening Snapshot Time ET"] || split.openingSnapshotTime || snapshot["Snapshot Time ET"] || ""),
              openingBetsPct: finiteSnapshotNumber(snapshot["Opening Public %"]) ?? split.openingBetsPct ?? betsPct,
              openingMoneyPct: finiteSnapshotNumber(snapshot["Opening Sharp %"]) ?? split.openingMoneyPct ?? moneyPct,
              openingImpliedPct: finiteSnapshotNumber(snapshot["Opening Implied %"]) ?? split.openingImpliedPct ?? impliedPct(snapshot["Opening Odds"] || odds),
              currentImpliedPct: finiteSnapshotNumber(snapshot["Current Implied %"]) ?? impliedPct(odds),
              publicMovementPct: finiteSnapshotNumber(snapshot["Public Change %"]) ?? split.publicMovementPct ?? 0,
              sharpMovementPct: finiteSnapshotNumber(snapshot["Sharp Change %"]) ?? split.sharpMovementPct ?? 0,
              lineMovementSignal: String(snapshot["Line Movement Signal"] || ""),
              lineMovementTone: (["negative", "caution", "positive", "neutral"].includes(movementTone) ? movementTone : "") as Tone | "",
              lineMovementBasis: (["Implied Probability", "Spread Line", "Total Line"].includes(movementBasis) ? movementBasis : "") as DraftKingsSplit["lineMovementBasis"],
              lineMovementValue: finiteSnapshotNumber(snapshot["Line Movement Value"]),
              snapshotTime: String(snapshot["Snapshot Time ET"] || split.snapshotTime || ""),
            };
          }

          ''' + marker
          replace_once(marker, helper, "Persisted snapshot reconstruction")

          old = '''    selection:split.market==="Total"?split.side:split.selectionTeam, selectionTeam:split.selectionTeam, side:split.side, sideGroup:split.sideGroup, line:split.line, odds:split.odds,
            betsPct:split.betsPct,moneyPct:split.moneyPct,gapPct:split.gapPct,openingBetsPct:split.openingBetsPct,openingMoneyPct:split.openingMoneyPct,publicMovementPct:split.publicMovementPct,sharpMovementPct:split.sharpMovementPct,openingLine:split.openingLine,openingOdds:split.openingOdds,openingImpliedPct:split.openingImpliedPct,currentImpliedPct:split.currentImpliedPct,lineMovementBasis:split.lineMovementBasis,lineMovementValue:split.lineMovementValue,score:baseScore,baseScore,tier:"Pass",signals,updatedAt:nowET(),snapshotStatus:"LIVE" };
          }'''
          new = '''    selection:split.market==="Total"?split.side:split.selectionTeam, selectionTeam:split.selectionTeam, side:split.side, sideGroup:split.sideGroup, line:split.line, odds:split.odds,
            betsPct:split.betsPct,moneyPct:split.moneyPct,gapPct:split.gapPct,openingBetsPct:split.openingBetsPct,openingMoneyPct:split.openingMoneyPct,publicMovementPct:split.publicMovementPct,sharpMovementPct:split.sharpMovementPct,openingLine:split.openingLine,openingOdds:split.openingOdds,openingImpliedPct:split.openingImpliedPct,currentImpliedPct:split.currentImpliedPct,lineMovementBasis:split.lineMovementBasis,lineMovementValue:split.lineMovementValue,score:baseScore,baseScore,tier:"Pass",signals,updatedAt:split.snapshotTime||nowET(),snapshotStatus:"LIVE" };
          }'''
          replace_once(old, new, "Use market snapshot timestamp on trend play")

          old = '''  const dk=await loadDraftKingsSplits(sport,trackingSlate); const snapshotMap=new Map(snapshotExisting.map((row)=>[snapshotKey(row),row])); const enrichedTracking=dk.splits.map((split)=>movementForSplit(split,snapshotMap.get(splitSnapshotKey(split))));
            const snapshotStamp=nowET();
            const currentSnapshots=enrichedTracking.flatMap((split)=>{
              const slateRow=findSlateForSplit(split,trackingSlate,sport);
              const minutesToKickoff=minutesUntilDraftKingsKickoff(split) ?? (slateRow?minutesUntilKickoff(slateRow):null);
              // Once a side has an authoritative FINAL_PREGAME trend, its persisted
              // market row is immutable. After kickoff we also refuse to write a late
              // snapshot and falsely call it a verified pregame lock.
              if(splitHasAuthoritativeFinalTrend(trendExisting,split,sport)) return [];
              if(minutesToKickoff!=null&&minutesToKickoff<0) return [];
              return [snapshotRow({...split,snapshotTime:snapshotStamp})];
            });'''
          new = '''  const dk=await loadDraftKingsSplits(sport,trackingSlate); const snapshotMap=new Map(snapshotExisting.map((row)=>[snapshotKey(row),row]));
            const enrichedTrackingLive=dk.splits.map((split)=>movementForSplit(split,snapshotMap.get(splitSnapshotKey(split))));
            // If a scheduled refresh lands after the advertised T-15 cutoff, use the
            // last persisted pre-cutoff market instead of accepting newer market data.
            // At exactly T-15 the current scrape is valid and can become the final lock.
            const enrichedTracking=enrichedTrackingLive.flatMap((split)=>{
              const slateRow=findSlateForSplit(split,trackingSlate,sport);
              const minutesToKickoff=minutesUntilDraftKingsKickoff(split) ?? (slateRow?minutesUntilKickoff(slateRow):null);
              if(minutesToKickoff!=null&&minutesToKickoff<15){
                const persisted=splitFromPersistedSnapshot(split,snapshotMap.get(splitSnapshotKey(split)));
                return persisted?[persisted]:[];
              }
              return [split];
            });
            const snapshotStamp=nowET();
            const currentSnapshots=enrichedTrackingLive.flatMap((split)=>{
              const slateRow=findSlateForSplit(split,trackingSlate,sport);
              const minutesToKickoff=minutesUntilDraftKingsKickoff(split) ?? (slateRow?minutesUntilKickoff(slateRow):null);
              // Once a side has an authoritative FINAL_PREGAME trend, its persisted
              // market row is immutable. Never overwrite the last verified snapshot
              // after the advertised T-15 cutoff.
              if(splitHasAuthoritativeFinalTrend(trendExisting,split,sport)) return [];
              if(minutesToKickoff!=null&&minutesToKickoff<15) return [];
              return [snapshotRow({...split,snapshotTime:snapshotStamp})];
            });'''
          replace_once(old, new, "Strict T-15 snapshot cutoff")

          old = '''    const locked=minutesToKickoff!=null&&minutesToKickoff<=15&&minutesToKickoff>=0;
              const stamp=nowET();
              return{...row,"Public Bets %":String(split.betsPct),"Public Money %":String(split.moneyPct),"Public Gap %":String(split.gapPct),"Public Warning":split.warning,"Public Warning Negative":split.warningNegative?"TRUE":"FALSE","Public Split Source":"DraftKings","Public Split Market":split.market,"Public Split Selection":split.market==="Total"?split.side:split.selectionTeam,"Public Split Line":split.line==null?"":String(split.line),"Public Split Odds":split.odds,"Public Split Match Confidence":locked?"Final 15-minute football market lock":"Live weekly football market","Public Split Snapshot Time":stamp,'''
          new = '''    const locked=minutesToKickoff!=null&&minutesToKickoff<=15&&minutesToKickoff>=0;
              const stamp=nowET();
              const marketStamp=locked&&split.snapshotTime?split.snapshotTime:stamp;
              return{...row,"Public Bets %":String(split.betsPct),"Public Money %":String(split.moneyPct),"Public Gap %":String(split.gapPct),"Public Warning":split.warning,"Public Warning Negative":split.warningNegative?"TRUE":"FALSE","Public Split Source":"DraftKings","Public Split Market":split.market,"Public Split Selection":split.market==="Total"?split.side:split.selectionTeam,"Public Split Line":split.line==null?"":String(split.line),"Public Split Odds":split.odds,"Public Split Match Confidence":locked?"Final 15-minute football market lock":"Live weekly football market","Public Split Snapshot Time":marketStamp,'''
          replace_once(old, new, "Preserve pre-cutoff timestamp")

          old = '''"Opening Public Split Snapshot Time":split.openingSnapshotTime||String(snapshotMap.get(splitSnapshotKey(split))?.["Opening Snapshot Time ET"]||stamp),'''
          new = '''"Opening Public Split Snapshot Time":split.openingSnapshotTime||String(snapshotMap.get(splitSnapshotKey(split))?.["Opening Snapshot Time ET"]||marketStamp),'''
          replace_once(old, new, "Opening snapshot timestamp fallback")

          old = '''"Trend Score Details":play?JSON.stringify({...play,frozenAt:locked?stamp:undefined,snapshotStatus:locked?"FINAL_PREGAME":"LIVE",gradingVersion:locked?FROZEN_TREND_GRADING_VERSION:undefined}):""};'''
          new = '''"Trend Score Details":play?JSON.stringify({...play,frozenAt:locked?marketStamp:undefined,snapshotStatus:locked?"FINAL_PREGAME":"LIVE",gradingVersion:locked?FROZEN_TREND_GRADING_VERSION:undefined}):""};'''
          replace_once(old, new, "Freeze actual verified snapshot timestamp")

          path.write_text(text)
          PY

      - name: Verify strict cutoff source
        shell: bash
        run: |
          grep -q 'splitFromPersistedSnapshot' lib/footballPublicData.ts
          grep -q 'minutesToKickoff<15' lib/footballPublicData.ts
          grep -q 'updatedAt:split.snapshotTime||nowET()' lib/footballPublicData.ts
          grep -q 'const marketStamp=locked&&split.snapshotTime?split.snapshotTime:stamp' lib/footballPublicData.ts

      - name: Commit strict cutoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicData.ts
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Enforce football trend lock cutoff"
          git push

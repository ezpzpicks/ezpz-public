name: Enforce strict football lock cutoff

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-football-strict-lock-cutoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Freeze the last snapshot at or before the advertised cutoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/footballPublicData.ts")
          text = path.read_text()

          def must_replace(old: str, new: str, label: str):
              global text
              if new in text:
                  print(f"{label}: already applied")
                  return
              if old not in text:
                  raise SystemExit(f"Could not find patch target: {label}")
              text = text.replace(old, new, 1)
              print(f"{label}: applied")

          marker = 'function emptyRecord(): TrendRecord { return { record: "0-0-0", totalBets: 0, wins: 0, losses: 0, pushes: 0, winPct: 0, roiPct: 0, unitsWon: 0 }; }'
          helper = '''function finiteSnapshotNumber(value: unknown) {
            if (value == null || String(value).trim() === "") return null;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
          }

          function splitFromPersistedSnapshot(split: DraftKingsSplit, snapshot: SheetRow | undefined): DraftKingsSplit | null {
            if (!snapshot) return null;
            const betsPct = finiteSnapshotNumber(snapshot["Public Bets %"] ?? snapshot["Current Public %"]) ?? split.betsPct;
            const moneyPct = finiteSnapshotNumber(snapshot["Public Money %"] ?? snapshot["Current Sharp %"]) ?? split.moneyPct;
            const warning = warningFor(betsPct, moneyPct);
            const odds = String(snapshot.Odds || split.odds);
            const movementTone = String(snapshot["Line Movement Tone"] || "");
            const movementBasis = String(snapshot["Line Movement Basis"] || "");
            return {
              ...split,
              line: numericLine(snapshot.Line) ?? split.line,
              odds,
              betsPct,
              moneyPct,
              gapPct: finiteSnapshotNumber(snapshot["Public Gap %"]) ?? Math.round((moneyPct - betsPct) * 10) / 10,
              ...warning,
              openingLine: numericLine(snapshot["Opening Line"]) ?? split.openingLine,
              openingOdds: String(snapshot["Opening Odds"] || split.openingOdds || odds),
              openingSnapshotTime: String(snapshot["Opening Snapshot Time ET"] || split.openingSnapshotTime || snapshot["Snapshot Time ET"] || ""),
              openingBetsPct: finiteSnapshotNumber(snapshot["Opening Public %"]) ?? split.openingBetsPct ?? betsPct,
              openingMoneyPct: finiteSnapshotNumber(snapshot["Opening Sharp %"]) ?? split.openingMoneyPct ?? moneyPct,
              openingImpliedPct: finiteSnapshotNumber(snapshot["Opening Implied %"]) ?? split.openingImpliedPct ?? impliedPct(snapshot["Opening Odds"] || odds),
              currentImpliedPct: finiteSnapshotNumber(snapshot["Current Implied %"]) ?? impliedPct(odds),
              publicMovementPct: finiteSnapshotNumber(snapshot["Public Change %"]) ?? split.publicMovementPct ?? 0,
              sharpMovementPct: finiteSnapshotNumber(snapshot["Sharp Change %"]) ?? split.sharpMovementPct ?? 0,
              lineMovementSignal: String(snapshot["Line Movement Signal"] || ""),
              lineMovementTone: (["negative", "caution", "positive", "neutral"].includes(movementTone) ? movementTone : "") as Tone | "",
              lineMovementBasis: (["Implied Probability", "Spread Line", "Total Line"].includes(movementBasis) ? movementBasis : "") as DraftKingsSplit["lineMovementBasis"],
              lineMovementValue: finiteSnapshotNumber(snapshot["Line Movement Value"]),
              snapshotTime: String(snapshot["Snapshot Time ET"] || split.snapshotTime || ""),
            };
          }

          ''' + marker
          must_replace(marker, helper, "Persisted snapshot reconstruction")

          must_replace(
              'updatedAt:nowET(),snapshotStatus:"LIVE"',
              'updatedAt:split.snapshotTime||nowET(),snapshotStatus:"LIVE"',
              "Use market snapshot timestamp on trend play",
          )

          old_decl = 'const dk=await loadDraftKingsSplits(sport,trackingSlate); const snapshotMap=new Map(snapshotExisting.map((row)=>[snapshotKey(row),row])); const enrichedTracking=dk.splits.map((split)=>movementForSplit(split,snapshotMap.get(splitSnapshotKey(split))));'
          new_decl = '''const dk=await loadDraftKingsSplits(sport,trackingSlate); const snapshotMap=new Map(snapshotExisting.map((row)=>[snapshotKey(row),row]));
            const enrichedTrackingLive=dk.splits.map((split)=>movementForSplit(split,snapshotMap.get(splitSnapshotKey(split))));
            // A scheduled run can drift a few minutes. Once it is past T-15, do not
            // use the new scrape: reconstruct the market from the last stored snapshot.
            const enrichedTracking=enrichedTrackingLive.flatMap((split)=>{
              const slateRow=findSlateForSplit(split,trackingSlate,sport);
              const minutesToKickoff=minutesUntilDraftKingsKickoff(split) ?? (slateRow?minutesUntilKickoff(slateRow):null);
              if(minutesToKickoff!=null&&minutesToKickoff<15){
                const persisted=splitFromPersistedSnapshot(split,snapshotMap.get(splitSnapshotKey(split)));
                return persisted?[persisted]:[];
              }
              return [split];
            });'''
          must_replace(old_decl, new_decl, "Strict T-15 effective market")

          must_replace(
              'const currentSnapshots=enrichedTracking.flatMap((split)=>{',
              'const currentSnapshots=enrichedTrackingLive.flatMap((split)=>{',
              "Persist only from live pre-cutoff feed",
          )
          must_replace(
              'if(minutesToKickoff!=null&&minutesToKickoff<0) return [];',
              'if(minutesToKickoff!=null&&minutesToKickoff<15) return [];',
              "Stop snapshot persistence after T-15",
          )

          must_replace(
              'const locked=minutesToKickoff!=null&&minutesToKickoff<=15&&minutesToKickoff>=0;\n    const stamp=nowET();',
              'const locked=minutesToKickoff!=null&&minutesToKickoff<=15&&minutesToKickoff>=0;\n    const stamp=nowET();\n    const marketStamp=locked&&split.snapshotTime?split.snapshotTime:stamp;',
              "Preserve verified market timestamp",
          )
          must_replace('"Public Split Snapshot Time":stamp', '"Public Split Snapshot Time":marketStamp', "Use verified snapshot time")
          must_replace(
              '"Opening Public Split Snapshot Time":split.openingSnapshotTime||String(snapshotMap.get(splitSnapshotKey(split))?.["Opening Snapshot Time ET"]||stamp)',
              '"Opening Public Split Snapshot Time":split.openingSnapshotTime||String(snapshotMap.get(splitSnapshotKey(split))?.["Opening Snapshot Time ET"]||marketStamp)',
              "Opening timestamp fallback",
          )
          must_replace(
              'frozenAt:locked?stamp:undefined',
              'frozenAt:locked?marketStamp:undefined',
              "Freeze actual verified timestamp",
          )

          path.write_text(text)
          PY

      - name: Verify strict cutoff source
        shell: bash
        run: |
          grep -q 'splitFromPersistedSnapshot' lib/footballPublicData.ts
          grep -q 'enrichedTrackingLive' lib/footballPublicData.ts
          grep -q 'minutesToKickoff<15' lib/footballPublicData.ts
          grep -q 'updatedAt:split.snapshotTime||nowET()' lib/footballPublicData.ts
          grep -q 'const marketStamp=locked&&split.snapshotTime?split.snapshotTime:stamp' lib/footballPublicData.ts

      - name: Commit strict cutoff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/footballPublicData.ts
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Enforce football trend lock cutoff"
          git push

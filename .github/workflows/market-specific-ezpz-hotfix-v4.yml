name: One-time market-specific EZPZ qualification update v4

on:
  push:
    paths:
      - ".github/workflows/market-specific-ezpz-hotfix-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct patch guards and apply update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch_market_specific_ezpz.py')
          text = path.read_text()
          replacements = [
              (
                  '''    "AI_HOT_BEST_PLAY_FINAL_MARKER",\n    "AI_BEST_PLAY_FINAL_MARKER",\n    2,\n    "remaining final marker references",''',
                  '''    "AI_HOT_BEST_PLAY_FINAL_MARKER",\n    "AI_BEST_PLAY_FINAL_MARKER",\n    3,\n    "remaining final marker references",''',
              ),
              (
                  '''    "isImmediateHotBestPlayFinal",\n    "isImmediateBestPlayFinal",\n    4,\n    "page immediate-final variable",''',
                  '''    "isImmediateHotBestPlayFinal",\n    "isImmediateBestPlayFinal",\n    3,\n    "page immediate-final variable",''',
              ),
              (
                  '''    'item.startsWith("HOT Best Play is final for the full day")',\n    'item.startsWith("EZPZ Best Play is final for the full day")',\n    2,\n    "page final marker prefix",''',
                  '''    'item.startsWith("HOT Best Play is final for the full day")',\n    'item.startsWith("EZPZ Best Play is final for the full day")',\n    1,\n    "page final marker prefix",''',
              ),
              (
                  '''    "HOT Model Play saved as final for the full day",\n    "EZPZ Best Play saved as final for the full day",\n    2,\n    "page final status label",''',
                  '''    "HOT Model Play saved as final for the full day",\n    "EZPZ Best Play saved as final for the full day",\n    1,\n    "page final status label",''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Could not locate expected patch guard to correct')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python scripts/patch_market_specific_ezpz.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify qualification rules
        shell: bash
        run: |
          grep -q 'ezpz-picks-market-specific-v8' app/api/public-data-core.ts
          grep -q 'minimumReliability: 80' app/api/public-data-core.ts
          grep -q 'minimumSelectedProbability: 65' app/api/public-data-core.ts
          grep -q 'function finalizeImmediateBestPlays' app/api/public-data-core.ts
          grep -q 'EZPZ Best Play is final for the full day' app/page.tsx
          ! grep -q 'EZPZ_BEST_PLAY_POLICY' app/api/public-data-core.ts
          ! grep -q 'aiPitcherQualificationProfile' app/api/public-data-core.ts
          git diff --check

      - name: Commit qualification update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public-data-core.ts app/page.tsx scripts/patch_market_specific_ezpz.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use market-specific EZPZ Best Play qualification"
          git push
